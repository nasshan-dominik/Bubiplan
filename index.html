<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BubiPlan">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#EAF6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="icon" href="icon-192.png">
<title>BubiPlan</title>

<style>
:root {
  --bg: #f2f2f7;
  --card: #fff;
  --card2: #f9f9fb;
  --sep: rgba(60, 60, 67, .15);
  --txt: #000;
  --txt2: #3c3c43;
  --mut: rgba(60, 60, 67, .6);
  --tint: #249A6D;
  --tint2: #1B7752;
  --red: #ff3b30;
  --orange: #ff9500;
  --fill: rgba(120, 120, 128, .12);
  --fill2: rgba(120, 120, 128, .2);
  --nav: rgba(249, 249, 249, .82);
  --sheet: #fff;
  --gond: #fff;
  --shelfline: #3a3a3c;
  --sat: env(safe-area-inset-top);
  --sab: env(safe-area-inset-bottom);
}

@media (prefers-color-scheme:dark) {
  :root {
    --bg: #000;
    --card: #1c1c1e;
    --card2: #2c2c2e;
    --sep: rgba(84, 84, 88, .6);
    --txt: #fff;
    --txt2: #ebebf5;
    --mut: rgba(235, 235, 245, .6);
    --tint: #3ec79a;
    --tint2: #2fae85;
    --fill: rgba(120, 120, 128, .24);
    --fill2: rgba(120, 120, 128, .36);
    --nav: rgba(28, 28, 30, .82);
    --sheet: #1c1c1e;
    --gond: #2c2c2e;
    --shelfline: #8e8e93
  }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent
}

html,
body {
  height: 100%;
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%
}

input {
  -webkit-user-select: text;
  user-select: text;
  font-family: inherit
}

button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer
}

#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column
}

/* NAV */
.nav {
  padding: calc(var(--sat) + 6px) 8px 8px;
  background: var(--nav);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--sep);
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  min-height: calc(var(--sat) + 52px);
  position: relative;
  z-index: 5
}

.nav .t {
  flex: 1;
  text-align: center;
  min-width: 0
}

.nav .t h1 {
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.nav .t small {
  display: block;
  font-size: 11px;
  color: var(--mut);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.nb {
  color: var(--tint);
  font-size: 17px;
  padding: 6px 8px;
  min-width: 40px;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  font-weight: 500
}

.nb:active {
  background: var(--fill)
}

.nb[disabled] {
  opacity: .3;
  pointer-events: none
}

.nb.b {
  font-weight: 600
}

.big {
  padding: 8px 16px 4px;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .2px
}

/* HOME */
.scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain
}

.sec {
  padding: 0 16px 8px;
  font-size: 13px;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: .3px;
  margin-top: 20px
}

.list {
  margin: 0 16px;
  background: var(--card);
  border-radius: 12px;
  overflow: hidden
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  min-height: 64px;
  position: relative
}

.row+.row::before {
  content: "";
  position: absolute;
  left: 16px;
  right: 0;
  top: 0;
  border-top: .5px solid var(--sep)
}

.row:active {
  background: var(--fill)
}

.row .th {
  width: 64px;
  height: 44px;
  border-radius: 8px;
  background: var(--card2);
  flex-shrink: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: .5px solid var(--sep)
}

.row .th svg {
  width: 100%;
  height: 100%
}

.row .tx {
  flex: 1;
  min-width: 0
}

.row .n {
  font-size: 17px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.row .s {
  font-size: 13px;
  color: var(--mut);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px
}

.chev {
  color: var(--fill2);
  font-size: 20px
}

.empty {
  text-align: center;
  padding: 70px 30px;
  color: var(--mut);
  font-size: 15px;
  line-height: 1.5
}

.empty .i {
  font-size: 56px;
  margin-bottom: 10px
}

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: 14px;
  background: var(--tint);
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  margin-top: 18px
}

.pill:active {
  background: var(--tint2)
}

.note {
  margin: 14px 16px 0;
  padding: 12px 14px;
  background: var(--card);
  border-radius: 12px;
  font-size: 13px;
  color: var(--txt2);
  line-height: 1.45
}

.note b {
  color: var(--tint)
}

/* EDITOR */
.ed {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0
}

.seg {
  display: flex;
  background: var(--fill);
  border-radius: 9px;
  padding: 2px;
  margin: 8px 12px 0;
  flex-shrink: 0
}

.seg button {
  flex: 1;
  padding: 7px 4px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  color: var(--txt);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.seg button.on {
  background: var(--card);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
  font-weight: 600
}

.lvl {
  display: flex;
  gap: 6px;
  padding: 8px 12px 4px;
  overflow-x: auto;
  flex-shrink: 0;
  align-items: center
}

.lvl::-webkit-scrollbar {
  display: none
}

.lvl .l {
  padding: 6px 12px;
  border-radius: 16px;
  background: var(--fill);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  color: var(--txt)
}

.lvl .l.on {
  background: var(--tint);
  color: #fff
}

.lvl .l small {
  font-weight: 400;
  opacity: .7;
  margin-left: 4px
}

.lvl .lbl {
  font-size: 12px;
  color: var(--mut);
  white-space: nowrap;
  margin-right: 2px
}

.stats {
  display: flex;
  gap: 6px;
  padding: 4px 12px;
  overflow-x: auto;
  flex-shrink: 0
}

.stats::-webkit-scrollbar {
  display: none
}

.st {
  background: var(--card);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 11px;
  color: var(--mut);
  white-space: nowrap;
  border-left: 3px solid transparent
}

.st b {
  display: block;
  font-size: 15px;
  color: var(--txt);
  font-weight: 600
}

.warn {
  margin: 4px 12px 0;
  background: rgba(255, 149, 0, .14);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--orange);
  font-weight: 500
}

.body {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0
}

.cw {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  padding: 8px 12px;
  display: flex;
  align-items: stretch;
  justify-content: center;
}

.cw svg {
  width: 100%;
  height: 100%;
  background: var(--gond);
  border-radius: 12px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .08)
}

/* DRAWER */
.dr {
  background: var(--card);
  border-radius: 16px 16px 0 0;
  box-shadow: 0 -2px 12px rgba(0, 0, 0, .08);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 46%;
  transition: height .25s cubic-bezier(.2, .8, .2, 1);
  padding-bottom: var(--sab)
}

.dr.min {
  height: calc(58px + var(--sab))
}

.grab {
  width: 36px;
  height: 5px;
  border-radius: 3px;
  background: var(--fill2);
  margin: 6px auto 2px;
  flex-shrink: 0
}

.sb {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px 6px;
  flex-shrink: 0
}

.sb .in {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--fill);
  border-radius: 10px;
  padding: 7px 10px
}

.sb .in input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  font-size: 16px;
  color: var(--txt);
  outline: none
}

.sb .in input::placeholder {
  color: var(--mut)
}

.sb .cnt {
  font-size: 12px;
  color: var(--mut);
  white-space: nowrap
}

.chips {
  display: flex;
  gap: 6px;
  padding: 0 12px 6px;
  overflow-x: auto;
  flex-shrink: 0
}

.chips::-webkit-scrollbar {
  display: none
}

.chip {
  padding: 6px 12px;
  border-radius: 16px;
  background: var(--fill);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  color: var(--txt);
  flex-shrink: 0
}

.chip.on {
  background: var(--tint);
  color: #fff
}

a.chip {
  text-decoration: none;
  color: var(--tint)
}

.dr.min .chips,
.dr.min .pl,
.dr.min .seg {
  display: none
}

.pl {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 12px 8px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
  align-content: start
}

.pi {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  background: var(--card2);
  border-radius: 12px;
  min-height: 66px
}

.pi:active {
  background: var(--fill2);
  transform: scale(.98)
}

.pi .ph {
  width: 48px;
  height: 48px;
  border-radius: 9px;
  flex-shrink: 0;
  background: #fff;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: .5px solid var(--sep)
}

.pi .ph img {
  width: 100%;
  height: 100%;
  object-fit: contain
}

.pi .tx {
  flex: 1;
  min-width: 0
}

.pi .n {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden
}

.pi .r {
  font-size: 11px;
  color: var(--mut);
  margin-top: 2px
}

.pi .bd {
  background: var(--tint);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  border-radius: 10px;
  padding: 2px 7px;
  flex-shrink: 0
}

/* ===== Tablette et grand écran : plus dense, panneau produits plus large ===== */
@media (min-width:900px) {
  .body { flex-direction: row; }

  .dr {
    width: 420px;
    height: auto !important;
    border-radius: 0;
    box-shadow: none;
    border-left: .5px solid var(--sep);
    order: -1;
    padding-bottom: 0;
  }

  .grab,
  .dr .sb .tg { display: none; }

  .dr.min .chips,
  .dr.min .seg { display: flex; }

  .dr.min .pl { display: grid; }

  /* grille de produits : autant de colonnes que la largeur le permet */
  .pl { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 7px; }

  .pi { min-height: 60px; padding: 6px; }
  .pi .ph { width: 44px; height: 44px; }
  .pi .n { font-size: 12.5px; }

  /* barre du haut plus compacte pour laisser la place au rayon */
  .nav { min-height: calc(var(--sat) + 46px); padding-top: calc(var(--sat) + 4px); }
  .lvl, .stats { padding-top: 4px; padding-bottom: 2px; }
  .st { padding: 4px 9px; }
  .cw { padding: 6px 12px; }

  /* les feuilles s'affichent centrées, comme une fenêtre */
  .ov { align-items: center; padding: 24px; }
  .sh { border-radius: 16px; max-width: 560px; }
  .sh .grab { display: none; }
}

/* ===== Grand iPad en paysage : deux colonnes de produits et rayon plus haut ===== */
@media (min-width:1180px) {
  .dr { width: 470px; }
  .pl { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
  .nav h1 { font-size: 19px; }
}


/* PRO V10 */
.sh select {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  font-size: 15px;
  text-align: right;
  color: var(--txt);
  outline: none
}

.kpiGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0
}

.kpiGrid>div {
  background: var(--fill);
  border-radius: 12px;
  padding: 12px
}

.kpiGrid small {
  display: block;
  color: var(--mut);
  font-size: 11px
}

.kpiGrid b {
  display: block;
  font-size: 21px;
  margin-top: 2px
}

.miniTable {
  background: var(--fill);
  border-radius: 12px;
  overflow: hidden;
  margin: 10px 0
}

.miniTable>div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 11px;
  font-size: 11px;
  border-bottom: .5px solid var(--sep)
}

.miniTable>div:last-child {
  border: 0
}

.miniTable span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1
}

.miniTable b {
  white-space: nowrap
}

.perfList {
  display: flex;
  flex-direction: column;
  gap: 10px
}

.perfCard {
  background: var(--fill);
  border-radius: 12px;
  padding: 10px
}

.perfCard>b {
  font-size: 12px;
  display: block;
  margin-bottom: 8px
}

.perfInputs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px
}

.perfInputs label {
  font-size: 10px;
  color: var(--mut)
}

.perfInputs input {
  width: 100%;
  box-sizing: border-box;
  margin-top: 3px;
  background: var(--card);
  border: 0;
  border-radius: 8px;
  color: var(--txt);
  padding: 8px 6px;
  font-size: 14px;
  text-align: center
}

/* SHEETS */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .4);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fi .15s
}

.ov.c {
  align-items: center;
  padding: 24px
}

@keyframes fi {
  from {
    opacity: 0
  }

  to {
    opacity: 1
  }
}

@keyframes up {
  from {
    transform: translateY(40px)
  }

  to {
    transform: none
  }
}

.sh {
  background: var(--sheet);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 640px;
  max-height: 88vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 16px calc(16px + var(--sab));
  animation: up .2s cubic-bezier(.2, .8, .2, 1)
}

.ov.c .sh {
  border-radius: 14px;
  max-width: 300px;
  padding: 20px 16px 12px;
  text-align: center
}

.sh .grab {
  margin: 2px auto 12px
}

.sh h2 {
  font-size: 20px;
  font-weight: 700;
  margin: 4px 0 4px
}

.sh p {
  font-size: 14px;
  color: var(--mut);
  line-height: 1.45;
  margin-bottom: 12px
}

.grp {
  background: var(--fill);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 14px
}

.grp .f {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  min-height: 46px;
  position: relative
}

.grp .f+.f::before {
  content: "";
  position: absolute;
  left: 14px;
  right: 0;
  top: 0;
  border-top: .5px solid var(--sep)
}

.grp label {
  font-size: 16px;
  flex-shrink: 0;
  min-width: 104px
}

.grp input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  font-size: 16px;
  text-align: right;
  color: var(--txt);
  outline: none
}

.grp .unit {
  font-size: 14px;
  color: var(--mut)
}

.err {
  background: rgba(255, 59, 48, .12);
  color: var(--red);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  margin-bottom: 12px;
  line-height: 1.4
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  background: var(--fill);
  font-size: 17px;
  font-weight: 500;
  margin-top: 8px;
  color: var(--tint)
}

.btn:active {
  background: var(--fill2)
}

.btn.p {
  background: var(--tint);
  color: #fff;
  font-weight: 600
}

.btn.d {
  color: var(--red)
}

.btn[disabled] {
  opacity: .35;
  pointer-events: none
}

.two {
  display: flex;
  gap: 8px
}

.two .btn {
  flex: 1
}

.stp {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 8px 0 12px
}

.stp button {
  width: 56px;
  height: 44px;
  border-radius: 12px;
  background: var(--fill);
  font-size: 24px;
  font-weight: 500;
  color: var(--tint)
}

.stp button:active {
  background: var(--fill2)
}

.stp .v {
  font-size: 34px;
  font-weight: 700;
  min-width: 70px;
  text-align: center
}

.stp .v small {
  display: block;
  font-size: 11px;
  color: var(--mut);
  font-weight: 400
}

.qs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px
}

.qs button {
  flex: 1;
  padding: 9px;
  border-radius: 10px;
  background: var(--fill);
  font-size: 15px;
  font-weight: 500
}

.qs button.on {
  background: var(--tint);
  color: #fff
}

.hdrow {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px
}

.hdrow .ph {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  background: #fff;
  border: .5px solid var(--sep);
  overflow: hidden;
  flex-shrink: 0
}

.hdrow .ph img {
  width: 100%;
  height: 100%;
  object-fit: contain
}

.exp img {
  width: 100%;
  border-radius: 10px;
  border: .5px solid var(--sep)
}

.exp pre {
  font-size: 10px;
  background: var(--fill);
  padding: 10px;
  border-radius: 10px;
  max-height: 220px;
  overflow: auto;
  white-space: pre;
  -webkit-user-select: text;
  user-select: text
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(74px + var(--sab));
  transform: translateX(-50%) translateY(10px);
  background: rgba(28, 28, 30, .92);
  color: #fff;
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  z-index: 200;
  opacity: 0;
  transition: all .2s;
  pointer-events: none;
  max-width: 88%;
  text-align: center;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .2)
}

.toast.on {
  opacity: 1;
  transform: translateX(-50%)
}

.l.selbtn { background: var(--fill); }

.nb.side {

/* ===== Refonte visuelle : plus rond, plus lisible, plus vivant ===== */

.pi {

.pi .ph {

}

.chip, .seg button {

}

.l {
  padding: 8px 14px;
  font-size: 14px;

}

.l.on { box-shadow: 0 2px 6px rgba(21, 107, 86, .3); }

}

}

.empty .i { font-size: 64px; }

.pill {

  box-shadow: 0 3px 12px rgba(36, 154, 109, .35);
}

.toast { border-radius: 22px; }

/* ===== Pictogrammes ===== */
.ic {
  flex-shrink: 0;
  vertical-align: -.22em;
}

.btn .ic { margin-right: 2px; }
.nb .ic { vertical-align: middle; }
.seg button .ic { vertical-align: -.2em; margin-right: 3px; }

/* ===== Glisser-déposer ===== */
.ghost {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 500;
  pointer-events: none;
  width: 68px;
  padding: 6px;
  border-radius: 14px;

}

.ghost img {
  width: 100%;
  height: 46px;
  object-fit: contain;
  border-radius: 8px;
}

.ghost span {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--tint);
  margin-top: 2px;
}

@keyframes pop {
  from { transform: scale(.8); opacity: .4; }
  to { opacity: 1; }
}

/* ===== Bandeau Annuler ===== */
.undobar {
  position: absolute;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%) translateY(18px);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 12px 10px 16px;
  border-radius: 22px;
  background: rgba(28, 28, 30, .92);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  color: #fff;
  font-size: 14px;
  box-shadow: 0 6px 22px rgba(0, 0, 0, .25);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s cubic-bezier(.2, .9, .3, 1.1);
  z-index: 30;
  max-width: 92%;
}

.undobar.on {
  opacity: 1;
  transform: translateX(-50%);
  pointer-events: auto;
}

.undobar button {
  color: var(--tint);
  font-weight: 600;
  font-size: 15px;
  padding: 2px 4px;
}

.body { position: relative; }

/* ===== Accessibilité : les tailles suivent les réglages du système ===== */
body { font-size: 100%; }
.nav .t h1 { font-size: clamp(16px, 1.05rem, 22px); }
.row .n { font-size: clamp(15px, .98rem, 20px); }
.pi .n { font-size: clamp(12px, .8rem, 16px); }
.btn { font-size: clamp(15px, 1rem, 20px); }
.sh h2 { font-size: clamp(18px, 1.2rem, 26px); }

/* ===== Mouvement : chaque geste a sa conséquence visible ===== */
@media (prefers-reduced-motion: no-preference) {
  .pi, .l, .chip, .st, .btn, .row { transition: transform .14s cubic-bezier(.2,.9,.3,1.1), background .16s, box-shadow .16s; }
  .l:active, .chip:active, .st:active { transform: scale(.94); }
  .row:active { transform: scale(.985); }
  .cw svg { transition: opacity .12s; }
  .selbar { animation: slidein .18s cubic-bezier(.2,.9,.3,1.1); }
}

@keyframes slidein {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

.onb { margin: 6px 0 18px; }

}

.onb > div + div { border-top: .5px solid var(--sep); }

.onb span {

  flex-shrink: 0;
}

/* ===== Logo de l'application ===== */
.applogo {

  height: 24px;
  vertical-align: -.32em;
  margin-right: 7px;
  border-radius: 6px;
}

.hero {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 6px 16px 2px;
}

.hero img {
  width: 62px;
  height: 62px;

}

.hero .big { padding: 0; }

.heroSub {

}

.onbHead { text-align: center; margin: 2px 0 10px; }

.onbHead img {
  width: 84px;
  height: 84px;
  border-radius: 20px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
}

/* ================= MATIÈRE TRANSLUCIDE =================
   Approximation web du verre d'iOS : flou de l'arrière-plan avec saturation, bordure
   claire en haut qui simule la réfraction, ombre portée courte. Le vrai Liquid Glass
   d'Apple déforme l'image derrière lui en temps réel, ce qu'un navigateur ne sait pas
   faire ; on en garde la profondeur et la légèreté.
   Sur les appareils qui ne gèrent pas le flou, on retombe sur un fond opaque lisible.
*/
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  :root {
    --glass: rgba(255, 255, 255, .62);
    --glassEdge: rgba(255, 255, 255, .85);
    --glassLine: rgba(0, 0, 0, .06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --glass: rgba(40, 40, 44, .58);
      --glassEdge: rgba(255, 255, 255, .16);
      --glassLine: rgba(255, 255, 255, .08);
    }
  }

  .nav,
  .dr,
  .presBar,
  .selbar,
  .undobar,
  .sh {
    background: var(--glass);
    -webkit-backdrop-filter: saturate(190%) blur(28px);
    backdrop-filter: saturate(190%) blur(28px);
    border: .5px solid var(--glassLine);
  }

  /* le liseré clair du haut fait la réfraction */
  .nav, .dr, .sh, .presBar, .selbar {
    box-shadow: inset 0 .5px 0 var(--glassEdge), 0 2px 14px rgba(0, 0, 0, .08);
  }

  .dr { border-left: .5px solid var(--glassLine); }

  .undobar {
    background: rgba(28, 28, 30, .72);
    box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .14), 0 6px 22px rgba(0, 0, 0, .28);
  }

  /* les pastilles et puces deviennent du verre posé sur du verre */
  .l, .chip, .st, .seg, .btn:not(.p), .sb2 {
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  /* le fond de l'app transparaît sous les surfaces : dégradé doux plutôt qu'un aplat */
  body {
    background:
      radial-gradient(120% 80% at 12% 0%, rgba(36, 154, 109, .16), transparent 60%),
      radial-gradient(100% 70% at 100% 100%, rgba(122, 146, 181, .16), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
}

/* Les boutons pleins gardent leur matière propre, ils doivent rester nets. */
.btn.p, .pill { -webkit-backdrop-filter: none; backdrop-filter: none; }

/* Reflet mobile sur le bouton principal, comme une lumière qui glisse sur le verre. */
@media (prefers-reduced-motion: no-preference) {
  .btn.p { position: relative; overflow: hidden; }

  .btn.p::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .38) 50%, transparent 62%);
    transform: translateX(-120%);
    transition: transform .55s ease;
  }

  .btn.p:active::after { transform: translateX(120%); }
}

/* Pendant un glissement, plus rien ne défile ni ne se sélectionne. */
body.dragging { touch-action: none; overflow: hidden; }
body.dragging .pl, body.dragging .cw { overflow: hidden; }

/* ===== Mise en situation en magasin ===== */
.scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.pres.withScene .presWrap { position: relative; z-index: 1; }

.pres.withScene .presWrap svg {
  box-shadow: 0 18px 40px rgba(0, 0, 0, .35), 0 2px 0 rgba(0, 0, 0, .2);
  border-radius: 4px;
}

/* le glissement doit rester possible même dans une liste qui défile */
.pi { touch-action: manipulation; }

/* ===== Comparaison avant / après ===== */
.cmp {
  display: flex;
  gap: 10px;
  margin: 4px 0 16px;
}

.cmp > div {
  flex: 1;
  min-width: 0;

  border: .5px solid var(--sep);
}

.grp .f span:not(.unit) {
  margin-left: auto;
  font-size: 15px;
}

/* ===== Lignes de commande ===== */
.ordl {
  margin: 4px 0 14px;
  border-radius: 14px;
  overflow: hidden;
  background: var(--fill);

.ol .q small {
  display: block;

  color: var(--mut);
}

const IMAGE_BASE = "https://bubimex.eu/wp-content/uploads/";
const IMAGE_SUFFIXES = [".jpg", "-700x700.jpg", "-600x600.jpg", ".png", ".webp", ".jpeg"];
const MERCH_DEFAULT = { minFacings: 1, maxFacings: 6, priority: 3 };

function buildProduct([universe, ref, name, brand, format, widthCm, heightCm, depthCm, defaultFacings, defaultStack]) {
  return {
    universe, ref, name, brand, format,
    widthCm, heightCm, depthCm,
    defaultFacings, defaultStack,
    imageCandidates: IMAGE_SUFFIXES.map(suffix =>IMAGE_BASE + ref + suffix),
    merch: Object.assign({}, MERCH_DEFAULT)
  };
}

const CATALOGUE_DB = CATALOGUE_RAW.map(buildProduct);

// Index de catalogue : toutes les fonctions historiques continuent d'utiliser PRODUCTS/BY_REF.
const PRODUCTS = CATALOGUE_DB.map(x => {
  const parts = x.name.split(', ');
  const line = parts[0].replace(x.brand, '').trim();
  const flav = parts[1] || '';
  const logo = LOGOS[x.brand];
  const lw = 42, lh = Math.round(lw * logo.h / logo.w);
  const ph = 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 60 60">` +
    `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">` +
    `<stop offset="0" stop-color="${BRAND_LIGHT[x.brand]}"/><stop offset="1" stop-color="${BRAND_DARK[x.brand]}"/>` +
    `</linearGradient></defs>` +
    `<rect width="60" height="60" rx="10" fill="url(#g)"/>` +
    `<image href="${logo.white}" xlink:href="${logo.white}" x="${(60-lw)/2}" y="${14-lh/2}" width="${lw}" height="${lh}" opacity=".95"/>` +
    `<text x="30" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="system-ui">${x.format}</text>` +
    `</svg>`);
  const fg = {
    '395g': '400g',
    '375g': '400g',
    '190g': '200g'
  } [x.format] || x.format;
  return {
    univ: x.universe,
    ref: x.ref,
    name: x.name,
    cat: x.brand,
    line,
    flav,
    fmt: x.format,
    fg,
    w: x.widthCm,
    h: x.heightCm,
    d: x.depthCm,
    df: x.defaultFacings,
    st: x.defaultStack,
    ph,
    imageCandidates: x.imageCandidates,
    merch: x.merch
  };
});
const BY_REF = Object.fromEntries(PRODUCTS.map(p => [p.ref, p]));
try {
  applyDimFixes();
} catch (e) {}
window.BUBIPLAN_DB = {

};

/* ================= STOCKAGE SÛR =================
   Safari refuse localStorage dans certains cas (fichier ouvert en local, navigation
   privée, quota atteint) et lève une exception. Sans cette couche, la moindre lecture
   non protégée arrête tout le script et l'application reste sur un écran blanc.
   Ici, en cas de refus, on bascule sur une mémoire de secours : l'application
   fonctionne normalement, seules les données ne survivent pas à la fermeture.
*/
const memoryStore = {};
let storageWarned = false;

function lsGet(key) {
  try {
    const v = window.localStorage.getItem(key);
    return v === null ? (key in memoryStore ? memoryStore[key] : null) : v;
  } catch (e) {
    return key in memoryStore ? memoryStore[key] : null;
  }
}

function lsSet(key, value) {
  memoryStore[key] = value;
  try {
    window.localStorage.setItem(key, value);
    return true;
  } catch (e) {
    if (!storageWarned) {
      storageWarned = true;
      setTimeout(() => toast("Sauvegarde indisponible sur cet appareil"), 800);
    }
    return false;
  }
}

const PERFKEY = 'bubiplan_perf_v10';

function perf(ref) {
  return Object.assign({
    unitsWeek: 0,
    price: 0,
    margin: 0,
    stock: 0,
    minF: 1,
    maxF: 6,
    priority: 3
  }, PERF[ref] || {});
}

function setPerf(ref, data) {
  PERF[ref] = Object.assign(perf(ref), data);
  savePerf();
}

function depthCapacity(p) {
  return Math.max(1, Math.floor((S.cur?.D || 40) / Math.max(.1, p.d || 1)));
}

function itemCapacity(it) {
  const p = BY_REF[it.ref];
  if (!p) return 0;                     // espace de calage : aucune contenance
  return it.f * (it.s || 1) * depthCapacity(p);
}

function itemDOS(it) {
  if (!BY_REF[it.ref]) return null;     // espace de calage
  const d = perf(it.ref),
    u = +d.unitsWeek || 0;
  return u > 0 ? itemCapacity(it) / (u / 7) : null;
}

function targetFacings(ref, targetDays = 14, minF = 1, maxF = 6) {
  const p = BY_REF[ref],
    d = perf(ref);
  let f = Math.max(minF, +d.minF || 1);
  if ((+d.unitsWeek || 0) > 0) {
    const perFacing = Math.max(1, (p.st || 1) * depthCapacity(p));
    f = Math.ceil((+d.unitsWeek / 7 * targetDays) / perFacing);
  }
  f = Math.max(f, +d.minF || 1, minF);
  f = Math.min(f, +d.maxF || maxF, maxF);
  return Math.max(1, f);
}

/* ================= DÉTOURAGE AUTOMATIQUE =================
   Les visuels Bubimex sont sur fond blanc. On retire ce fond par remplissage depuis
   les bords (le blanc à l'intérieur de l'étiquette est donc conservé), puis on recadre
   au plus juste sur le produit. Le résultat est un PNG transparent, prêt à être posé
   sur le rayon. Tout se passe sur l'appareil, aucun envoi de données.
*/
const DETOUR_TOLERANCE = 26;   // écart au blanc considéré comme fond
const DETOUR_MAX_SIZE = 260;   // côté maximal du PNG stocké, en pixels

function detourImage(source) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        resolve(detourCanvas(img));
      } catch (e) {
        resolve(source); // canvas indisponible ou image d'une autre origine : on garde l'original
      }
    };
    img.onerror = () => resolve(source);
    img.src = source;
  });
}

function detourCanvas(img) {
  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;
  if (!w || !h) throw new Error('image vide');

  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, w, h);
  const px = data.data;

  // 1. remplissage depuis les bords : tout ce qui est blanc et relié au bord devient transparent
  const seen = new Uint8Array(w * h);
  const queue = [];
  const isBackground = i => px[i] > 255 - DETOUR_TOLERANCE &&
                            px[i + 1] > 255 - DETOUR_TOLERANCE &&
                            px[i + 2] > 255 - DETOUR_TOLERANCE;
  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const p = y * w + x;
    if (seen[p]) return;
    seen[p] = 1;
    if (isBackground(p * 4)) queue.push(p);
  };
  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
  for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
  while (queue.length) {
    const p = queue.pop();
    px[p * 4 + 3] = 0;
    const x = p % w, y = (p / w) | 0;
    push(x - 1, y); push(x + 1, y); push(x, y - 1); push(x, y + 1);
  }

  // 2. filet de sécurité : si le remplissage n'a presque rien retiré (marge non reliée
  //    au bord, fond légèrement dégradé), on retire aussi tout le blanc restant.
  let cleared = 0;
  for (let p = 0; p < w * h; p++)
    if (px[p * 4 + 3] === 0) cleared++;
  if (cleared < w * h * 0.04) {
    for (let p = 0; p < w * h; p++) {
      const i = p * 4;
      if (px[i + 3] && isBackground(i)) px[i + 3] = 0;
    }
  }

  // 3. recadrage sur ce qui reste visible
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (px[(y * w + x) * 4 + 3] > 12) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) throw new Error('image entièrement effacée');
  ctx.putImageData(data, 0, 0);

  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const scale = Math.min(1, DETOUR_MAX_SIZE / Math.max(cw, ch));
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(cw * scale));
  out.height = Math.max(1, Math.round(ch * scale));
  out.getContext('2d').drawImage(c, minX, minY, cw, ch, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

/* Récupère les visuels depuis bubimex.eu, les détoure et les stocke sur l'appareil.
   Nécessite du réseau. Si le site refuse la lecture des pixels (CORS), l'image est
   conservée telle quelle et comptée comme non détourée. */
/* bubimex.eu accepte d'afficher ses visuels mais refuse qu'on les recopie : sans
   autorisation explicite du serveur, le navigateur interdit la lecture des pixels,
   donc pas de detourage, pas d'enregistrement et pas d'export. Le relais d'images
   ci-dessous recupere la photo a notre place et la renvoie avec l'autorisation
   manquante. Il ne sert qu'une fois : ensuite la photo vit dans l'appareil. */
const PROXY = 'https://images.weserv.nl/?n=-1&w=420&url=';

function proxyURL(url) {
  return PROXY + encodeURIComponent(url.replace(/^https?:\/\//, ''));
}

let useProxy = lsGet('bubiplan_proxy') !== '0';

function setProxy(on) {
  useProxy = on;
  lsSet('bubiplan_proxy', on ? '1' : '0');
}

async function fetchAndDetour(refs, onProgress) {
  let done = 0, ok = 0, cut = 0;
  for (const ref of refs) {
    const direct = (BY_REF[ref] && BY_REF[ref].imageCandidates) || photoCandidates(ref);
    const known = PHOTO[ref] && PHOTO[ref] !== 'none' ? [PHOTO[ref]] : [];
    // si l'adresse exacte est déjà connue on n'essaie qu'elle, sinon les trois
    // variantes les plus probables : inutile de multiplier les tentatives
    const base = known.length ? known : direct.slice(0, 3);
    const urls = useProxy ? [...base, ...base.map(proxyURL)] : base;
    for (const url of urls) {
      try {
        const res = await fetch(url, { mode: 'cors', referrerPolicy: 'no-referrer' });
        if (!res.ok) continue;
        const blob = await res.blob();
        if (!blob.type.startsWith('image/')) continue;
        const raw = await new Promise((resolve, reject) => {
          const rd = new FileReader();
          rd.onload = () => resolve(rd.result);
          rd.onerror = reject;
          rd.readAsDataURL(blob);
        });
        const clean = await detourImage(raw);
        UPHOTO[ref] = clean;
        ok++;
        if (clean !== raw) cut++;
        break;
      } catch (e) { /* url suivante */ }
    }
    done++;
    if (onProgress) onProgress(done, refs.length, ok);
  }
  saveUPhotos();
  renderListIfEditor();
  if (S.cur) drawGondola();
  return { ok, cut, total: refs.length };
}

/* Re-détoure les photos déjà présentes sur l'appareil. */
async function detourStored(refs) {
  let n = 0;
  for (const ref of refs) {
    if (!UPHOTO[ref]) continue;
    const clean = await detourImage(UPHOTO[ref]);
    if (clean !== UPHOTO[ref]) { UPHOTO[ref] = clean; n++; }
  }
  saveUPhotos();
  renderListIfEditor();
  if (S.cur) drawGondola();
  return n;
}

function photoURL(ref) {
  if (UPHOTO[ref]) return UPHOTO[ref];
  const u = PHOTO[ref];
  return u && u !== 'none' ? u : null;
}

function photoSrc(ref) {
  return photoURL(ref) || BY_REF[ref].ph;
}

function importPhotos(files, forceRef) {
  const arr = [...files];
  if (!arr.length) return;
  let done = 0,
    ok = 0;
  const refsSet = new Set(PRODUCTS.map(p => p.ref));
  arr.forEach(file => {
    let ref = forceRef;
    if (!ref) {
      const base = file.name.replace(/\.[^.]+$/, '');
      const m = base.match(/G\d{3}|\d{2,4}/gi);
      if (m) {
        for (const c of m) {
          const cc = c.toUpperCase();
          if (refsSet.has(cc)) {
            ref = cc;
            break;
          }
        }
      }
    }
    const fin = () => {
      if (++done === arr.length) {
        saveUPhotos();
        renderListIfEditor();
        if (S.cur) drawGondola();
        toast(ok ? `${ok} photo${ok>1?'s':''} importée${ok>1?'s':''}` : 'Aucune réf. reconnue dans les noms de fichiers');
      }
    };
    if (!ref) {
      fin();
      return;
    }
    const rd = new FileReader();
    rd.onload = () => {
      // détourage sur fond transparent + recadrage, puis stockage
      detourImage(rd.result).then(clean => {
        UPHOTO[ref] = clean;
        ok++;
        fin();
      }).catch(fin);
    };
    rd.onerror = fin;
    rd.readAsDataURL(file);
  });
}

function pickPhotos(forceRef) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  if (!forceRef) inp.multiple = true;
  inp.onchange = () => {
    closeSheet();
    importPhotos(inp.files, forceRef);
  };
  inp.click();
}

function resolvePhoto(ref, cb) {
  if (PHOTO[ref] !== undefined) {
    cb && cb();
    return;
  }
  const cands = photoCandidates(ref);
  let i = 0;
  const tryNext = () => {
    if (i >= cands.length) {
      PHOTO[ref] = 'none';
      savePhotoMap();
      cb && cb();
      return;
    }
    const im = new Image();
    const u = cands[i++];
    im.onload = () => {
      PHOTO[ref] = u;
      savePhotoMap();
      cb && cb();
    };
    im.onerror = tryNext;
    im.src = u;
  };
  tryNext();
}
let photoQueue = [],
  photoBusy = 0;

function queuePhotos(refs) {
  refs.forEach(r => {
    if (PHOTO[r] === undefined && !photoQueue.includes(r)) photoQueue.push(r);
  });
  pumpPhotos();
}

function pumpPhotos() {
  while (photoBusy < 4 && photoQueue.length) {
    const r = photoQueue.shift();
    photoBusy++;
    resolvePhoto(r, () => {
      photoBusy--;
      refreshPhoto(r);
      pumpPhotos();
    });
  }
}

function refreshPhoto(ref) {
  document.querySelectorAll(`img[data-ph="${ref}"]`).forEach(im => {
    im.src = photoSrc(ref);
  });
  if (S.cur && S.cur.shelves.some(s => s.items.some(i => i.ref === ref))) drawGondola();
}

function resetPhotos() {
  PHOTO = {};
  savePhotoMap();
  photoQueue = [];
  queuePhotos(PRODUCTS.filter(p => p.univ === S.univ).map(p => p.ref));
  toast('Chargement des photos depuis bubimex.eu…');
}

function uid() {

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  } [c]));
}

function fmtDate(t) {

    day: '2-digit',
    month: 'short'
  });
}
let toastT;

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 1800);
}

function $(id) {

}

function persist() {
  if (!S.cur) return;
  S.cur.updated = Date.now();
  const i = S.projects.findIndex(p => p.id === S.cur.id);
  if (i >= 0) S.projects[i] = S.cur;
  else S.projects.push(S.cur);

}

function snap() {
  S.hist = S.hist.slice(0, S.hi + 1);
  S.hist.push(JSON.stringify(S.cur));
  if (S.hist.length > 60) S.hist.shift();
  S.hi = S.hist.length - 1;
}

function commit(msg) {
  snap();
  persist();
  update();
  if (msg) offerUndo(msg);
}

function undo() {
  if (S.hi > 0) {
    S.hi--;
    S.cur = JSON.parse(S.hist[S.hi]);
    persist();
    update();
    offerUndo('Action annulée');
  }
}

function redo() {
  if (S.hi < S.hist.length - 1) {
    S.hi++;
    S.cur = JSON.parse(S.hist[S.hi]);
    persist();
    update();
  }
}

function shelfW(sh) {
  return sh.items.reduce((a, it) => a + (it.gap || (BY_REF[it.ref] ? BY_REF[it.ref].w * it.f : 0)), 0);
}

function shelfH() {
  return S.cur.H / S.cur.shelves.length;
}

function countRefs(p) {
  return new Set(p.shelves.flatMap(s => s.items.filter(i => !i.gap).map(i => i.ref))).size;
}

function thumb(p) {
  const W = p.W,
    H = p.H,
    sh = H / p.shelves.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><rect width="${W}" height="${H}" fill="#fff"/>`;
  p.shelves.forEach((shelf, i) => {
    const y = (i + 1) * sh;
    s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#bbb" stroke-width="1.5"/>`;
    let x = 0;
    shelf.items.forEach(it => {
      const pr = BY_REF[it.ref];
      if (!pr) return;
      const w = pr.w * it.f,
        h = Math.min(pr.h, sh * .9);
      s += `<rect x="${x}" y="${y-h}" width="${w}" height="${h}" fill="${BRAND[pr.cat]}"/>`;
      x += w;
    });
  });
  return s + '</svg>';
}

/* ---- placement étage par étage ---- */

function addProduct(ref) {
  const p = BY_REF[ref];
  if (!p || !S.cur) return;
  if (shelfW(S.cur.shelves[S.shelf]) + p.w >S.cur.W) {
    let next = -1;
    for (let i = S.shelf + 1; i < S.cur.shelves.length; i++) {
      if (shelfW(S.cur.shelves[i]) + p.w <= S.cur.W) {
        next = i;
        break;
      }
    }
    if (next < 0) {
      toast(`Niveau ${S.shelf+1} plein, aucun niveau libre en dessous`);
      return;
    }
    S.shelf = next;
  }
  const items = S.cur.shelves[S.shelf].items;
  // le produit se pose du côté choisi dans la barre du tiroir
  const last = S.side === 'left' ? items[0] : items[items.length - 1];
  const df = Math.max(1, Math.min(p.df, Math.floor((S.cur.W - shelfW(S.cur.shelves[S.shelf])) / p.w)));
  const nouveau = { id: uid(), ref, f: df, s: p.st };
  if (S.insertAt != null) {
    // on pose à l'endroit exact tapé sur le rayon
    let acc = 0, at = items.length;
    for (let k = 0; k < items.length; k++) {
      const wIt = items[k].gap || BY_REF[items[k].ref].w * items[k].f;
      if (S.insertAt < acc + wIt / 2) { at = k; break; }
      acc += wIt;
    }
    items.splice(at, 0, nouveau);
    S.insertAt = null;
  } else if (last && last.ref === ref) last.f += df;
  else if (S.side === 'left') items.unshift(nouveau);
  else items.push(nouveau);
  let msg = `${p.ref} → niveau ${S.shelf+1}`;
  if (S.cur.W - shelfW(S.cur.shelves[S.shelf]) < 6.5 && S.shelf < S.cur.shelves.length - 1) {
    S.shelf++;
    msg += ` · plein, suite niveau ${S.shelf+1}`;
  }
  snap();
  persist();
  update();
  refreshCounts();
  offerUndo(msg);
  haptic();
}

/* ================= BUBIPLAN PRO : SPACE PLANNING ================= */

function scopeRefs(scope = 'current') {
  if (scope === 'current') return [...new Set(S.cur.shelves.flatMap(s => s.items.map(i => i.ref)))];
  let a = PRODUCTS.filter(p => p.univ === S.univ);
  if (scope === 'filtered') {
    if (S.cat) a = a.filter(p => p.cat === S.cat);
    if (S.fmt) a = a.filter(p => p.fg === S.fmt);
    const q = S.q.toLowerCase().trim();
    if (q) a = a.filter(p => p.name.toLowerCase().includes(q) || p.ref.toLowerCase().includes(q));
  }
  return a.map(p => p.ref);
}

function spaceCalc(refs, targetDays = 14, minF = 1, maxF = 6, occupancy = .92) {
  const rows = refs.map(ref => {
    const p = BY_REF[ref],
      f = targetFacings(ref, targetDays, minF, maxF),
      lin = p.w * f,
      dep = depthCapacity(p),
      cap = f * (p.st || 1) * dep,
      d = perf(ref),
      dos = (+d.unitsWeek || 0) > 0 ? cap / (+d.unitsWeek / 7) : null;
    return {
      ref,
      p,
      f,
      lin,
      dep,
      cap,
      dos
    };
  });
  const linear = rows.reduce((a, r) => a + r.lin, 0),
    usable = S.cur.W * Math.max(.5, Math.min(.99, occupancy)),
    levels = Math.max(1, Math.ceil(linear / usable));
  const totalFront = S.cur.W * levels,
    neededWidth = Math.ceil(linear / levels),
    heightNeeded = Math.max(...rows.map(r => r.p.h * (r.p.st || 1)), 0) * levels;
  const bays = [66, 100, 133, 200, 266, 300, 400, 500];
  let rec = bays.find(x => x * levels >= linear / occupancy) || Math.ceil(linear / (levels * 10)) * 10;
  return {
    rows,
    linear,
    levels,
    totalFront,
    neededWidth,
    heightNeeded,
    rec,
    occupancy
  };
}

function smartAutoFill(scope = 'filtered', mode = 'sales', days = 14, minF = 1, maxF = 6) {
  const refs = scopeRefs(scope);
  if (!refs.length) {
    toast('Aucune référence à placer');
    return;
  }
  const N = S.cur.shelves.length,
    W = S.cur.W,
    H = shelfH(),
    shelves = Array.from({
      length: N
    }, () => ({
      items: []
    }));
  const eye = Math.max(0, Math.min(N - 1, Math.round(N * .42)));
  let ordered = refs.slice();
  const score = r => {
    const d = perf(r);
    if (mode === 'sales') return +d.unitsWeek || 0;
    if (mode === 'margin') return (+d.unitsWeek || 0) * (+d.price || 0) * (+d.margin || 0) / 100;
    return +d.priority || 3;
  };
  if (mode === 'brands') ordered.sort((a, b) =>BRANDS.indexOf(BY_REF[a].cat) - BRANDS.indexOf(BY_REF[b].cat) || parseInt(BY_REF[a].fg) - parseInt(BY_REF[b].fg) || a.localeCompare(b));
  else if (mode === 'references') ordered.sort((a, b) =>BY_REF[a].w - BY_REF[b].w || a.localeCompare(b));
  else ordered.sort((a, b) => score(b) - score(a) || parseInt(BY_REF[b].fg) - parseInt(BY_REF[a].fg) || a.localeCompare(b));
  const sw = sh => sh.items.reduce((a, it) => a + BY_REF[it.ref].w * it.f, 0);
  for (const ref of ordered) {
    const p = BY_REF[ref];
    let f = (mode === 'sales' || mode === 'margin') ? targetFacings(ref, days, minF, maxF) : Math.max(minF, Math.min(maxF, perf(ref).minF || p.df || 1));
    const gram = parseInt(p.fg) || 0;
    let pref = gram >= 400 ? N - 1 : (gram <= 100 ? eye : Math.min(N - 1, eye + 1));
    const seq = [];
    for (let d = 0; d < N; d++) {
      for (const si of [pref + d, pref - d])
        if (si >= 0 && si < N && !seq.includes(si)) seq.push(si);
    }
    for (const si of seq) {
      if (f <= 0) break;
      if (p.h * (p.st || 1) >H) continue;
      const fit = Math.floor((W - sw(shelves[si])) / p.w);
      if (fit > 0) {
        const take = Math.min(fit, f);
        shelves[si].items.push({
          id: uid(),
          ref,
          f: take,
          s: p.st
        });
        f -= take;
      }
    }
  }
  S.cur.shelves = shelves;
  S.shelf = 0;
  closeSheet();
  commit('Remplissage automatique');
  refreshCounts();
  toast(`${refs.length} références analysées`);
}

function smartOptimize(mode = 'balanced') {
  const groups = {};
  S.cur.shelves.forEach(s => s.items.forEach(i => groups[i.ref] = (groups[i.ref] || 0) + i.f));
  const refs = Object.keys(groups);
  if (!refs.length) {
    toast('Ajoute d\'abord des produits');
    return;
  }
  const N = S.cur.shelves.length,
    W = S.cur.W,
    H = shelfH();
  const shelves = Array.from({
    length: N
  }, () => ({
    items: []
  }));
  const eye = Math.max(0, Math.min(N - 1, Math.round(N * .42)));
  const fitOn = (si, p) =>Math.floor((W - shelfW(shelves[si])) / p.w);
  const add = (si, r, f) => {
    if (f > 0) shelves[si].items.push({
      id: uid(),
      ref: r,
      f,
      s: BY_REF[r].st
    });
  };
  let ordered = refs.slice();
  if (mode === 'brands') ordered.sort((a, b) =>BRANDS.indexOf(BY_REF[a].cat) - BRANDS.indexOf(BY_REF[b].cat) || parseInt(BY_REF[a].fg) - parseInt(BY_REF[b].fg) || a.localeCompare(b));
  else if (mode === 'references') ordered.sort((a, b) =>BY_REF[a].w - BY_REF[b].w || BY_REF[a].h - BY_REF[b].h || a.localeCompare(b));
  else if (mode === 'compact') ordered.sort((a, b) => (BY_REF[a].w * BY_REF[a].h) - (BY_REF[b].w * BY_REF[b].h) || a.localeCompare(b));
  else ordered.sort((a, b) => parseInt(BY_REF[b].fg) - parseInt(BY_REF[a].fg) || (BY_REF[b].w * BY_REF[b].h) - (BY_REF[a].w * BY_REF[a].h) || a.localeCompare(b));
  for (const r of ordered) {
    const p = BY_REF[r];
    let f = groups[r];
    // Formats lourds/grands en bas, petits formats plutôt zone des yeux.
    const gram = parseInt(p.fg) || 0;
    let pref = gram >= 400 ? N - 1 : (gram <= 100 ? eye : Math.min(N - 1, eye + 1));
    if (mode === 'compact') pref = N - 1;
    const seq = [];
    for (let d = 0; d < N; d++) {
      const a = pref + d,
        b = pref - d;
      if (a < N && !seq.includes(a)) seq.push(a);
      if (b >= 0 && !seq.includes(b)) seq.push(b);
    }
    for (const si of seq) {
      if (f <= 0) break;
      if (p.h * (p.st || 1) >H) continue;
      const fit = fitOn(si, p);
      if (fit > 0) {
        const take = Math.min(fit, f);
        add(si, r, take);
        f -= take;
      }
    }
  }
  // Complète intelligemment le linéaire sans dépasser 96 %.
  shelves.forEach(sh => {
    if (!sh.items.length) return;
    let used = shelfW(sh),
      target = W * .96,
      g = 0;
    while (used < target && g++ < 300) {
      let grew = false;
      for (const it of sh.items) {
        const p = BY_REF[it.ref];
        if (used + p.w <= target) {
          it.f++;
          used += p.w;
          grew = true;
        }
      }
      if (!grew) break;
    }
  });
  S.cur.shelves = shelves;
  S.shelf = 0;
  commit('Implantation optimisée');
  refreshCounts();
}

function applyTemplate(v) {
  const [W, H, N] = v.split(',').map(Number);
  S.cur.W = W;
  S.cur.H = H;
  while (S.cur.shelves.length < N) S.cur.shelves.push({
    items: []
  });
  if (S.cur.shelves.length >N) {
    const keep = S.cur.shelves.slice(0, N);
    S.cur.shelves.slice(N).forEach(sh => sh.items.forEach(it => keep[N - 1].items.push(it)));
    S.cur.shelves = keep;
  }
  S.shelf = Math.min(S.shelf, N - 1);
  closeSheet();
  commit(`Template ${W} cm appliqué`);
  refreshCounts();
}

/* ================= SÉLECTION MULTIPLE =================
   Premier appui : point de départ. Deuxième appui sur le même niveau : toute la plage
   comprise entre les deux est prise. On règle ensuite les facings et la hauteur de
   tout le groupe d'un seul geste.
*/
function toggleSelect(id) {
  const f = findItem(id);
  if (!f) return;
  if (S.sel.includes(id)) {
    S.sel = S.sel.filter(x => x !== id);
  } else if (S.sel.length) {
    const first = findItem(S.sel[S.sel.length - 1]);
    if (first && first.si === f.si) {
      const a = Math.min(first.k, f.k), b = Math.max(first.k, f.k);
      const range = S.cur.shelves[f.si].items.slice(a, b + 1).map(i => i.id);
      S.sel = [...new Set([...S.sel, ...range])];
    } else {
      S.sel.push(id);
    }
  } else {
    S.sel.push(id);
  }
  update();
}

function selApply(key, delta) {
  if (!S.sel.length) return;
  S.sel.forEach(id => {
    const f = findItem(id);
    if (!f) return;
    const cur = key === 'f' ? f.it.f : (f.it.s || 1);
    const val = Math.max(1, Math.min(key === 'f' ? 30 : 8, cur + delta));
    if (key === 'f') f.it.f = val; else f.it.s = val;
  });
  snap();
  persist();
  update();
  refreshCounts();
}

function selBar() {

/* ================= GLISSER-DÉPOSER =================
   On attrape un produit dans le tiroir ou une pile déjà posée, une vignette suit le
   doigt, et le niveau survolé s'éclaire. Au relâcher, le produit se pose exactement
   là où on l'a lâché, à la position horizontale visée.
*/
const drag = { on: false, ref: null, moveId: null, ghost: null, shelf: -1, x: 0 };

function haptic(ms) {
  if (navigator.vibrate) try { navigator.vibrate(ms || 8); } catch (e) {}
}

/* Position en centimètres visée par un clic sur le rayon. */
function shelfPointFromEvent(e) {
  const p = shelfAtPoint(e.clientX, e.clientY);
  return p ? Math.max(0, Math.min(S.cur.W, p.cm)) : null;
}

function shelfAtPoint(clientX, clientY) {
  const svg = document.querySelector('#cw svg');
  if (!svg) return null;
  const r = svg.getBoundingClientRect();
  if (clientY < r.top || clientY > r.bottom || clientX < r.left || clientX > r.right) return null;
  // conversion écran -> repère du dessin
  const vb = svg.viewBox.baseVal;
  const scale = Math.min(r.width / vb.width, r.height / vb.height);
  const offX = (r.width - vb.width * scale) / 2;
  const offY = (r.height - vb.height * scale) / 2;
  const ux = (clientX - r.left - offX) / scale;
  const uy = (clientY - r.top - offY) / scale;
  const L = 40, sc = 3;
  const N = S.cur.shelves.length;
  const H = S.cur.H * sc, sh = H / N;
  const si = Math.max(0, Math.min(N - 1, Math.floor((uy - 4) / sh)));
  const cm = Math.max(0, (ux - L) / sc);
  return { si, cm };
}

function startDrag(e, ref, moveId) {
  const t = e.touches ? e.touches[0] : e;
  drag.on = true;
  drag.ref = ref;
  drag.moveId = moveId || null;
  const p = BY_REF[ref];
  const g = document.createElement('div');
  g.className = 'ghost';
  g.innerHTML = `<img src="${photoSrc(ref)}" alt=""><span>${p.ref}</span>`;
  document.body.appendChild(g);
  drag.ghost = g;
  document.body.classList.add('dragging');   // fige le défilement pendant le glissement
  moveGhost(t.clientX, t.clientY);
  haptic(10);
  e.preventDefault();
}

function moveGhost(x, y) {
  if (!drag.ghost) return;
  drag.ghost.style.transform = `translate(${x - 34}px, ${y - 44}px)`;
  const hit = shelfAtPoint(x, y);
  const si = hit ? hit.si : -1;
  if (si !== drag.shelf) {
    drag.shelf = si;
    if (si >= 0) { S.shelf = si; haptic(6); }
    update();
  }
  drag.x = hit ? hit.cm : 0;
}

function endDrag() {
  if (!drag.on) return;
  const { ref, moveId, shelf, x } = drag;
  drag.on = false;
  if (drag.ghost) drag.ghost.remove();
  drag.ghost = null;
  document.body.classList.remove('dragging');
  drag.shelf = -1;
  if (shelf < 0) { update(); return; }
  const items = S.cur.shelves[shelf].items;
  // position d'insertion : là où le doigt a lâché, en centimètres
  let acc = 0, at = items.length;
  for (let k = 0; k < items.length; k++) {
    const w = BY_REF[items[k].ref].w * items[k].f;
    if (x < acc + w / 2) { at = k; break; }
    acc += w;
  }
  if (moveId) {
    const f = findItem(moveId);
    if (!f) return;
    const [moved] = S.cur.shelves[f.si].items.splice(f.k, 1);
    const dest = S.cur.shelves[shelf].items;
    dest.splice(Math.min(at, dest.length), 0, moved);
    commit('Produit déplacé');
  } else {
    const p = BY_REF[ref];
    const df = Math.max(1, Math.min(p.df, Math.floor((S.cur.W - shelfW(S.cur.shelves[shelf])) / p.w) || 1));
    items.splice(at, 0, { id: uid(), ref, f: df, s: p.st });
    commit(`${p.ref} posé sur le niveau ${shelf + 1}`);
  }
  haptic(12);
  refreshCounts();
}

/* Un appui maintenu démarre le glissement ; un appui simple garde son rôle habituel. */
let pressTimer = null, pressStart = null;
function bindDrag() {
  const onDown = e => {
    const tile = e.target.closest('#pl .pi');
    const box = e.target.closest('#cw svg g[data-act="item"]');
    if (!tile && !box) return;
    if (box && S.selMode) return;
    const t = e.touches ? e.touches[0] : e;
    pressStart = { x: t.clientX, y: t.clientY, tile, box, e };
    pressTimer = setTimeout(() => {
      pressTimer = null;
      if (tile) startDrag(pressStart.e, tile.dataset.ref, null);
      else {
        const f = findItem(box.dataset.id);
        if (f) startDrag(pressStart.e, f.it.ref, box.dataset.id);
      }
    }, 200);
  };
  const onMove = e => {
    const t = e.touches ? e.touches[0] : e;
    if (pressTimer && pressStart) {
      const d = Math.hypot(t.clientX - pressStart.x, t.clientY - pressStart.y);
      if (d > 16) { clearTimeout(pressTimer); pressTimer = null; }
    }
    if (drag.on) { moveGhost(t.clientX, t.clientY); e.preventDefault(); }
  };
  const onUp = () => {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    endDrag();
  };
  document.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('mousedown', onDown);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchend', onUp);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchcancel', onUp);
}
bindDrag();

/* ================= ANNULER =================
   Plutôt qu'une flèche toujours présente, un bandeau discret apparaît juste après une
   action et s'efface au bout de quelques secondes. On peut aussi secouer l'appareil.
*/
let undoTimer = null;

function offerUndo(label) {
  const el = $('undobar');
  if (!el) return;
  const canRedo = S.hi < S.hist.length - 1;
  el.innerHTML = `<span>${esc(label)}</span><button data-act="undo">Annuler</button>` +
    (canRedo ? `<button data-act="redo">Rétablir</button>` : '');
  el.classList.add('on');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => el.classList.remove('on'), 4200);
}

function hideUndo() {
  const el = $('undobar');
  if (el) el.classList.remove('on');
}

// secouer pour annuler, comme dans les apps d'Apple
let shakeLast = 0;
window.addEventListener('devicemotion', e => {
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  const force = Math.abs(a.x || 0) + Math.abs(a.y || 0) + Math.abs(a.z || 0);
  if (force > 34 && Date.now() - shakeLast > 1200) {
    shakeLast = Date.now();
    if (S.cur && S.hi > 0) { undo(); haptic(14); toast('Action annulée'); }
  }
});

/* ---- rendu incrémental ---- */

function update() {
  if (!S.cur || !$('cw')) return;
  const W = S.cur.W,
    N = S.cur.shelves.length;
  let used = 0,
    fac = 0;
  const refs = new Set(),
    cats = {},
    warns = [];
  S.cur.shelves.forEach((sh, i) => {
    const w = shelfW(sh);
    used += Math.min(w, W);
    sh.items.forEach(it => {
      if (it.gap) return;
      fac += it.f;
      refs.add(it.ref);
      const p = BY_REF[it.ref];
      cats[p.cat] = (cats[p.cat] || 0) + p.w * it.f;
      const hh = p.h * (it.s || 1);
      if (hh > shelfH() - 1) warns.push(`Niveau ${i+1} : ${p.ref} fait ${hh.toFixed(1)} cm de haut${(it.s||1)>1?' ('+it.s+' empilés)':''}, niveau de ${shelfH().toFixed(0)} cm`);
    });
    if (w >W) warns.push(`Niveau ${i+1} : dépassement de ${(w-W).toFixed(1)} cm`);
  });
  $('lvl').innerHTML = `<button class="l selbtn${S.selMode?' on':''}" data-act="selmode">${S.selMode?ic('check',17)+' Sélection':ic('square',17)+' Sélection'}</button><span class="lbl">Placer sur</span>` + S.cur.shelves.map((sh, i) => {
    const w = shelfW(sh);
    return `<span class="l${i===S.shelf?' on':''}" data-act="shelf" data-i="${i}">N${i+1}<small>${w>W?'︎':Math.round(w/W*100)+'%'}</small></span>`;
  }).join('');
  const allItems = S.cur.shelves.flatMap(sh => sh.items),
    capacity = allItems.reduce((a, it) => a + itemCapacity(it), 0),
    dosVals = allItems.map(itemDOS).filter(x => x != null),
    avgDos = dosVals.length ? dosVals.reduce((a, b) => a + b, 0) / dosVals.length : null;
  $('stats').innerHTML = `<div class="st">Remplissage<b>${Math.round(used/(W*N)*100)} %</b></div><div class="st">Références<b>${refs.size}</b></div><div class="st">Boîtes de face<b>${fac}</b></div><div class="st">Capacité<b>${capacity} u.</b></div>${avgDos!=null?`<div class="st">Stock moyen<b>${avgDos.toFixed(1)} j</b></div>`:''}<div class="st">Largeur occupée<b>${Math.round(used)} / ${W*N} cm</b></div>` + Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, w]) => `<div class="st" style="border-left-color:${BRAND[c]}">${esc(c)}<b>${used?Math.round(w/used*100):0} %</b></div>`).join('');
  allItems.forEach(it => {
    const d = itemDOS(it);
    if (d != null && d < 7) warns.push(`${it.ref} : seulement ${d.toFixed(1)} jours de stock estimés`);
  });
  $('warns').innerHTML = selBar() + [...new Set(warns)].map(w => `<div class="warn">${esc(w)}</div>`).join('');
  drawGondola();

}

function drawGondola() {
  const c = $('cw');
  if (c) c.innerHTML = gondolaSVG(true, true);
}

function gradId(brand) {
  return BRANDS.indexOf(brand);
}

/* ================= GABARITS DE CONTENANTS =================
   Une boîte ronde n'est pas un rectangle : elle a un couvercle, des bords qui fuient
   et une lumière qui glisse sur le métal. On dessine donc une silhouette par type de
   contenant, et la photo vient s'y loger, resserrée sur les côtés pour épouser la
   courbure. C'est cette petite distorsion qui fait qu'une canette a l'air d'une
   canette et non d'une vignette collée.
*/
function shapeOf(p) {
  if (/Soupe/.test(p.name)) return 'brique';
  if (/Terrine|Mousse|Complet/.test(p.name)) return 'barquette';
  if (p.cat === "William's" && p.univ === 'chat' && p.fmt === '85g') return 'pochon';
  if (/Beauty|Health Care|Vitality|Sterilised/.test(p.name) || /Junior, poulet, 70g/.test(p.name)) return 'pochon';
  if (p.cat === 'Gustav' && p.fmt === '150g') return 'barquette';
  if (p.fmt === '6×70g') return 'multipack';
  return 'canette';
}

/* Renvoie le tracé du contenant et la zone où poser la photo. */
function shapeGeometry(kind, x, y, w, h) {
  const r = Math.min(w, h) * .12;
  switch (kind) {
    case 'canette': {
      const lid = Math.max(2, h * .10);       // couvercle
      const rim = Math.max(1.5, h * .06);     // sertissage du bas
      return {
        body: `M${x} ${y+lid} h${w} v${h-lid-rim} q0 ${rim} ${-w/2} ${rim} q${-w/2} 0 ${-w/2} ${-rim} z`,
        lidPath: `M${x} ${y+lid} q${w/2} ${-lid*1.5} ${w} 0 z`,
        photo: { x: x + w * .07, y: y + lid, w: w * .86, h: h - lid - rim },
        curve: true
      };
    }
    case 'barquette': {
      const lip = Math.max(1.5, h * .16);
      return {
        body: `M${x} ${y+lip} h${w} v${h-lip} h${-w} z`,
        lidPath: `M${x-w*.03} ${y} h${w*1.06} v${lip} h${-w*1.06} z`,
        photo: { x: x + w * .04, y: y + lip * .2, w: w * .92, h: h - lip * .2 },
        curve: false
      };
    }
    case 'brique':
      return {
        body: `M${x} ${y+h*.06} q0 ${-h*.06} ${w*.18} ${-h*.06} h${w*.64} q${w*.18} 0 ${w*.18} ${h*.06} v${h*.94} h${-w} z`,
        lidPath: '',
        photo: { x: x + w * .05, y: y + h * .08, w: w * .9, h: h * .88 },
        curve: false
      };
    case 'pochon':
      return {
        body: `M${x+w*.12} ${y} h${w*.76} q${w*.12} 0 ${w*.12} ${w*.12} v${h-w*.12} q0 ${w*.1} ${-w*.14} ${w*.1} h${-w*.72} q${-w*.14} 0 ${-w*.14} ${-w*.1} v${-(h-w*.12)} q0 ${-w*.12} ${w*.12} ${-w*.12} z`,
        lidPath: `M${x+w*.12} ${y} h${w*.76} v${h*.07} h${-w*.76} z`,
        photo: { x: x + w * .1, y: y + h * .06, w: w * .8, h: h * .9 },
        curve: false
      };
    case 'multipack':
      return {
        body: `M${x} ${y} h${w} v${h} h${-w} z`,
        lidPath: `M${x} ${y} h${w} v${h*.12} h${-w} z`,
        photo: { x: x + w * .03, y: y + h * .14, w: w * .94, h: h * .82 },
        curve: false
      };
    default:
      return { body: `M${x} ${y} h${w} v${h} h${-w} z`, lidPath: '', photo: { x, y, w, h }, curve: false };
  }
}

/* Dessine un contenant : silhouette, photo intégrée, ombrage. */
function drawContainer(p, x, y, w, h, url, dark, idSeed) {
  const kind = shapeOf(p);
  const g = shapeGeometry(kind, x, y, w, h);
  const cid = 'sh' + idSeed;
  let s = `<clipPath id="${cid}"><path d="${g.body}"/></clipPath>`;

  if (kind === 'canette') {
    // corps en fer-blanc : gris métal, pas la couleur de la marque
    s += `<path d="${g.body}" fill="url(#metal)"/>`;
    const ph = g.photo;
    // l'étiquette ne couvre pas toute la boîte : un anneau de métal reste visible
    const inset = Math.max(1, h * .06);
    const ly = ph.y + inset, lh = ph.h - inset * 2;
    const lid = 'lb' + idSeed;
    s += `<clipPath id="${lid}"><rect x="${x}" y="${ly}" width="${w}" height="${lh}"/></clipPath>`;
    if (url) {
      // la photo est étirée sur la largeur de la boîte, comme une étiquette enroulée :
      // on la resserre légèrement sur les bords pour suivre la courbure
      s += `<image href="${url}" xlink:href="${url}" x="${x - w * .10}" y="${ly - lh * .18}" width="${w * 1.20}" height="${lh * 1.36}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${lid})"/>`;
      s += `<rect x="${x}" y="${ly}" width="${w}" height="${lh}" fill="url(#cyl)" clip-path="url(#${lid})" opacity=".55"/>`;
    } else {
      s += `<rect x="${x}" y="${ly}" width="${w}" height="${lh}" fill="url(#grad${gradId(p.cat)})" clip-path="url(#${lid})"/>`;
      s += `<rect x="${x}" y="${ly}" width="${w}" height="${lh}" fill="url(#cyl)" clip-path="url(#${lid})" opacity=".5"/>`;
    }
    // liserés du haut et du bas de l'étiquette
    s += `<line x1="${x}" y1="${ly}" x2="${x+w}" y2="${ly}" stroke="rgba(0,0,0,.22)" stroke-width=".5"/>`;
    s += `<line x1="${x}" y1="${ly+lh}" x2="${x+w}" y2="${ly+lh}" stroke="rgba(0,0,0,.22)" stroke-width=".5"/>`;
    // reflet du métal sur toute la boîte
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#cyl)" clip-path="url(#${cid})" opacity=".38"/>`;
    // couvercle bombé
    if (g.lidPath) s += `<path d="${g.lidPath}" fill="url(#lidg)"/>`;
    s += `<path d="${g.body}" fill="none" stroke="rgba(0,0,0,.28)" stroke-width=".7"/>`;
    return s;
  }

  // autres contenants : la photo occupe toute la face
  s += `<path d="${g.body}" fill="url(#grad${gradId(p.cat)})"/>`;
  if (url) {
    const ph = g.photo;
    s += `<image href="${url}" xlink:href="${url}" x="${ph.x}" y="${ph.y}" width="${ph.w}" height="${ph.h}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${cid})"/>`;
  }
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#flat)" clip-path="url(#${cid})" opacity=".45"/>`;
  if (g.lidPath) s += `<path d="${g.lidPath}" fill="${dark ? 'rgba(255,255,255,.20)' : 'rgba(0,0,0,.13)'}"/>`;
  s += `<path d="${g.body}" fill="none" stroke="${dark ? 'rgba(0,0,0,.5)' : 'rgba(0,0,0,.18)'}" stroke-width=".7"/>`;
  return s;
}

let clipSeq = 0;

function gondolaSVG(interactive, photos, scene) {
  const sc = 3,
    W = S.cur.W * sc,
    H = S.cur.H * sc,
    N = S.cur.shelves.length,
    sh = H / N,
    L = 40,
    B = 20;
  const dark = matchMedia('(prefers-color-scheme:dark)').matches;
  clipSeq = 0;
  // pas de largeur fixe : le rayon s'étire pour occuper toute la place disponible
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W+L+8} ${H+B+8}" preserveAspectRatio="xMidYMid meet" font-family="-apple-system,system-ui,sans-serif" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs><linearGradient id="backpanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#54585d"/><stop offset="1" stop-color="#3a3d42"/></linearGradient><linearGradient id="shelfedge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f3f5"/><stop offset="1" stop-color="#c6cacf"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d9196"/><stop offset=".16" stop-color="#e3e6e9"/><stop offset=".42" stop-color="#c3c7cc"/><stop offset=".72" stop-color="#a8adb3"/><stop offset="1" stop-color="#7e8288"/></linearGradient><linearGradient id="lidg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa0a6"/><stop offset=".3" stop-color="#eceef0"/><stop offset="1" stop-color="#8b9096"/></linearGradient><linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(0,0,0,.28)"/><stop offset=".18" stop-color="rgba(255,255,255,.30)"/><stop offset=".45" stop-color="rgba(255,255,255,.06)"/><stop offset="1" stop-color="rgba(0,0,0,.30)"/></linearGradient><linearGradient id="flat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.26)"/><stop offset="1" stop-color="rgba(0,0,0,.16)"/></linearGradient>${BRANDS.map((b, i) => `<linearGradient id="grad${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${BRAND_LIGHT[b]}"/><stop offset="1" stop-color="${BRAND_DARK[b]}"/></linearGradient>`).join('')}</defs>
  ${scene
    ? `<rect x="${L}" y="4" width="${W}" height="${H}" fill="url(#backpanel)"/>`
    : `<rect x="${L}" y="4" width="${W}" height="${H}" fill="${dark?'#2c2c2e':'#fff'}" stroke="${dark?'#8e8e93':'#8d8b82'}" stroke-width="1.5"/>`}`;
  S.cur.shelves.forEach((shelf, i) => {
    const y0 = 4 + i * sh,
      y1 = y0 + sh,
      act = interactive && i === S.shelf;
    s += `<rect x="${L}" y="${y0}" width="${W}" height="${sh}" fill="${act?'rgba(21,107,86,.09)':'transparent'}" data-act="shelf" data-i="${i}"/>`;
    if (scene) {
      // vraie tablette : chant clair, tranche sombre, ombre projetée au-dessous
      s += `<rect x="${L-2}" y="${y1}" width="${W+4}" height="5" rx="1" fill="url(#shelfedge)"/>`;
      s += `<rect x="${L-2}" y="${y1+5}" width="${W+4}" height="2.5" fill="rgba(0,0,0,.22)"/>`;
      s += `<rect x="${L}" y="${y1-3}" width="${W}" height="3" fill="rgba(0,0,0,.10)"/>`;
    } else {
      s += `<line x1="${L}" y1="${y1}" x2="${L+W}" y2="${y1}" stroke="${dark?'#8e8e93':'#3a3a3c'}" stroke-width="2.5"/>`;
    }
    if (!scene) s += `<text x="${L-6}" y="${y0+sh/2+5}" font-size="13" font-weight="${act?'700':'500'}" fill="${act?'#156b56':'#8e8e93'}" text-anchor="end" data-act="shelf" data-i="${i}">N${i+1}</text>`;
    let x = L;
    const over = shelfW(shelf) >S.cur.W;
    shelf.items.forEach(it => {
      if (it.gap) { x += it.gap * sc; return; }   // espace de calage d'une colonne
      const p = BY_REF[it.ref];
      const st = it.s || 1;
      const wOne = p.w * sc,
        hOne = Math.min(p.h * sc, (sh - 15) / st);
      const url = photos ? photoURL(it.ref) : null;
      for (let k = 0; k < it.f; k++) {
        const bad = over && x + wOne > L + W;
        s += `<g data-act="item" data-id="${it.id}" style="cursor:pointer">`;
        const picked = S.selMode && S.sel.includes(it.id);
        if (scene) s += `<ellipse cx="${x+wOne/2}" cy="${y1-1}" rx="${wOne*.46}" ry="1.6" fill="rgba(0,0,0,.28)"/>`;
        for (let j2 = 0; j2 < st; j2++) {
          const yy = y1 - (j2 + 1) * hOne;
          if (bad) {
            s += `<rect x="${x+.5}" y="${yy+.5}" width="${wOne-1}" height="${hOne-1}" rx="2.5" fill="#ff3b30"/>`;
          } else {
            s += drawContainer(p, x + .5, yy + .5, wOne - 1, hOne - 1, url, dark, clipSeq++);
          }
        }
        // la référence n'est écrite sur la boîte qu'en l'absence de photo
        if (k === 0 && !url && hOne > 12) {
          const yt = y1 - st * hOne;
          s += `<text x="${x+2.5}" y="${yt+9}" font-size="7" font-weight="700" fill="#fff" opacity=".9" pointer-events="none">${p.ref}</text>`;
        }
        if (picked) s += `<rect x="${x+1}" y="${y1-st*hOne+1}" width="${wOne-2}" height="${st*hOne-2}" rx="3" fill="rgba(36,154,109,.3)" stroke="#249A6D" stroke-width="2"/>`;
        s += `</g>`;
        x += wOne;
      }
    });
    // bandeau du niveau : la liste des références placées, à l'aplomb de chaque produit
    if (shelf.items.length && !scene) {
      const bh2 = 11;
      s += `<rect x="${L}" y="${y0 + 1}" width="${W}" height="${bh2}" fill="${dark?'rgba(255,255,255,.07)':'rgba(0,0,0,.05)'}"/>`;
      let bx2 = L;
      shelf.items.forEach(it => {
        if (it.gap) { bx2 += it.gap * sc; return; }
        const pr = BY_REF[it.ref];
        const wTot = pr.w * it.f * sc;
        // on n'écrit que ce qui tient dans la largeur du produit
        let lab = pr.ref;
        if (wTot > 46 && it.f > 1) lab += ' ×' + it.f;
        if (wTot > 66 && (it.s || 1) > 1) lab += ' ↑' + it.s;
        if (wTot > 15) {
          s += `<text x="${bx2 + wTot / 2}" y="${y0 + 9}" font-size="7" font-weight="700" fill="${dark?'#ebebf5':'#3c3c43'}" text-anchor="middle" pointer-events="none">${lab}</text>`;
          s += `<line x1="${bx2 + 0.5}" y1="${y0 + 2}" x2="${bx2 + 0.5}" y2="${y0 + 11}" stroke="${dark?'rgba(255,255,255,.18)':'rgba(0,0,0,.12)'}"/>`;
        }
        bx2 += wTot;
      });
    }
    if (interactive && i === S.shelf && S.insertAt != null) {
      const mx = L + S.insertAt * sc;
      s += `<line x1="${mx}" y1="${y0+12}" x2="${mx}" y2="${y1-1}" stroke="#249A6D" stroke-width="2" stroke-dasharray="4 3"/>`;
      s += `<circle cx="${mx}" cy="${y0+12}" r="3.5" fill="#249A6D"/>`;
    }
    if (interactive) {
      const rest = S.cur.W - shelfW(shelf);
      if (rest > 0) s += `<text x="${L+W-4}" y="${y0+11}" font-size="8" fill="#aaa" text-anchor="end" pointer-events="none">${rest.toFixed(0)} cm</text>`;
    }
  });
  if (scene) return s + '</svg>';
  for (let c = 0; c <= S.cur.W; c += 10) {
    const x = L + c * sc;
    s += `<line x1="${x}" y1="${H+4}" x2="${x}" y2="${H+8}" stroke="#999"/>${c%50===0?`<text x="${x}" y="${H+18}" font-size="8" fill="#8e8e93" text-anchor="middle">${c}</text>`:''}`;
  }
  return s + '</svg>';
}

/* ---- édition placement ---- */

function findItem(id) {
  for (let i = 0; i < S.cur.shelves.length; i++) {
    const k = S.cur.shelves[i].items.findIndex(x => x.id === id);
    if (k >= 0) return {
      si: i,
      k,
      it: S.cur.shelves[i].items[k]
    };
  }
  return null;
}

function editItem(id) {
  const f = findItem(id);
  if (!f) return;
  const p = BY_REF[f.it.ref];
  sheet(`<div class="hdrow"><div class="ph"><img data-ph="${p.ref}" src="${photoSrc(p.ref)}" alt=""></div><div><h2 style="font-size:17px;margin:0">${esc(p.name)}</h2><p style="margin:2px 0 0">Réf. ${p.ref} · ${p.w}×${p.h} cm (l×h) · N${f.si+1}, pos. ${f.k+1}/${S.cur.shelves[f.si].items.length}</p></div></div>
   <div class="stp"><button data-act="fac" data-id="${id}" data-v="${f.it.f-1}">−</button><div class="v">${f.it.f}<small>de face · ${(p.w*f.it.f).toFixed(0)} cm</small></div><button data-act="fac" data-id="${id}" data-v="${f.it.f+1}">＋</button></div>
   <div class="qs">${[1,2,3,4,6,8].map(n=>`<button data-act="fac" data-id="${id}" data-v="${n}" class="${f.it.f===n?'on':''}">${n}</button>`).join('')}</div>
   <p style="margin:0 0 4px;font-size:12px">Boîtes superposées · ${(p.h*(f.it.s||1)).toFixed(1)} cm de haut</p>
   <div class="qs">${[1,2,3,4,5,6].map(n=>`<button data-act="stk" data-id="${id}" data-v="${n}" class="${(f.it.s||1)===n?'on':''}">${n}</button>`).join('')}</div>
   <div class="two"><button class="btn" data-act="mv" data-id="${id}" data-v="L">◀ Gauche</button><button class="btn" data-act="mv" data-id="${id}" data-v="R">Droite ▶</button></div>
   <div class="two"><button class="btn" data-act="mv" data-id="${id}" data-v="U" ${f.si===0?'disabled':''}>▲ Niveau ${f.si}</button><button class="btn" data-act="mv" data-id="${id}" data-v="D" ${f.si===S.cur.shelves.length-1?'disabled':''}>▼ Niveau ${f.si+2}</button></div>

function setS(id, n) {
  const f = findItem(id);
  if (!f) return;
  n = Math.max(1, Math.min(8, n));
  if (n === (f.it.s || 1)) return;
  f.it.s = n;
  snap();
  persist();
  update();
  editItem(id);
}

function setF(id, n) {
  const f = findItem(id);
  if (!f) return;
  n = Math.max(1, Math.min(30, Math.round(n) || 1));
  if (n === f.it.f) return;
  f.it.f = n;
  snap();
  persist();
  update();
  refreshCounts();
  editItem(id);
}

function mv(id, dir) {
  const f = findItem(id);
  if (!f) return;
  const arr = S.cur.shelves[f.si].items;
  if (dir === 'L' && f.k > 0)[arr[f.k - 1], arr[f.k]] = [arr[f.k], arr[f.k - 1]];
  else if (dir === 'R' && f.k < arr.length - 1)[arr[f.k + 1], arr[f.k]] = [arr[f.k], arr[f.k + 1]];
  else if (dir === 'U' && f.si > 0) {
    arr.splice(f.k, 1);
    S.cur.shelves[f.si - 1].items.push(f.it);
  } else if (dir === 'D' && f.si < S.cur.shelves.length - 1) {
    arr.splice(f.k, 1);
    S.cur.shelves[f.si + 1].items.push(f.it);
  } else return;
  snap();
  persist();
  update();
  editItem(id);
}

/* ================= IMPORT D'UNE PROFORMA =================
   On accepte un fichier CSV, TSV ou texte, ou un simple copier-coller. On y cherche
   les références du catalogue, avec la quantité qui les accompagne éventuellement.
   La quantité sert de poids : plus une référence est commandée, plus elle reçoit de
   facings dans l'implantation proposée.
*/
let PROFORMA = null;

function parseProforma(text) {
  const found = new Map();
  const known = new Set(PRODUCTS.map(p => p.ref));
  text.split(/[\r\n]+/).forEach(line => {
    const cells = line.split(/[;,\t|]/).map(c => c.trim());
    let ref = null;
    for (const c of cells) {
      const t = c.replace(/^réf\.?\s*/i, '').replace(/\s+/g, '').toUpperCase();
      if (known.has(t)) { ref = t; break; }
    }
    if (!ref) {
      const m = line.toUpperCase().match(/\b(G\d{3}|\d{2,4})\b/g);
      if (m) for (const c of m) if (known.has(c)) { ref = c; break; }
    }
    if (!ref) return;
    // quantité : le premier nombre entier plausible qui n'est pas la référence
    let qty = 0;
    for (const c of cells) {
      const v = parseInt(String(c).replace(/\s/g, ''), 10);
      if (Number.isInteger(v) && String(v) !== ref && v > 0 && v < 10000) { qty = v; break; }
    }
    found.set(ref, (found.get(ref) || 0) + (qty || 1));
  });
  return [...found.entries()].map(([ref, qty]) => ({ ref, qty }));
}

function proformaSheet() {
  sheet(`<h2>Implantation depuis une proforma</h2>
   <p>Charge ta proforma en CSV ou texte, ou colle simplement son contenu. L'app y repère les références du catalogue et les quantités, puis te propose une implantation.</p>
   <button class="btn p" data-act="prof-file">${ic('doc')} Choisir un fichier</button>
   <p style="margin:14px 0 6px"><b>ou colle le contenu ici</b></p>
   <textarea id="profText" rows="6" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--sep);font-size:13px;font-family:inherit;background:var(--card)" placeholder="8050 ; 24&#10;G640 ; 12&#10;130 ; 6"></textarea>
   <button class="btn" data-act="prof-paste">Analyser le texte collé</button>
   <button class="btn" data-act="close">Fermer</button>`);
}

function proformaLoaded(text) {

  if (!rows.length) {
    sheet(`<h2>Aucune référence reconnue</h2><p>Le fichier ne contient aucune référence du catalogue. Vérifie qu'une colonne porte bien les références, du type 8050, G640 ou 130.</p><button class="btn" data-act="prof-open">Réessayer</button><button class="btn" data-act="close">Fermer</button>`);
    return;
  }
  const univs = {};

   <p><b>Comment organiser le rayon ?</b></p>

   <button class="btn" data-act="prof-run" data-v="bloc">${ic('box')} Blocs de marques<br><span style="font-size:12px;opacity:.75">chaque marque forme un bloc compact, formats regroupés</span></button>
   <button class="btn" data-act="close">Annuler</button>`);
