  ${remote ? `<div class="warn noprint">${remote} visuel${remote>1?'s':''} n'a pas pu être incorporé et sera absent si vous imprimez hors ligne. Dans l'app : Photos produits → Importer.</div>` : ''}
  <div class="plan">${svg}</div>
</div>
<div>
  <h2>Détail de l'implantation</h2>
  <table><tr><th>Niveau</th><th>Réf.</th><th>Produit</th><th>Format</th><th>Boîtes de face</th><th>Superposées</th><th>Largeur</th></tr>
  ${S.cur.shelves.flatMap((sh, i) => sh.items.map(it => {
    const p = BY_REF[it.ref];
    return `<tr><td>N${i+1}</td><td>${it.ref}</td><td>${esc(p.name)}</td><td>${p.fmt}</td><td>${it.f}</td><td>${it.s||1}</td><td>${(p.w*it.f).toFixed(1)} cm</td></tr>`;
  })).join('')}
  </table>
</div>
<p class="noprint" style="margin-top:18px"><button onclick="print()" style="padding:12px 18px;font-size:16px;border-radius:10px;border:0;background:var(--bubi-graphite);color:#fff">Imprimer / Enregistrer en PDF</button></p>
</body></html>`;
  shareOrDownload(new Blob([html], {
    type: 'text/html'
  }), fileName('html'), () => '<pre>Fiche commerciale prête à imprimer en PDF.</pre>');
}

/* ================= HAUTEUR DU CATALOGUE =================
   Sur téléphone, le catalogue partageait l'écran à parts fixes : les cartes produits se
   retrouvaient trop bas, à la limite du pouce. Il a maintenant trois hauteurs — replié,
   moitié, plein écran — que l'on change d'un appui sur la poignée, et qu'on peut aussi
   régler au doigt en faisant glisser cette poignée. Le réglage est mémorisé.
*/
const DRAWERKEY = 'bubiplan_drawer';
try { S.drawer = lsGet(DRAWERKEY) || (window.innerWidth < 900 ? 'full' : 'half'); } catch (e) {}

function drawerIcon() {
  return S.drawer === 'full' ? ic('right', 18) : ic('left', 18);
}

function setDrawer(state) {
  S.drawer = state;
  lsSet(DRAWERKEY, state);
  const el = $('dr');
  if (el) {
    el.classList.remove('min', 'half', 'full');
    el.classList.add(state);
    el.style.height = '';
  }
  const b = $('bDr');
  if (b) b.innerHTML = drawerIcon();
  haptic(6);
}

function cycleDrawer() {
  setDrawer(S.drawer === 'half' ? 'full' : S.drawer === 'full' ? 'min' : 'half');
}

/* Glisser la poignée règle librement la hauteur, puis on s'aimante au palier le plus proche. */
function bindDrawerDrag() {
  let start = null;
  const grab = () => document.querySelector('.dr .grab');
  const onDown = e => {
    const g = e.target.closest('.grab');
    if (!g || window.innerWidth >= 900) return;
    const t = e.touches ? e.touches[0] : e;
    start = { y: t.clientY, h: $('dr').getBoundingClientRect().height };
    e.preventDefault();
  };
  const onMove = e => {
    if (!start) return;
    const t = e.touches ? e.touches[0] : e;
    const h = Math.max(58, Math.min(window.innerHeight * .9, start.h + (start.y - t.clientY)));
    $('dr').style.height = h + 'px';
    e.preventDefault();
  };
  const onUp = () => {
    if (!start) return;
    const h = $('dr').getBoundingClientRect().height / window.innerHeight;
    start = null;
    setDrawer(h < .22 ? 'min' : h < .68 ? 'half' : 'full');
  };
  const armer = () => {
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mousemove', onMove);
  };
  const desarmer = () => {
    document.removeEventListener('touchmove', onMove, { passive: false });
    document.removeEventListener('mousemove', onMove);
  };
  const down = e => { onDown(e); if (start) armer(); };
  const up = () => { onUp(); desarmer(); };

  document.addEventListener('touchstart', down, { passive: false });
  document.addEventListener('mousedown', down);
  document.addEventListener('touchend', up);
  document.addEventListener('mouseup', up);
}
bindDrawerDrag();

/* ================= SÉLECTION MULTIPLE =================
   Premier appui : point de départ. Deuxième appui sur le même niveau : toute la plage
   comprise entre les deux est prise. On règle ensuite les facings et la hauteur de
   tout le groupe d'un seul geste.
*/
function toggleSelect(id) {
  const f = findItem(id);
  if (!f) return;
  if (S.sel.includes(id)) {
    S.sel = S.sel.filter(x => x !== id);
  } else if (S.sel.length) {
    const first = findItem(S.sel[S.sel.length - 1]);
    if (first && first.si === f.si) {
      const a = Math.min(first.k, f.k), b = Math.max(first.k, f.k);
      const range = S.cur.shelves[f.si].items.slice(a, b + 1).map(i => i.id);
      S.sel = [...new Set([...S.sel, ...range])];
    } else {
      S.sel.push(id);
    }
  } else {
    S.sel.push(id);
  }
  update();
}

function selApply(key, delta) {
  if (!S.sel.length) return;
  S.sel.forEach(id => {
    const f = findItem(id);
    if (!f) return;
    const cur = key === 'f' ? f.it.f : (f.it.s || 1);
    const val = Math.max(1, Math.min(key === 'f' ? 30 : 8, cur + delta));
    if (key === 'f') f.it.f = val; else f.it.s = val;
  });
  snap();
  persist();
  update();
  refreshCounts();
}

function selBar() {
  if (!S.selMode) return '';
  const n = S.sel.length;
  return `<div class="selbar">
    <span class="c">${n ? n + ' sélectionné' + (n > 1 ? 's' : '') : 'Appuie sur un produit, puis sur un autre'}</span>
    <button class="sb2" data-act="sel-f" data-v="-1" ${n?'':'disabled'}>Moins large</button>
    <button class="sb2" data-act="sel-f" data-v="1" ${n?'':'disabled'}>Plus large</button>
    <button class="sb2" data-act="sel-s" data-v="-1" ${n?'':'disabled'}>Moins haut</button>
    <button class="sb2" data-act="sel-s" data-v="1" ${n?'':'disabled'}>Plus haut</button>
    <button class="sb2" data-act="sel-all">Tout le niveau</button>
    <button class="sb2 d" data-act="sel-del" ${n?'':'disabled'}>Retirer</button>
    <button class="sb2" data-act="selmode">Terminer</button>
  </div>`;
}

/* Petit retour tactile à chaque action confirmée. */
function haptic(ms) {
  if (navigator.vibrate) try { navigator.vibrate(ms || 8); } catch (e) {}
}

/* Position en centimètres visée par un appui sur le rayon. */
function shelfPointFromEvent(e) {
  const p = shelfAtPoint(e.clientX, e.clientY);
  return p ? Math.max(0, Math.min(S.cur.W, p.cm)) : null;
}

function shelfAtPoint(clientX, clientY) {
  const svg = document.querySelector('#cw svg');
  if (!svg) return null;
  const r = svg.getBoundingClientRect();
  if (clientY < r.top || clientY > r.bottom || clientX < r.left || clientX > r.right) return null;
  const vb = svg.viewBox.baseVal;
  const scale = Math.min(r.width / vb.width, r.height / vb.height);
  const offX = (r.width - vb.width * scale) / 2;
  const offY = (r.height - vb.height * scale) / 2;
  const ux = (clientX - r.left - offX) / scale;
  const uy = (clientY - r.top - offY) / scale;
  const L = 56, sc = 3;
  const N = S.cur.shelves.length;
  const H = S.cur.H * sc, sh = H / N;
  const si = Math.max(0, Math.min(N - 1, Math.floor((uy - 4) / sh)));
  return { si, cm: Math.max(0, (ux - L) / sc) };
}



/* ================= ANNULER =================
   Plutôt qu'une flèche toujours présente, un bandeau discret apparaît juste après une
   action et s'efface au bout de quelques secondes. On peut aussi secouer l'appareil.
*/
let undoTimer = null;

function offerUndo(label) {
  const el = $('undobar');
  if (!el) return;
  const canRedo = S.hi < S.hist.length - 1;
  el.innerHTML = `<span>${esc(label)}</span><button data-act="undo">Annuler</button>` +
    (canRedo ? `<button data-act="redo">Rétablir</button>` : '');
  el.classList.add('on');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => el.classList.remove('on'), 4200);
}

function hideUndo() {
  const el = $('undobar');
  if (el) el.classList.remove('on');
}

// secouer pour annuler, comme dans les apps d'Apple
let shakeLast = 0;
window.addEventListener('devicemotion', e => {
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  const force = Math.abs(a.x || 0) + Math.abs(a.y || 0) + Math.abs(a.z || 0);
  if (force > 34 && Date.now() - shakeLast > 1200) {
    shakeLast = Date.now();
    if (S.cur && S.hi > 0) { undo(); haptic(14); toast('Action annulée'); }
  }
});

/* ---- rendu incrémental ---- */

function update() {
  if (!S.cur || !$('cw')) return;
  const W = S.cur.W,
    N = S.cur.shelves.length;
  let used = 0,
    fac = 0;
  const refs = new Set(),
    cats = {},
    warns = [];
  S.cur.shelves.forEach((sh, i) => {
    const w = shelfW(sh);
    used += Math.min(w, W);
    sh.items.forEach(it => {
      if (it.gap) return;
      fac += it.f;
      refs.add(it.ref);
      const p = BY_REF[it.ref];
      cats[p.cat] = (cats[p.cat] || 0) + p.w * it.f;
      const hh = p.h * (it.s || 1);
      if (hh > shelfH() - 1) warns.push(`Niveau ${i+1} : ${p.ref} fait ${hh.toFixed(1)} cm de haut${(it.s||1)>1?' ('+it.s+' empilés)':''}, niveau de ${shelfH().toFixed(0)} cm`);
    });
    if (w >W) warns.push(`Niveau ${i+1} : dépassement de ${(w-W).toFixed(1)} cm`);
  });
  $('lvl').innerHTML = `<button class="l selbtn${S.selMode?' on':''}" data-act="selmode">${S.selMode?ic('check',17)+' Sélection':ic('square',17)+' Sélection'}</button><span class="lbl">Placer sur</span>` + S.cur.shelves.map((sh, i) => {
    const w = shelfW(sh);
    return `<span class="l${i===S.shelf?' on':''}" data-act="shelf" data-i="${i}">N${i+1}<small>${w>W?'︎':Math.round(w/W*100)+'%'}</small></span>`;
  }).join('');
  const allItems = S.cur.shelves.flatMap(sh => sh.items),
    capacity = allItems.reduce((a, it) => a + itemCapacity(it), 0),
    dosVals = allItems.map(itemDOS).filter(x => x != null),
    avgDos = dosVals.length ? dosVals.reduce((a, b) => a + b, 0) / dosVals.length : null;
  $('stats').innerHTML = `<div class="st"><b>${Math.round(used/(W*N)*100)} %</b>Remplissage</div><div class="st"><b>${refs.size}</b>Références</div><div class="st"><b>${fac}</b>Boîtes de face</div><div class="st"><b>${capacity} u.</b>Capacité</div>${avgDos!=null?`<div class="st"><b>${avgDos.toFixed(0)} j</b>Stock moyen</div>`:''}` +
    Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, w]) => `<div class="st fam" style="--fam:${familyColor({cat:c,fmt:'150g'})}"><b>${used?Math.round(w/used*100):0} %</b>${esc(c)}</div>`).join('');
  allItems.forEach(it => {
    const d = itemDOS(it);
    if (d != null && d < 7) warns.push(`${it.ref} : seulement ${d.toFixed(1)} jours de stock estimés`);
  });
  $('warns').innerHTML = selBar() + [...new Set(warns)].map(w => `<div class="warn">${esc(w)}</div>`).join('');
  drawGondola();

}

function drawGondola() {
  const c = $('cw');
  if (c) c.innerHTML = gondolaSVG(true, true);
}

function gradId(brand) {
  return BRANDS.indexOf(brand);
}

let clipSeq = 0;
let fresh = null;
let blueprintReveal = false;   // pendant un remplissage automatique, les produits sont d'abord dessinés en plan   // identifiant du dernier produit posé, pour l'animation blueprint → produit

function gondolaSVG(interactive, photos, scene) {
  const sc = 3,
    W = S.cur.W * sc,
    H = S.cur.H * sc,
    N = S.cur.shelves.length,
    sh = H / N,
    L = 56,
    B = 20;
  const dark = matchMedia('(prefers-color-scheme:dark)').matches;
  clipSeq = 0;
  // pas de largeur fixe : le rayon s'étire pour occuper toute la place disponible
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W+L+10} ${H+B+10}" preserveAspectRatio="xMidYMid meet" font-family="-apple-system,system-ui,sans-serif" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>${BRANDS.map((b, i) => `<linearGradient id="grad${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${BRAND_LIGHT[b]}"/><stop offset="1" stop-color="${BRAND_DARK[b]}"/></linearGradient>`).join('')}</defs>
  <rect x="${L}" y="4" width="${W}" height="${H}" fill="var(--bubi-surface)"/>
  <rect x="${L-5}" y="0" width="5" height="${H+8}" rx="1.5" fill="${scene ? 'var(--bubi-shelf)' : 'var(--bubi-graphite)'}" opacity="${scene ? 1 : .5}"/>
  <rect x="${L+W}" y="0" width="5" height="${H+8}" rx="1.5" fill="${scene ? 'var(--bubi-shelf)' : 'var(--bubi-graphite)'}" opacity="${scene ? 1 : .5}"/>`;
  S.cur.shelves.forEach((shelf, i) => {
    const y0 = 4 + i * sh,
      y1 = y0 + sh,
      act = interactive && i === S.shelf;
    s += `<rect x="${L}" y="${y0}" width="${W}" height="${sh}" fill="${act?'rgba(220,232,238,.45)':'transparent'}" data-act="shelf" data-i="${i}"/>`;
    // tablette : Shelf Beige, le mobilier reste reconnaissable dans les deux modes
    s += `<rect x="${L-2}" y="${y1-1}" width="${W+4}" height="${scene ? 5 : 3.5}" rx="1" fill="var(--bubi-shelf)"/>`;
    if (scene) s += `<rect x="${L-2}" y="${y1+4}" width="${W+4}" height="1.5" fill="rgba(40,50,56,.18)"/>`;
    // niveau vide : emplacements fantômes en plan, pour montrer que c'est à concevoir
    if (interactive && !shelf.items.length) {
      const gw = Math.min(30, W / 6), gh = Math.min(sh * .55, 36), n = Math.max(1, Math.floor((W - 12) / (gw + 8)));
      for (let g = 0; g < n; g++) {
        const gx = L + 6 + g * (gw + 8), gy = y1 - 3 - gh;
        s += `<rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" rx="3" fill="rgba(220,232,238,.35)" stroke="var(--bubi-blueprint)" stroke-width="1.2" stroke-dasharray="3.5 2.5" pointer-events="none"/>`;
      }
    }
    if (!scene) s += `<text x="${L-6}" y="${y0+sh/2+5}" font-size="13" font-weight="${act?'700':'500'}" fill="${act?'var(--bubi-blueprint-strong)':'var(--bubi-blueprint)'}" text-anchor="end" data-act="shelf" data-i="${i}">N${i+1}</text>`;
    let x = L;
    const over = shelfW(shelf) >S.cur.W;
    shelf.items.forEach(it => {
      if (it.gap) { x += it.gap * sc; return; }   // espace de calage d'une colonne
      const p = BY_REF[it.ref];
      const st = it.s || 1;
      const wOne = p.w * sc,
        hOne = Math.min(p.h * sc, (sh - 15) / st);
      const url = photos ? photoURL(it.ref) : null;
      for (let k = 0; k < it.f; k++) {
        const bad = over && x + wOne > L + W;
        s += `<g data-act="item" data-id="${it.id}" style="cursor:pointer">`;
        const picked = S.selMode && S.sel.includes(it.id);
        if (scene) s += `<ellipse cx="${x+wOne/2}" cy="${y1-1}" rx="${wOne*.46}" ry="1.6" fill="rgba(0,0,0,.28)"/>`;
        for (let j2 = 0; j2 < st; j2++) {
          const yy = y1 - (j2 + 1) * hOne;
          if (bad) {
            s += `<rect x="${x+.5}" y="${yy+.5}" width="${wOne-1}" height="${hOne-1}" rx="2.5" fill="var(--bubi-danger)"/>`;
            continue;
          }
          if (blueprintReveal) {
            s += `<rect x="${x+.5}" y="${yy+.5}" width="${wOne-1}" height="${hOne-1}" rx="2" fill="rgba(220,232,238,.5)" stroke="var(--bubi-blueprint)" stroke-width="1.2" stroke-dasharray="3 2"/>`;
            continue;
          }
          s += `<rect x="${x+.5}" y="${yy+.5}" width="${wOne-1}" height="${hOne-1}" rx="2" fill="${url ? 'var(--bubi-surface)' : familyColor(p)}" stroke="var(--bubi-border)" stroke-width=".6" class="${fresh===it.id?'pop':''}"/>`;
          if (url) {
            // le produit est calé sur le cadre : plus aucune marge blanche visible
            const bw = wOne - 2, bh = hOne - 2, bx = x + 1, by = yy + 1;
            const pl = photoPlacement(it.ref, bx, by, bw, bh);
            const cid = 'clip' + (clipSeq++);
            s += `<clipPath id="${cid}"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="1.5"/></clipPath>`;
            // fond neutre derrière une photo : le débordement d'un visuel légèrement
            // trop petit ne doit pas colorer la boîte. Blanc en clair, sombre en nuit.
            s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="1.5" fill="var(--bubi-surface)"/>`;
            s += `<image href="${url}" xlink:href="${url}" x="${pl.x}" y="${pl.y}" width="${pl.w}" height="${pl.h}" preserveAspectRatio="${pl.par}" clip-path="url(#${cid})"/>`;
          } else if (wOne > 16 && hOne > 10) {
            // pas de photo : le logo de la marque tient lieu de repère
            const lg = LOGOS[p.cat], lu = logoURL(p.cat), lw2 = Math.min(wOne - 6, 26), lh2 = lw2 * lg.h / lg.w;
            if (lh2 < hOne - 4) s += `<image href="${lu}" xlink:href="${lu}" x="${x + (wOne - lw2) / 2}" y="${yy + (hOne - lh2) / 2}" width="${lw2}" height="${lh2}" opacity=".9"/>`;
          }
        }
        // la référence n'est écrite sur la boîte qu'en l'absence de photo
        if (k === 0 && !url && hOne > 12) {
          const yt = y1 - st * hOne;
          s += `<text x="${x+2.5}" y="${yt+9}" font-size="7" font-weight="700" fill="#fff" opacity=".9" pointer-events="none">${p.ref}</text>`;
        }
        if (picked) s += `<rect x="${x+1}" y="${y1-st*hOne+1}" width="${wOne-2}" height="${st*hOne-2}" rx="3" fill="rgba(220,232,238,.5)" stroke="var(--bubi-blueprint-strong)" stroke-width="2"/>`;
        s += `</g>`;
        x += wOne;
      }
    });
    // bandeau du niveau : la liste des références placées, à l'aplomb de chaque produit
    if (shelf.items.length && !scene) {
      const bh2 = 11;
      s += `<rect x="${L}" y="${y0 + 1}" width="${W}" height="${bh2}" fill="${dark?'rgba(255,255,255,.07)':'rgba(0,0,0,.05)'}"/>`;
      let bx2 = L;
      shelf.items.forEach(it => {
        if (it.gap) { bx2 += it.gap * sc; return; }
        const pr = BY_REF[it.ref];
        const wTot = pr.w * it.f * sc;
        // on n'écrit que ce qui tient dans la largeur du produit
        let lab = pr.ref;
        if (wTot > 46 && it.f > 1) lab += ' ×' + it.f;
        if (wTot > 66 && (it.s || 1) > 1) lab += ' ↑' + it.s;
        if (wTot > 15) {
          s += `<text x="${bx2 + wTot / 2}" y="${y0 + 9}" font-size="7" font-weight="700" fill="${dark?'var(--bubi-graphite)':'var(--bubi-graphite)'}" text-anchor="middle" pointer-events="none">${lab}</text>`;
          s += `<line x1="${bx2 + 0.5}" y1="${y0 + 2}" x2="${bx2 + 0.5}" y2="${y0 + 11}" stroke="${dark?'rgba(255,255,255,.18)':'rgba(0,0,0,.12)'}"/>`;
        }
        bx2 += wTot;
      });
    }
    // séparateurs : fins traits verticaux entre deux blocs, et joues aux extrémités
    if (!scene && SEP.mode !== 'aucun') {
      const blocks = shelfBlocks(shelf);
      if (blocks.length) {
        const hSep = Math.min(sh * .5, 26);
        const draw = px => { s += `<rect x="${px - .8}" y="${y1 - hSep}" width="1.6" height="${hSep}" rx=".8" fill="var(--bubi-blueprint)" opacity=".75"/>`; };
        let px = L;
        if (SEP.ends) draw(px);
        shelf.items.forEach((it, k) => {
          const wIt = it.gap ? it.gap : BY_REF[it.ref].w * it.f;
          px += wIt * sc;
          const next = shelf.items[k + 1];
          const cut = SEP.mode === 'chaque'
            ? (!it.gap && next && !next.gap)
            : (!it.gap && next && !next.gap && next.ref !== it.ref);
          if (cut) draw(px);
        });
        if (SEP.ends) draw(L + shelfW(shelf) * sc);
      }
    }
    if (interactive && i === S.shelf && S.insertAt != null) {
      const mx = L + S.insertAt * sc;
      s += `<line x1="${mx}" y1="${y0+12}" x2="${mx}" y2="${y1-1}" stroke="var(--bubi-blueprint-strong)" stroke-width="2" stroke-dasharray="4 3"/>`;
      s += `<circle cx="${mx}" cy="${y0+12}" r="3.5" fill="var(--bubi-blueprint-strong)"/>`;
    }
    if (interactive) {
      const rest = S.cur.W - shelfW(shelf);
      if (rest > 0) s += `<text x="${L+W-4}" y="${y0+11}" font-size="8" fill="#aaa" text-anchor="end" pointer-events="none">${rest.toFixed(0)} cm</text>`;
    }
  });
  if (scene) return s + '</svg>';
  // cotes en style plan : ←── 133 cm ──→ et la hauteur sur le côté
  s += `<g fill="var(--bubi-blueprint)" stroke="var(--bubi-blueprint)" font-size="9" font-family="-apple-system,system-ui">
    <line x1="${L}" y1="${H+16}" x2="${L+W}" y2="${H+16}" stroke-width="1"/>
    <path d="M${L} ${H+16} l5 -3 v6 z M${L+W} ${H+16} l-5 -3 v6 z" stroke="none"/>

    <line x1="${L-42}" y1="4" x2="${L-42}" y2="${H+4}" stroke-width="1"/>
    <path d="M${L-42} 4 l-3 5 h6 z M${L-42} ${H+4} l-3 -5 h6 z" stroke="none"/>
    <rect x="${L-48}" y="${H/2-18}" width="12" height="36" fill="var(--bubi-surface)" stroke="none"/>

  </g>`;

  }
  return s + '</svg>';
}

function setS(id, n) {
  const f = findItem(id);
  if (!f) return;
  n = Math.max(1, Math.min(8, n));
  if (n === (f.it.s || 1)) return;
  f.it.s = n;
  snap();
  persist();
  update();
  editItem(id);
}

function setF(id, n) {
  const f = findItem(id);
  if (!f) return;
  n = Math.max(1, Math.min(30, Math.round(n) || 1));
  if (n === f.it.f) return;
  f.it.f = n;
  snap();
  persist();
  update();
  refreshCounts();
  editItem(id);
}

function mv(id, dir) {
  const f = findItem(id);
  if (!f) return;
  const arr = S.cur.shelves[f.si].items;
  if (dir === 'L' && f.k > 0)[arr[f.k - 1], arr[f.k]] = [arr[f.k], arr[f.k - 1]];
  else if (dir === 'R' && f.k < arr.length - 1)[arr[f.k + 1], arr[f.k]] = [arr[f.k], arr[f.k + 1]];
  else if (dir === 'U' && f.si > 0) {
    arr.splice(f.k, 1);
    S.cur.shelves[f.si - 1].items.push(f.it);
  } else if (dir === 'D' && f.si < S.cur.shelves.length - 1) {
    arr.splice(f.k, 1);
    S.cur.shelves[f.si + 1].items.push(f.it);
  } else return;
  snap();
  persist();
  update();
  editItem(id);
}

/* ================= IMPORT D'UNE PROFORMA =================
   On accepte un fichier CSV, TSV ou texte, ou un simple copier-coller. On y cherche
   les références du catalogue, avec la quantité qui les accompagne éventuellement.
   La quantité sert de poids : plus une référence est commandée, plus elle reçoit de
   facings dans l'implantation proposée.
*/
let PROFORMA = null;

function parseProforma(text) {
  const found = new Map();
  const known = new Set(PRODUCTS.map(p => p.ref));
  text.split(/[\r\n]+/).forEach(line => {
    const cells = line.split(/[;,\t|]/).map(c => c.trim());
    let ref = null;
    for (const c of cells) {
      const t = c.replace(/^réf\.?\s*/i, '').replace(/\s+/g, '').toUpperCase();
      if (known.has(t)) { ref = t; break; }
    }
    if (!ref) {
      const m = line.toUpperCase().match(/\b(G\d{3}|\d{2,4})\b/g);
      if (m) for (const c of m) if (known.has(c)) { ref = c; break; }
    }
    if (!ref) return;
    // quantité : le premier nombre entier plausible qui n'est pas la référence
    let qty = 0;
    for (const c of cells) {
      const v = parseInt(String(c).replace(/\s/g, ''), 10);
      if (Number.isInteger(v) && String(v) !== ref && v > 0 && v < 10000) { qty = v; break; }
    }
    found.set(ref, (found.get(ref) || 0) + (qty || 1));
  });
  return [...found.entries()].map(([ref, qty]) => ({ ref, qty }));
}

function proformaSheet() {
  sheet(`<h2>Implantation depuis une proforma</h2>
   <p>Charge ta proforma en CSV ou texte, ou colle simplement son contenu. L'app y repère les références du catalogue et les quantités, puis te propose une implantation.</p>
   <button class="btn p" data-act="prof-file">${ic('doc')} Choisir un fichier</button>
   <p style="margin:14px 0 6px"><b>ou colle le contenu ici</b></p>
   <textarea id="profText" rows="6" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--sep);font-size:13px;font-family:inherit;background:var(--card)" placeholder="8050 ; 24&#10;G640 ; 12&#10;130 ; 6"></textarea>
   <button class="btn" data-act="prof-paste">Analyser le texte collé</button>
   <button class="btn" data-act="close">Fermer</button>`);
}

function proformaLoaded(text) {
  const rows = parseProforma(text);
  if (!rows.length) {
    sheet(`<h2>Aucune référence reconnue</h2><p>Le fichier ne contient aucune référence du catalogue. Vérifie qu'une colonne porte bien les références, du type 8050, G640 ou 130.</p><button class="btn" data-act="prof-open">Réessayer</button><button class="btn" data-act="close">Fermer</button>`);
    return;
  }
  const univs = {};
  rows.forEach(r => { const u = BY_REF[r.ref].univ; univs[u] = (univs[u] || 0) + 1; });
  PROFORMA = rows;
  const lin = rows.reduce((a, r) => a + BY_REF[r.ref].w, 0);
  const cap = S.cur.W * S.cur.shelves.length;
  sheet(`<h2>${rows.length} références reconnues</h2>
   <div class="stats" style="padding:0 0 10px">
     ${Object.entries(univs).map(([u, n]) => `<div class="st">${UNIV[u]}<b>${n}</b></div>`).join('')}
     <div class="st">1 facing chacune<b>${Math.round(lin)} cm</b></div>
     <div class="st">Gondole<b>${cap} cm</b></div>
   </div>
   ${Object.keys(univs).length > 1 ? `<div class="warn" style="margin:0 0 10px">La proforma mélange chien et chat. Seules les références ${UNIV[S.cur.univ]} seront implantées.</div>` : ''}
   <p><b>Comment organiser le rayon ?</b></p>
   <button class="btn p" data-act="prof-run" data-v="descente">${ic('right')} Descentes par marque<br><span style="font-size:12px;opacity:.75">chaque marque occupe une colonne verticale, du haut en bas</span></button>
   <button class="btn" data-act="prof-run" data-v="etagere">${ic('grid')} Une gamme par étagère<br><span style="font-size:12px;opacity:.75">les niveaux se lisent par marque, gros formats en bas</span></button>
   <button class="btn" data-act="prof-run" data-v="bloc">${ic('box')} Blocs de marques<br><span style="font-size:12px;opacity:.75">chaque marque forme un bloc compact, formats regroupés</span></button>
   <button class="btn" data-act="close">Annuler</button>`);

/* Répartit les facings selon les quantités de la proforma, dans la limite du linéaire. */
function proformaFacings(rows) {
  const W = S.cur.W, N = S.cur.shelves.length, cap = W * N * 0.94;
  const items = rows.map(r => ({ ref: r.ref, qty: r.qty, p: BY_REF[r.ref], f: 1 }));
  let used = items.reduce((a, i) => a + i.p.w * i.p.df, 0);
  items.forEach(i => i.f = i.p.df);
  const totalQty = items.reduce((a, i) => a + i.qty, 0) || 1;
  // on ajoute des facings au prorata des quantités, tant qu'il reste du linéaire
  let guard = 0;
  while (used < cap && guard++ < 4000) {
    const cand = items
      .filter(i => used + i.p.w <= cap && i.f < 12)
      .sort((a, b) => (b.qty / totalQty) / (a.f) - (a.qty / totalQty) / (b.f))[0];
    if (!cand) break;
    cand.f += 1;
    used += cand.p.w;
  }
  return items;
}

/* Remplit une colonne de largeur colW, du bas vers le haut, en coupant les facings
   d'une référence sur plusieurs niveaux quand elle ne tient pas d'un bloc. */
function fillColumn(list, N, colW, pad) {
  const rows = Array.from({ length: N }, () => []);
  let si = N - 1, x = 0;
  list.forEach(it => {
    let left = it.f;
    while (left > 0) {
      if (si < 0) { si = 0; x = 0; }
      let room = Math.floor((colW - x) / it.p.w + 1e-6);
      // plus de place nulle part : on pose sur le niveau du haut, l'alerte de
      // dépassement préviendra plutôt que de perdre la référence
      if (room <= 0 && si === 0) room = left;
      if (room <= 0) { si--; x = 0; continue; }
      const take = Math.min(room, left);
      rows[si].push({ id: uid(), ref: it.ref, f: take, s: it.p.st });
      x += take * it.p.w;
      left -= take;
      if (left > 0) { si--; x = 0; }
    }
  });
  // calage : chaque niveau de la colonne est complété jusqu'à sa largeur allouée,
  // sans quoi les descentes se décalent d'une étagère à l'autre
  if (pad) rows.forEach(row => {
    const used = row.reduce((a, it) => a + (it.gap || BY_REF[it.ref].w * it.f), 0);
    if (colW - used > .4) row.push({ id: uid(), ref: null, gap: colW - used, f: 1, s: 1 });
  });
  return rows;
}

/* Dernier passage : si un niveau déborde, on retire des facings aux références qui en
   ont le plus, jamais en dessous d'un facing. Aucune référence n'est supprimée. */
function trimOverflow(shelves, W) {
  shelves.forEach(sh => {
    let guard = 0;
    const width = () => sh.items.reduce((a, it) => a + (it.gap || BY_REF[it.ref].w * it.f), 0);
    while (width() >W && guard++ < 500) {
      const c = sh.items.filter(it => !it.gap && it.f > 1)
        .sort((a, b) =>BY_REF[b.ref].w * b.f - BY_REF[a.ref].w * a.f)[0];
      if (!c) break;
      c.f--;
    }
  });
}

function runProforma(mode) {
  const rows = PROFORMA.filter(r =>BY_REF[r.ref].univ === S.cur.univ);
  if (!rows.length) { toast('Aucune référence de cet univers'); return; }
  const items = proformaFacings(rows);
  const N = S.cur.shelves.length, W = S.cur.W;
  const shelves = Array.from({ length: N }, () => ({ items: [] }));
  const lin = it => it.p.w * it.f;
  // les marques aux plus gros formats sont traitées en premier, donc placées en bas
  const brands = BRANDS.filter(b => items.some(i => i.p.cat === b))
    .sort((a, b) =>Math.max(...items.filter(i => i.p.cat === b).map(i => i.p.h)) -
                    Math.max(...items.filter(i => i.p.cat === a).map(i => i.p.h)));
  const byBrand = b => items.filter(i => i.p.cat === b)
    .sort((a, c) => parseInt(c.p.fmt) - parseInt(a.p.fmt) || a.ref.localeCompare(c.ref));

  if (mode === 'descente') {
    // Une colonne par marque, large au prorata de son linéaire. Dans la colonne, on
    // regroupe par goût : un même parfum décliné en 150 g, 400 g et 800 g se retrouve
    // l'un sous l'autre, ce qui donne des descentes lisibles et un choix évident pour
    // le client. Les gros formats restent en bas, les petits en haut.
    const tot = {};
    brands.forEach(b => tot[b] = byBrand(b).reduce((a, i) => a + lin(i), 0));
    const grand = Object.values(tot).reduce((a, b) => a + b, 0) || 1;
    const cols = brands.map(b => ({ b, w: Math.max(tot[b] / grand * W, 12) }));
    const sum = cols.reduce((a, c) => a + c.w, 0);
    cols.forEach(c => c.w = c.w / sum * W);

    cols.forEach(c => {
      const list = byBrand(c.b);
      // regroupement par goût, en ignorant le format et la déclinaison
      const key = it => (it.p.flav || it.p.name).toLowerCase()
        .replace(/\b(junior|senior|adulte|optimal|sterilised|beauty|health care|vitality care|mousse|terrine|soupe au?|gelée|complet)\b/g, '')
        .replace(/[^a-zéèêàîôûç/]/g, '').trim();
      const groups = {};
      list.forEach(it => { const k = key(it) || it.ref; (groups[k] = groups[k] || []).push(it); });
      // les familles de goûts les plus fournies passent en premier
      const ordered = Object.values(groups)
        .map(g => g.sort((a, b) => parseInt(b.p.fmt) - parseInt(a.p.fmt) || b.p.h - a.p.h))
        .sort((a, b) => b.reduce((s, i) => s + lin(i), 0) - a.reduce((s, i) => s + lin(i), 0));
      const part = fillColumn(ordered.flat(), N, c.w, true);
      part.forEach((row, si) => row.forEach(it => shelves[si].items.push(it)));
    });
  } else if (mode === 'etagere') {
    // une marque ne partage jamais un niveau avec une autre : changement de marque,
    // changement d'étagère. Les gros formats restent en bas.
    let si = N - 1, x = 0;
    brands.forEach((b, bi) => {
      if (bi > 0 && x > 0) { si = Math.max(0, si - 1); x = 0; }
      byBrand(b).forEach(it => {
        let left = it.f;
        while (left > 0) {
          if (si < 0) { si = 0; x = 0; }
          let room = Math.floor((W - x) / it.p.w + 1e-6);
          if (room <= 0 && si === 0) room = left;
          if (room <= 0) { si--; x = 0; continue; }
          const take = Math.min(room, left);
          shelves[si].items.push({ id: uid(), ref: it.ref, f: take, s: it.p.st });
          x += take * it.p.w;
          left -= take;
          if (left > 0) { si--; x = 0; }
        }
      });
    });
  } else {
    // blocs : marque après marque, format par format, en remplissant de bas en haut
    const list = brands.flatMap(byBrand);
    fillColumn(list, N, W).forEach((row, si) => shelves[si].items = row);
  }

  trimOverflow(shelves, W);
  S.cur.shelves = shelves;
  S.shelf = 0;
  closeSheet();
  // le plan prend vie : d'abord les emplacements en plan, puis les produits
  blueprintReveal = true;
  update();
  setTimeout(() => { blueprintReveal = false; commit('Implantation proposée'); }, 260);
  refreshCounts();
}

const LAYKEY = 'bubiplan_layouts';

function loadLayouts() {

}

function saveLayouts(l) { lsSet(LAYKEY, JSON.stringify(l)); }

function layoutSheet() {

function saveLayout() {
  const name = ($('layName').value || '').trim() ||
    `${S.cur.store} — ${S.cur.name}`;
  const list = loadLayouts();
  list.push({
    id: uid(),
    name,

/* ================= AJOUTER UNE GAMME ENTIÈRE ================= */
/* Combien de linéaire réclame une sélection, et de combien on dispose. */
function needFor(list) {
  return list.reduce((a, p) => a + p.w * p.df, 0);
}

function addAllSheet() {
  const brands = BRANDS.filter(b => PRODUCTS.some(p => p.univ === S.univ && p.cat === b));
  const count = b => PRODUCTS.filter(p => p.univ === S.univ && p.cat === b && (!S.fmt || p.fg === S.fmt)).length;
  sheet(`<h2>Ajouter une gamme entière</h2>
   <p>Toutes les références sont posées d'un coup, avec leur présentation d'origine, puis réparties en descentes propres.</p>
   ${brands.map(b => {
      const l = PRODUCTS.filter(p => p.univ === S.univ && p.cat === b && (!S.fmt || p.fg === S.fmt));
      return `<button class="btn" data-act="addall" data-v="${esc(b)}"><span style="width:10px;height:10px;border-radius:3px;background:${BRAND[b]};display:inline-block;margin-right:8px"></span>${esc(b)} — ${count(b)} réf., ${Math.round(needFor(l))} cm</button>`;
    }).join('')}
   ${(() => {
      const all = PRODUCTS.filter(p => p.univ === S.univ && (!S.fmt || p.fg === S.fmt));
      const need = Math.round(needFor(all)), cap = S.cur.W * S.cur.shelves.length;
      return `<button class="btn p" data-act="addall" data-v="*">Tout le catalogue — ${all.length} réf., ${need} cm</button>
        <p style="margin-top:10px">Ta gondole offre <b>${cap} cm</b> de linéaire.${need > cap ? ` Il en faudrait <b>${need} cm</b> : l'app posera ce qui rentre et te dira ce qui reste dehors.` : ''}</p>`;
    })()}
   ${S.fmt ? `<p style="margin-top:10px">Filtre actif : format ${S.fmt}. Retire-le pour prendre tous les formats.</p>` : ''}
   <button class="btn" data-act="close">Annuler</button>`);
}

function addAll(brand) {
  let list = PRODUCTS.filter(p => p.univ === S.univ && (brand === '*' || p.cat === brand) && (!S.fmt || p.fg === S.fmt));
  if (!list.length) { toast('Aucune référence'); return; }
  const cap = S.cur.W * S.cur.shelves.length * .97;
  let left = 0;
  if (needFor(list) > cap) {
    // on garde d'abord les gros formats, vitrine de la gamme, puis on complète
    const ordered = list.slice().sort((a, b) =>
      BRANDS.indexOf(a.cat) - BRANDS.indexOf(b.cat) ||
      parseInt(b.fmt) - parseInt(a.fmt) ||
      a.ref.localeCompare(b.ref));
    const keep = [];
    let used = 0;
    ordered.forEach(p => {
      const need = p.w * p.df;
      if (used + need <= cap) { keep.push(p); used += need; }
    });
    left = list.length - keep.length;
    list = keep;
  }
  PROFORMA = list.map(p => ({ ref: p.ref, qty: 1 }));
  closeSheet();
  runProforma('descente');
  toast(left
    ? `${list.length} références posées, ${left} n'entrent pas`
    : `${list.length} références posées`);
}

/* ================= AVANT / APRÈS =================
   Ce que font Store360 ou Planorama à grande échelle : confronter le rayon réel au
   rayon proposé. Ici, en version simple et utile sur le terrain : on fige l'existant
   au début de la visite, on retravaille, et on montre l'écart au client.
*/
function saveBefore() {
  S.cur.before = {
    shelves: JSON.parse(JSON.stringify(S.cur.shelves)),
    W: S.cur.W, H: S.cur.H,
    date: Date.now()
  };
  persist();
  closeSheet();
  toast("État actuel enregistré");
}

function planStats(shelves) {
  const refs = new Set(), byBrand = {};
  let lin = 0, fac = 0;
  shelves.forEach(sh => sh.items.forEach(it => {
    if (it.gap || !BY_REF[it.ref]) return;
    const p = BY_REF[it.ref];
    refs.add(it.ref);
    fac += it.f;
    lin += p.w * it.f;
    byBrand[p.cat] = (byBrand[p.cat] || 0) + p.w * it.f;
  }));
  return { refs: refs.size, fac, lin, byBrand, set: refs };
}

function compareSheet() {
  if (!S.cur.before) {
    sheet(`<h2>Avant / après</h2>
     <p>Fige d'abord le rayon tel qu'il est aujourd'hui chez ton client. Tu pourras ensuite lui montrer précisément ce que ta proposition change.</p>

     <button class="btn" data-act="close">Fermer</button>`);
    return;

  const d = (x, y, u) => {

   <div class="cmp">
     <div><span>Existant</span>${miniPlan(S.cur.before.shelves, S.cur.before.W, S.cur.before.H)}</div>

   </div>

     <div class="f"><label>Boîtes de face</label><span>${a.fac} → ${b.fac}</span><span class="unit">${d(a.fac,b.fac,'')}</span></div>

   <button class="btn" data-act="save-before">Remplacer l'état actuel par le rayon en cours</button>
   <button class="btn" data-act="close">Fermer</button>`);
}

/* Petit plan de comparaison, sans détail : on veut lire l'équilibre d'un coup d'œil. */
function miniPlan(shelves, W, H) {
  const sh = H / shelves.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><rect width="${W}" height="${H}" fill="var(--card2)" rx="2"/>`;
  shelves.forEach((shelf, i) => {
    const y = (i + 1) * sh;
    s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="rgba(128,128,128,.45)" stroke-width="1.2"/>`;
    let x = 0;
    shelf.items.forEach(it => {
      if (it.gap) { x += it.gap; return; }
      const p = BY_REF[it.ref];
      if (!p) return;
      const w = p.w * it.f, h = Math.min(p.h * (it.s || 1), sh * .92);
      s += `<rect x="${x}" y="${y-h}" width="${w-.3}" height="${h}" fill="${BRAND[p.cat]}" rx=".6"/>`;
      x += w;
    });
  });
  return s + '</svg>';
}

/* ================= SÉPARATEURS DE RAYON =================
   Les inter-produits qui maintiennent les boîtes droites et empêchent les gammes de se
   mélanger. On en compte un entre deux blocs voisins, et l'usage courant ajoute une
   joue à chaque extrémité du niveau. Le total part avec la commande : on n'installe
   pas un rayon propre sans eux.
*/
const SEPKEY = 'bubiplan_sep';
let SEP = { mode: 'entre', ends: true };
try { Object.assign(SEP, JSON.parse(lsGet(SEPKEY) || '{}')); } catch (e) {}

function saveSep() {
  lsSet(SEPKEY, JSON.stringify(SEP));
  if (S.cur) update();
}

/* Blocs de produits d'un niveau : deux emplacements voisins de même référence
   n'en forment qu'un, on ne sépare pas une référence d'elle-même. */
function shelfBlocks(shelf) {
  const blocks = [];
  shelf.items.forEach(it => {
    if (it.gap || !BY_REF[it.ref]) return;
    const last = blocks[blocks.length - 1];
    if (last && last.ref === it.ref) last.items.push(it);
    else blocks.push({ ref: it.ref, items: [it] });
  });
  return blocks;
}

function separatorCount() {
  if (SEP.mode === 'aucun') return 0;
  let n = 0;
  S.cur.shelves.forEach(sh => {
    const b = shelfBlocks(sh).length;
    if (!b) return;
    n += SEP.mode === 'chaque' ? b : b - 1;
    if (SEP.ends) n += 2;
  });
  return n;
}

/* ================= COMMANDE À PASSER =================
   Le planogramme n'est pas une fin : ce qu'il faut, c'est la commande qui remplit le
   rayon. On calcule combien d'unités chaque référence demande pour tenir sa place,
   faces × superposées × ce qui rentre en profondeur, puis on arrondit au colis. Le
   client repart avec un bon de commande, pas seulement avec un joli plan.
*/
const CARTONKEY = 'bubiplan_cartons';
let CARTON = { defaut: 6 };
try { Object.assign(CARTON, JSON.parse(lsGet(CARTONKEY) || '{}')); } catch (e) {}

function cartonFor(p) {
  return Math.max(1, +CARTON[p.fmt] || +CARTON.defaut || 1);
}

function orderLines() {
  const byRef = {};
  S.cur.shelves.forEach(sh => sh.items.forEach(it => {
    if (it.gap || !BY_REF[it.ref]) return;
    const p = BY_REF[it.ref];
    const units = it.f * (it.s || 1) * depthCapacity(p);
    byRef[it.ref] = (byRef[it.ref] || 0) + units;
  }));
  return Object.entries(byRef).map(([ref, units]) => {
    const p = BY_REF[ref];
    const carton = cartonFor(p);
    const colis = Math.ceil(units / carton);
    const d = perf(ref);
    return { p, units, carton, colis, qty: colis * carton, price: +d.price || 0 };
  }).sort((a, b) =>
    BRANDS.indexOf(a.p.cat) - BRANDS.indexOf(b.p.cat) ||
    parseInt(b.p.fmt) - parseInt(a.p.fmt) ||
    a.p.ref.localeCompare(b.p.ref));
}

function orderSheet() {
  const lines = orderLines();
  if (!lines.length) { toast('Pose d\'abord des produits'); return; }
  const totUnits = lines.reduce((a, l) => a + l.qty, 0);
  const totColis = lines.reduce((a, l) => a + l.colis, 0);
  const totVal = lines.reduce((a, l) => a + l.qty * l.price, 0);
  const seps = separatorCount();
  const fmts = [...new Set(lines.map(l => l.p.fmt))];
  sheet(`<h2>Commande à passer</h2>
   <p>Ce qu'il faut livrer pour remplir cette gondole une fois, profondeur comprise.</p>
   <div class="stats" style="padding:0 0 12px">
     <div class="st">Références<b>${lines.length}</b></div>
     <div class="st">Unités<b>${totUnits}</b></div>
     <div class="st">Colis<b>${totColis}</b></div>${seps?`<div class="st">Séparateurs<b>${seps}</b></div>`:''}
     ${totVal ? `<div class="st">Valeur<b>${totVal.toFixed(0)} €</b></div>` : ''}
   </div>
   <p style="margin-bottom:6px"><b>Nombre d'unités par colis</b></p>
   <div class="grp">
     <div class="f"><label>Par défaut</label><input class="cart" data-f="defaut" type="number" inputmode="numeric" value="${CARTON.defaut}"></div>
     ${fmts.map(f => `<div class="f"><label>${f}</label><input class="cart" data-f="${f}" type="number" inputmode="numeric" value="${CARTON[f] || ''}" placeholder="${CARTON.defaut}"></div>`).join('')}
   </div>
   <button class="btn" data-act="carton-save">Recalculer</button>
   <div class="ordl">${lines.map(l => `<div class="ol">
     <span class="r">${l.p.ref}</span>
     <span class="n">${esc(l.p.name)}</span>
     <span class="q">${l.colis} × ${l.carton}<small>${l.qty} u.</small></span>
   </div>`).join('')}</div>
   <p style="margin:16px 0 6px"><b>Séparateurs de rayon</b></p>
   <div class="qs">
     <button data-act="sep-mode" data-v="entre" class="${SEP.mode==='entre'?'on':''}">Entre les produits</button>
     <button data-act="sep-mode" data-v="chaque" class="${SEP.mode==='chaque'?'on':''}">Un par produit</button>
     <button data-act="sep-mode" data-v="aucun" class="${SEP.mode==='aucun'?'on':''}">Aucun</button>
   </div>
   ${SEP.mode !== 'aucun' ? `<div class="qs"><button data-act="sep-ends" data-v="1" class="${SEP.ends?'on':''}">Avec joues d'extrémité</button><button data-act="sep-ends" data-v="0" class="${SEP.ends?'':'on'}">Sans joues</button></div>` : ''}
   ${seps ? `<div class="ol"><span class="r">SEP</span><span class="n">Séparateur de rayon</span><span class="q">${seps}<small>pièces</small></span></div>` : ''}
   <button class="btn p" data-act="order-export">${ic('doc')} Bon de commande à imprimer</button>
   <button class="btn" data-act="order-csv">${ic('doc')} Bon de commande en tableur</button>
   <button class="btn" data-act="close">Fermer</button>`);
}

function saveCartons() {
  document.querySelectorAll('.cart').forEach(i => {
    const v = parseInt(i.value, 10);
    if (v > 0) CARTON[i.dataset.f] = v;
    else if (i.dataset.f !== 'defaut') delete CARTON[i.dataset.f];
  });

/* ================= ANALYSE COMMERCIALE =================
   Trois indicateurs qui servent d'argumentaire partout dans le monde :

   - la part de linéaire (share of shelf) : ce que la marque occupe dans la catégorie ;
   - l'indice espace/ventes (space to sales, ou fair share) : la part des ventes divisée
     par la part de linéaire. Au-dessus de 1, la référence rapporte plus que la place
     qu'elle prend, elle mérite d'être élargie. En dessous, elle est sur-linéarisée ;
   - la qualité de placement : les niveaux ne se valent pas. Le niveau des yeux vend
     nettement mieux que le niveau du sol, et une référence qui tourne mérite d'y être.

   Sans chiffres de ventes saisis, seuls la part de linéaire et le placement s'affichent.
*/
const CATKEY = 'bubiplan_cat_linear';

function catLinear() {
  const v = +lsGet(CATKEY + '_' + S.cur.id);
  return v > 0 ? v : 0;
}

/* Poids d'attention d'un niveau : les yeux d'abord, puis la main, le haut, le sol. */
function levelWeights(n) {
  if (n === 1) return [1];
  const eye = n <= 3 ? 0 : 1;                    // rangée au niveau du regard
  return Array.from({ length: n }, (_, i) => {
    if (i === eye) return 1;                     // niveau des yeux
    if (i === eye + 1) return .92;               // niveau des mains
    if (i < eye) return .78;                     // au-dessus du regard
    return i === n - 1 ? .58 : .72;              // bas, et sol
  });
}

function analysisData() {
  const N = S.cur.shelves.length;
  const wts = levelWeights(N);
  const lines = [];
  S.cur.shelves.forEach((sh, i) => sh.items.forEach(it => {
    if (it.gap || !BY_REF[it.ref]) return;
    const p = BY_REF[it.ref];
    const d = perf(it.ref);
    const lin = p.w * it.f;
    const ca = (+d.unitsWeek || 0) * (+d.price || 0);
    const prev = lines.find(l => l.ref === it.ref);
    if (prev) { prev.lin += lin; prev.lvl = Math.min(prev.lvl, i); }
    else lines.push({ ref: it.ref, p, lin, ca, lvl: i, w: wts[i] });
  }));
  const totLin = lines.reduce((a, l) => a + l.lin, 0) || 1;
  const totCa = lines.reduce((a, l) => a + l.ca, 0);
  lines.forEach(l => {
    l.partLin = l.lin / totLin;
    l.partCa = totCa ? l.ca / totCa : null;
    l.index = l.partCa == null ? null : (l.partLin ? l.partCa / l.partLin : null);
    l.w = wts[l.lvl];
  });
  const byBrand = {};
  lines.forEach(l => {
    const b = byBrand[l.p.cat] = byBrand[l.p.cat] || { lin: 0, ca: 0, n: 0 };
    b.lin += l.lin; b.ca += l.ca; b.n++;
  });
  // qualité de placement : linéaire pondéré par l'attention que reçoit chaque niveau
  const quality = lines.reduce((a, l) => a + l.lin * l.w, 0) / totLin;
  return { lines, totLin, totCa, byBrand, quality, wts, N };
}

function commercialAnalysis() {
  const a = analysisData();
  if (!a.lines.length) { toast("Pose d'abord des produits"); return; }
  const cat = catLinear();
  const pct = x => (x * 100).toFixed(0) + ' %';
  const sorted = a.lines.slice().filter(l => l.index != null).sort((x, y) => y.index - x.index);
  const over = sorted.filter(l => l.index >= 1.25).slice(0, 5);
  const under = sorted.filter(l => l.index <= .75).reverse().slice(0, 5);
  const eye = a.lines.filter(l => l.w >= .92);
  const eyeShare = a.lines.length ? eye.length / a.lines.length : 0;
  const bestSellers = a.lines.filter(l => l.ca > 0).sort((x, y) => y.ca - x.ca).slice(0, 5);
  const misplaced = bestSellers.filter(l => l.w < .9);

  sheet(`<h2>Analyse commerciale</h2>

   <p style="margin-bottom:6px"><b>Part de linéaire</b></p>
   <div class="grp">
     <div class="f"><label>Catégorie entière</label><input id="catLin" type="number" inputmode="numeric" value="${cat || ''}" placeholder="${Math.round(S.cur.W * S.cur.shelves.length)}"><span class="unit">cm</span></div>
   </div>
   ${cat
     ? (cat < a.totLin
        ? `<p>Le chiffre saisi (${cat} cm) est inférieur au linéaire Bubimex déjà posé (${Math.round(a.totLin)} cm). Additionne tous les niveaux de toute la catégorie, marques concurrentes comprises.</p>`
        : `<p>Bubimex occupe <b>${pct(a.totLin / cat)}</b> du linéaire de la catégorie, soit ${Math.round(a.totLin)} cm sur ${cat}.</p>`)
     : `<p>Additionne la largeur de tous les niveaux de la catégorie, concurrence comprise, pour connaître la part de linéaire Bubimex.</p>`}
   <button class="btn" data-act="cat-save">Enregistrer</button>

   <p style="margin:18px 0 6px"><b>Répartition par gamme</b></p>
   ${Object.entries(a.byBrand).sort((x, y) => y[1].lin - x[1].lin).map(([b, v]) => `
     <div class="bar"><span class="bl">${esc(b)}</span>
       <span class="bt"><i style="width:${(v.lin / a.totLin * 100).toFixed(1)}%;background:${BRAND[b]}"></i></span>
       <span class="bv">${pct(v.lin / a.totLin)}</span></div>`).join('')}

   <p style="margin:18px 0 6px"><b>Qualité de placement</b></p>
   <div class="stats" style="padding:0 0 8px">
     <div class="st">Note<b>${Math.round(a.quality * 100)} / 100</b></div>
     <div class="st">Au niveau des yeux<b>${eye.length} réf.</b></div>
     <div class="st">Part du regard<b>${pct(eyeShare)}</b></div>
   </div>
   <p style="font-size:13px">Le niveau des yeux et celui des mains vendent le mieux ; le niveau du sol perd de l'ordre de quatre dixièmes de l'attention. La note pondère ton linéaire par l'attention que reçoit chaque niveau.</p>
   ${misplaced.length ? `<p><b>À remonter au niveau des yeux</b><br><span style="font-size:13px;color:var(--mut)">${misplaced.map(l => l.ref + ' — ' + esc(l.p.name.split(',')[1] || l.p.name)).join('<br>')}</span></p>` : ''}

   ${a.totCa ? `
     <p style="margin:18px 0 6px"><b>Indice espace / ventes</b></p>
     <p style="font-size:13px">Part des ventes divisée par part de linéaire. Au-dessus de 1, la référence rapporte plus que la place qu'elle occupe.</p>
     ${over.length ? `<p><b>À élargir</b><br>${over.map(l => `<span style="font-size:13px">${l.ref} — indice ${l.index.toFixed(2)}</span>`).join('<br>')}</p>` : ''}
     ${under.length ? `<p><b>Trop de place</b><br>${under.map(l => `<span style="font-size:13px">${l.ref} — indice ${l.index.toFixed(2)}</span>`).join('<br>')}</p>` : ''}
     <button class="btn p" data-act="rebalance">Rééquilibrer selon les ventes</button>`
    : `<p style="margin-top:18px;font-size:13px">Renseigne les ventes hebdomadaires et les prix dans Ventes &amp; contraintes pour obtenir l'indice espace / ventes, l'argument le plus solide en rendez-vous.</p>`}

   <button class="btn" data-act="close">Fermer</button>`);
}

/* Déplace du linéaire des références sur-dotées vers celles qui sous-performent. */
function rebalance() {
  const a = analysisData();
  const usable = a.lines.filter(l => l.index != null);
  if (!usable.length) { toast('Renseigne les ventes'); return; }
  let moved = 0;
  usable.sort((x, y) => y.index - x.index);
  const winners = usable.filter(l => l.index >= 1.2);
  const losers = usable.filter(l => l.index <= .8).reverse();
  const W = S.cur.W;
  losers.forEach(l => {
    if (!winners.length || moved >= 12) return;
    for (const sh of S.cur.shelves) {
      const src = sh.items.find(it => it.ref === l.ref && it.f > 1);
      if (!src) continue;
      const srcW = BY_REF[src.ref].w;
      // on cherche une gagnante qui tient dans la place ainsi libérée
      // on libère d'abord la place, puis on cherche qui peut en profiter
      src.f--;
      const cand = winners
        .map(w => {
          for (const sh2 of S.cur.shelves) {
            const t = sh2.items.find(it => it.ref === w.ref);
            if (!t) continue;
            if (BY_REF[t.ref].w <= W - shelfW(sh2)) return t;
          }
          return null;
        })
        .find(Boolean);
      if (!cand) { src.f++; continue; }   // personne ne peut grandir : on remet
      cand.f++;
      moved++;
      break;
    }
  });
  closeSheet();
  if (moved) commit(`${moved} face${moved>1?'s':''} déplacée${moved>1?'s':''} vers les meilleures ventes`);
  else toast('Rien à rééquilibrer');
}

/* ================= DESCENTES TYPES =================
   Une descente type est un module d'implantation prêt à poser : une gamme, un nombre
   de tablettes, une largeur. On la construit une fois, on la retrouve depuis l'accueil,
   on la simule dans l'espace disponible chez le client, puis on l'installe. Les
   facings s'ajustent à la largeur réelle et les niveaux excédentaires se replient.
*/
function layouts() {
  return loadLayouts().sort((a, b) => b.date - a.date);
}

/* Gamme dominante d'une descente, pour la reconnaître d'un coup d'œil. */
function layoutBrand(l) {
  const w = {};
  l.shelves.forEach(sh => sh.items.forEach(it => {
    const p = BY_REF[it.ref];
    if (p) w[p.cat] = (w[p.cat] || 0) + p.w * it.f;
  }));
  const e = Object.entries(w).sort((a, b) => b[1] - a[1])[0];
  return e ? e[0] : '—';
}

function layoutRefs(l) {
  return new Set(l.shelves.flatMap(sh => sh.items.filter(i => !i.gap).map(i => i.ref))).size;
}

/* Adapte une descente à une gondole donnée : on garde l'ordre et les proportions,
   on réduit les facings si c'est plus étroit, on répartit si le nombre de tablettes
   diffère. Rien n'est perdu tant qu'il reste de la place. */
function fitLayout(l, W, N) {
  const src = l.shelves.map(sh => sh.items.filter(i => !i.gap && BY_REF[i.ref]).map(i => ({ ...i, id: uid() })));
  const out = Array.from({ length: N }, () => ({ items: [] }));
  const flat = [];
  src.forEach((row, i) => row.forEach(it => flat.push({ it, from: i })));
  if (!flat.length) return { shelves: out, gardees: 0, perdues: 0 };

  // on conserve la répartition d'origine, ramenée au nombre de tablettes demandé
  const ratio = N / Math.max(1, l.shelves.length);
  let perdues = 0;
  flat.forEach(({ it, from }) => {
    let cible = Math.min(N - 1, Math.round(from * ratio));
    const p = BY_REF[it.ref];
    let place = false;
    for (let k = 0; k < N && !place; k++) {
      const si = Math.min(N - 1, Math.max(0, cible + (k % 2 ? k : -k)));
      const reste = W - shelfW(out[si]);
      if (reste >= p.w) {
        it.f = Math.max(1, Math.min(it.f, Math.floor(reste / p.w)));
        out[si].items.push(it);
        place = true;
      }
    }
    if (!place) perdues++;
  });
  return { shelves: out, gardees: flat.length - perdues, perdues };
}

/* Écran de simulation : on entre la place dont on dispose, on voit le résultat. */
function simulateLayout(id) {
  const l = loadLayouts().find(x => x.id === id);
  if (!l) return;
  const W = S.simW || l.W;
  const N = S.simN || l.shelves.length;
  const r = fitLayout(l, W, N);
  const preview = { W, H: l.H, shelves: r.shelves, univ: l.univ };
  const lin = r.shelves.reduce((a, sh) => a + shelfW(sh), 0);
  sheet(`<h2>${esc(l.name)}</h2>
   <p>${esc(layoutBrand(l))} · ${layoutRefs(l)} références · conçue pour ${l.W} cm sur ${l.shelves.length} tablettes.</p>
   <p class="lbl2">Place disponible chez le client</p>
   <div class="grp">
     <div class="f"><label>Largeur</label><input id="simW" type="number" inputmode="numeric" value="${W}"><span class="unit">cm</span></div>
     <div class="f"><label>Tablettes</label><input id="simN" type="number" inputmode="numeric" value="${N}"></div>
   </div>
   <button class="btn" data-act="sim-run" data-id="${id}">Simuler</button>
   <div class="simPrev">${miniPlan(r.shelves, W, l.H)}</div>
   <div class="stats" style="padding:8px 0 4px">
     <div class="st"><b>${r.gardees}</b>emplacements</div>
     <div class="st"><b>${Math.round(lin)} cm</b>occupés</div>
     <div class="st"><b>${Math.round(lin / (W * N) * 100)} %</b>remplissage</div>
     ${r.perdues ? `<div class="st"><b>${r.perdues}</b>hors place</div>` : ''}
   </div>
   ${r.perdues ? `<p>${r.perdues} emplacement${r.perdues>1?'s ne rentrent':' ne rentre'} pas dans cette gondole. Élargis, ajoute une tablette, ou installe quand même : le reste sera posé.</p>` : ''}
   <button class="btn p" data-act="sim-new" data-id="${id}">Créer un plan avec cette descente</button>
   ${S.cur ? `<button class="btn" data-act="sim-insert" data-id="${id}">Installer dans le plan ouvert</button>` : ''}
   <button class="btn d" data-act="lay-del" data-id="${id}">Supprimer cette descente</button>
   <button class="btn" data-act="close">Fermer</button>`);
}

/* Ajoute la descente au plan ouvert, dans la place restante. */
function insertLayout(id) {
  const l = loadLayouts().find(x => x.id === id);
  if (!l || !S.cur) return;
  const r = fitLayout(l, S.cur.W, S.cur.shelves.length);
  let n = 0;
  r.shelves.forEach((row, i) => row.items.forEach(it => {
    const p = BY_REF[it.ref];
    if (S.cur.W - shelfW(S.cur.shelves[i]) >= p.w) { S.cur.shelves[i].items.push(it); n++; }
  }));
  closeSheet();
  commit(`${n} emplacements ajoutés depuis « ${l.name} »`);
  refreshCounts();
}

/* Avant un export, les photos encore distantes doivent être converties en données
   incorporées : une image exportée ne peut pas aller chercher un fichier sur le web.
   On les récupère et on les détoure au passage. */
async function inlinePhotosForExport() {
  const refs = [...new Set(S.cur.shelves.flatMap(sh => sh.items.filter(i => !i.gap).map(i => i.ref)))]
    .filter(r => !UPHOTO[r] && PHOTO[r] && PHOTO[r] !== 'none');
  if (!refs.length) return 0;
  toast('Préparation des visuels…');
  const r = await fetchAndDetour(refs);
  if (!r.ok) toast("Visuels non incorporables — importe-les pour les avoir dans l'export");
  return r.ok;
}

function fileName(ext) {
  return `BubiPlan_${S.cur.store}_${S.cur.name}`.replace(/[^\w\-]+/g, '_') + '.' + ext;
}
async function shareOrDownload(blob, name, preview) {
  const file = new File([blob], name, {
    type: blob.type
  });
  if (navigator.canShare && navigator.canShare({
      files: [file]
    })) {
    try {
      await navigator.share({
        files: [file],
        title: name
      });
      closeSheet();
      return;
    } catch (e) {
      if (e.name === 'AbortError') {
        closeSheet();
        return;
      }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  a.remove();
  sheet(`<h2 style="font-size:16px">${esc(name)}</h2><p>Si rien ne se télécharge : appui long sur l'aperçu → Enregistrer / Partager.</p><div class="exp">${preview(url)}</div><button class="btn" data-act="close">Fermer</button>`);
}

function exportPNG(withPhotos = true) {
  if (withPhotos) {
    inlinePhotosForExport().then(() => exportPNGNow(true));
    return;
  }
  exportPNGNow(false);
}

function exportPNGNow(withPhotos) {
  const svg = inlinePhotoURLs(resolveTokens(gondolaSVG(false, withPhotos)));
  const vb = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  const w = +vb[1],
    h = +vb[2],
    k = 2;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = w * k;
    c.height = h * k + 30;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, w * k, h * k);
    ctx.fillStyle = '#444';
    ctx.font = `${11*k}px -apple-system,system-ui`;
    ctx.fillText(`${S.cur.store} – ${S.cur.name} · ${UNIV[S.cur.univ]} · ${S.cur.W}×${S.cur.H} cm · ${new Date().toLocaleDateString('fr-FR')}`, 8, h * k + 20);
    try {
      c.toBlob(b => {
        if (b) shareOrDownload(b, fileName('png'), u => `<img src="${u}">`);
        else throw 0;
      }, 'image/png');
    } catch (e) {
      if (withPhotos) {
        toast('Export sans photos (restriction navigateur)');
        exportPNG(false);
      } else toast('Export PNG impossible');
    }
  };
  img.onerror = () => {
    if (withPhotos) exportPNG(false);
    else toast('Export PNG impossible');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function exportCSV() {
  const rows = [
    ['Niveau', 'Position', 'Référence', 'Produit', 'Gamme', 'Format', 'Largeur cm', 'Hauteur cm', 'Facings', 'Empilement', 'Linéaire cm']
  ];
  S.cur.shelves.forEach((sh, i) => sh.items.forEach((it, k) => {
    if (it.gap) return;
    const p = BY_REF[it.ref];
    rows.push([i + 1, k + 1, p.ref, p.name, p.cat, p.fmt, p.w, p.h, it.f, it.s || 1, (p.w * it.f).toFixed(1)]);
  }));
  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  shareOrDownload(new Blob([csv], {
    type: 'text/csv'
  }), fileName('csv'), () => `<pre>${esc(rows.map(r=>r.join(' ; ')).join('\n'))}</pre>`);
}

/* ================= MODE PRÉSENTATION =================
   Plein écran pour montrer le rayon au client. On pince pour zoomer, on fait glisser
   pour se déplacer, on tape deux fois pour revenir au cadrage d'origine.
*/
function presentation() {
  const d = document.createElement('div');
  d.className = 'pres';
  d.id = 'pres';
  d.innerHTML = `<div class="presWrap" id="presWrap">${gondolaSVG(false, true)}</div>
    <div class="presBar">
      <button class="nb" data-act="pres-zoom" data-v="-1">−</button>
      <span id="presPct">100 %</span>
      <button class="nb" data-act="pres-zoom" data-v="1">+</button>
      <button class="nb" data-act="pres-reset">Ajuster</button>
    </div>
    <button class="presClose" data-act="close-pres" aria-label="Fermer">${ic('plus', 22)}</button>`;
  document.body.appendChild(d);
  bindPresentationGestures();
}

const pres = { z: 1, x: 0, y: 0, sx: 0, sy: 0, dist: 0, panning: false };

function presApply() {
  const wrap = $('presWrap');
  if (!wrap) return;
  wrap.style.transform = `translate(${pres.x}px, ${pres.y}px) scale(${pres.z})`;
  const pct = $('presPct');
  if (pct) pct.textContent = Math.round(pres.z * 100) + ' %';
}

function presZoom(factor, cx, cy) {
  const before = pres.z;
  pres.z = Math.max(0.5, Math.min(6, pres.z * factor));
  // on zoome autour du point visé, pas autour du coin
  if (cx !== undefined) {
    const r = pres.z / before;
    const w = window.innerWidth / 2, h = window.innerHeight / 2;
    pres.x = cx - w - (cx - w - pres.x) * r;
    pres.y = cy - h - (cy - h - pres.y) * r;
  }
  presApply();
}

function presReset() {
  pres.z = 1;
  pres.x = 0;
  pres.y = 0;
  presApply();
}

function bindPresentationGestures() {
  const el = $('pres');
  if (!el) return;
  presReset();
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const mid = t => [(t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2];

  el.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pres.dist = dist(e.touches);
    } else if (e.touches.length === 1) {
      // un doigt posé sur une commande ne déplace pas le plan
      if (e.target.closest('[data-act]')) return;
      pres.panning = true;
      pres.sx = e.touches[0].clientX - pres.x;
      pres.sy = e.touches[0].clientY - pres.y;
    }
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pres.dist) {
      const d2 = dist(e.touches);
      const [mx, my] = mid(e.touches);
      presZoom(d2 / pres.dist, mx, my);
      pres.dist = d2;
      e.preventDefault();
    } else if (e.touches.length === 1 && pres.panning) {
      pres.x = e.touches[0].clientX - pres.sx;
      pres.y = e.touches[0].clientY - pres.sy;
      presApply();
      e.preventDefault();
    }
  }, { passive: false });

  el.addEventListener('touchend', e => {
    if (!e.touches.length) { pres.panning = false; pres.dist = 0; }
  });

  // double tape pour ajuster, molette et trackpad sur ordinateur
  let lastTap = 0;
  el.addEventListener('click', e => {
    if (e.target.closest('[data-act]')) return;
    const now = Date.now();
    if (now - lastTap < 320) { pres.z > 1.05 ? presReset() : presZoom(2, e.clientX, e.clientY); }
    lastTap = now;
  });
  el.addEventListener('wheel', e => {
    presZoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
    e.preventDefault();
  }, { passive: false });
}
