<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="theme-color" content="#111516" media="(prefers-color-scheme: dark)">

<title>BubiPlan</title>

<style>
/* ============================================================
   DESIGN SYSTEM BUBIPLAN — « Blueprint → Shelf »
   Toutes les couleurs, rayons et ombres viennent d'ici. Les anciens
   noms de variables sont conservés en alias pour ne rien casser.
   ============================================================ */
:root {
  /* neutres */
  --bubi-bg: #F7F6F2;
  --bubi-surface: #FFFFFF;
  --bubi-surface-2: #F4F5F3;
  --bubi-graphite: #283238;
  --bubi-text-secondary: #56636A;
  --bubi-border: #E6E8E7;

  /* blueprint : ce qui est en conception */
  --bubi-blueprint-soft: #DCE8EE;
  --bubi-blueprint: #7895A4;
  --bubi-blueprint-strong: #527789;

  /* merchandising : ce qui est implanté */
  --bubi-sage: #758A6B;
  --bubi-terracotta: #C96F4F;
  --bubi-ochre: #DDAA4D;
  --bubi-cream: #E8D8BD;
  --bubi-shelf: #D8B991;

  /* signaux */
  --bubi-warning: #B8862B;
  --bubi-warning-bg: #FBF3DF;
  --bubi-danger: #B5473A;

  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --shadow-subtle: 0 2px 8px rgba(40, 50, 56, 0.06);

  --sat: env(safe-area-inset-top);
  --sab: env(safe-area-inset-bottom);

  /* alias historiques → nouveaux tokens */
  --bg: var(--bubi-bg);
  --card: var(--bubi-surface);
  --card2: var(--bubi-surface-2);
  --sep: var(--bubi-border);
  --txt: var(--bubi-graphite);
  --txt2: var(--bubi-graphite);
  --mut: var(--bubi-text-secondary);
  --tint: var(--bubi-sage);
  --tint2: #66795D;
  --red: var(--bubi-danger);
  --orange: var(--bubi-warning);
  --fill: var(--bubi-surface-2);
  --fill2: #E9EBE8;
  --nav: var(--bubi-surface);
  --sheet: var(--bubi-surface);
  --gond: var(--bubi-surface);
  --shelfline: var(--bubi-shelf);
}

/* Mode sombre : conçu, pas inversé. La gondole et les produits gardent leur identité. */
@media (prefers-color-scheme: dark) {
  :root {
    --bubi-bg: #111516;
    --bubi-surface: #1A2022;
    --bubi-surface-2: #222A2D;
    --bubi-graphite: #F4F5F3;
    --bubi-text-secondary: #AEB8BC;
    --bubi-border: #2C3437;
    --bubi-blueprint-soft: #1F2C33;
    --bubi-blueprint: #8DAAB8;
    --bubi-blueprint-strong: #A9C2CE;
    --bubi-sage: #879B7D;
    --bubi-terracotta: #D77D5D;
    --bubi-ochre: #E5B75F;
    --bubi-warning: #E5B75F;
    --bubi-warning-bg: #2B2616;
    --bubi-danger: #E07A6C;
    --tint2: #9BAE91;
    --fill2: #2C3538;
    --shadow-subtle: 0 2px 8px rgba(0, 0, 0, 0.35);
  }
}





* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent
}

html,
body {
  height: 100%;
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%
}

input {
  -webkit-user-select: text;
  user-select: text;
  font-family: inherit
}

button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer
}

#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column
}

/* NAV */
.nav {
  padding: calc(var(--sat) + 6px) 8px 8px;
  background: var(--nav);
  border-bottom: .5px solid var(--sep);
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  min-height: calc(var(--sat) + 52px);
  position: relative;
  z-index: 5
}

.nav .t {
  flex: 1;
  text-align: center;
  min-width: 0
}

.nav .t h1 {
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.nav .t small {
  display: block;
  font-size: 11px;
  color: var(--mut);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.nb {
  color: var(--tint);
  font-size: 17px;
  padding: 6px 8px;
  min-width: 40px;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  font-weight: 500
}

.nb:active {
  background: var(--fill)
}

.nb[disabled] {
  opacity: .3;
  pointer-events: none
}

.nb.b {
  font-weight: 600
}

.big {
  padding: 8px 16px 4px;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .2px
}

/* HOME */
.scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain
}

.sec {
  padding: 0 16px 8px;
  font-size: 13px;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: .3px;
  margin-top: 20px
}

.list {
  margin: 0 16px;
  background: var(--card);
  border-radius: 12px;
  overflow: hidden
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  min-height: 64px;
  position: relative
}

.row+.row::before {
  content: "";
  position: absolute;
  left: 16px;
  right: 0;
  top: 0;
  border-top: .5px solid var(--sep)
}

.row:active {
  background: var(--fill)
}

.row .th {
  width: 64px;
  height: 44px;
  border-radius: 8px;
  background: var(--card2);
  flex-shrink: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: .5px solid var(--sep)
}

.row .th svg {
  width: 100%;
  height: 100%
}

.row .tx {
  flex: 1;
  min-width: 0
}

.row .n {
  font-size: 17px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.row .s {
  font-size: 13px;
  color: var(--mut);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px
}

.chev {
  color: var(--fill2);
  font-size: 20px
}

.empty {
  text-align: center;
  padding: 70px 30px;
  color: var(--mut);
  font-size: 15px;
  line-height: 1.5
}

.empty .i {
  font-size: 56px;
  margin-bottom: 10px
}

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: 14px;
  background: var(--tint);
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  margin-top: 18px
}

.pill:active {
  background: var(--tint2)
}

.note {
  margin: 14px 16px 0;
  padding: 12px 14px;
  background: var(--card);
  border-radius: 12px;
  font-size: 13px;
  color: var(--txt2);
  line-height: 1.45
}

.note b {
  color: var(--tint)
}

/* EDITOR */
.ed {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0
}

.seg {
  display: flex;
  background: var(--fill);
  border-radius: 9px;
  padding: 2px;
  margin: 8px 12px 0;
  flex-shrink: 0
}

.seg button {
  flex: 1;
  padding: 7px 4px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  color: var(--txt);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.seg button.on {
  background: var(--card);
  box-shadow: var(--shadow-subtle);
  font-weight: 600
}

.lvl {
  display: flex;
  gap: 6px;
  padding: 8px 12px 4px;
  overflow-x: auto;
  flex-shrink: 0;
  align-items: center
}

.lvl::-webkit-scrollbar {
  display: none
}

.lvl .l {
  padding: 6px 12px;
  border-radius: 16px;
  background: var(--fill);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  color: var(--txt)
}

.lvl .l.on {
  background: var(--tint);
  color: #fff
}

.lvl .l small {
  font-weight: 400;
  opacity: .7;
  margin-left: 4px
}

.lvl .lbl {
  font-size: 12px;
  color: var(--mut);
  white-space: nowrap;
  margin-right: 2px
}

.stats {
  display: flex;
  gap: 6px;
  padding: 4px 12px;
  overflow-x: auto;
  flex-shrink: 0
}

.stats::-webkit-scrollbar {
  display: none
}

.st {
  background: var(--card);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 11px;
  color: var(--mut);
  white-space: nowrap;
  border-left: 3px solid transparent
}

.st b {
  display: block;
  font-size: 15px;
  color: var(--txt);
  font-weight: 600
}

.warn {
  margin: 4px 12px 0;
  background: rgba(255, 149, 0, .14);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--orange);
  font-weight: 500
}

.body {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0
}

.cw {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  padding: 8px 12px;
  display: flex;
  align-items: stretch;
  justify-content: center;
}

.cw svg {
  width: 100%;
  height: 100%;
  background: var(--gond);
  border-radius: 12px;
  box-shadow: var(--shadow-subtle)
}

/* DRAWER */
.dr {
  background: var(--card);
  border-radius: 16px 16px 0 0;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 46%;
  transition: height .25s cubic-bezier(.2, .8, .2, 1);
  padding-bottom: var(--sab)
}


.grab {
  width: 36px;
  height: 5px;
  border-radius: 3px;
  background: var(--fill2);
  margin: 6px auto 2px;
  flex-shrink: 0
}

.sb {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px 6px;
  flex-shrink: 0
}

.sb .in {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--fill);
  border-radius: 10px;
  padding: 7px 10px
}

.sb .in input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  font-size: 16px;
  color: var(--txt);
  outline: none
}

.sb .in input::placeholder {
  color: var(--mut)
}

.sb .cnt {
  font-size: 12px;
  color: var(--mut);
  white-space: nowrap
}

.chips {
  display: flex;
  gap: 6px;
  padding: 0 12px 6px;
  overflow-x: auto;
  flex-shrink: 0
}

.chips::-webkit-scrollbar {
  display: none
}

.chip {
  padding: 6px 12px;
  border-radius: 16px;
  background: var(--fill);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  color: var(--txt);
  flex-shrink: 0
}

.chip.on {
  background: var(--tint);
  color: #fff
}

a.chip {
  text-decoration: none;
  color: var(--tint)
}

.dr.min .chips,
.dr.min .pl,
.dr.min .seg {
  display: none
}










/* ===== Tablette et grand écran : plus dense, panneau produits plus large ===== */
@media (min-width:900px) {
  .body { flex-direction: row; }

  .dr {
    width: 420px;
    height: auto !important;
    border-radius: 0;
    box-shadow: none;
    border-left: .5px solid var(--sep);
    order: -1;
    padding-bottom: 0;
  }

  .grab,
  .dr .sb .tg { display: none; }

  .dr.min .chips,
  .dr.min .seg { display: flex; }

  .dr.min .pl { display: grid; }

  /* grille de produits : autant de colonnes que la largeur le permet */
  .pl { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 7px; }

  .pi { min-height: 60px; padding: 6px; }
  .pi .ph { width: 44px; height: 44px; }
  .pi .n { font-size: 12.5px; }

  /* barre du haut plus compacte pour laisser la place au rayon */
  .nav { min-height: calc(var(--sat) + 46px); padding-top: calc(var(--sat) + 4px); }
  .lvl, .stats { padding-top: 4px; padding-bottom: 2px; }
  .st { padding: 4px 9px; }
  .cw { padding: 6px 12px; }

  /* les feuilles s'affichent centrées, comme une fenêtre */
  .ov { align-items: center; padding: 24px; }
  .sh { border-radius: 16px; max-width: 560px; }
  .sh .grab { display: none; }
}

/* ===== Grand iPad en paysage : deux colonnes de produits et rayon plus haut ===== */
@media (min-width:1180px) {
  .dr { width: 470px; }
  .pl { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
  .nav h1 { font-size: 19px; }
}


/* PRO V10 */
.sh select {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  font-size: 15px;
  text-align: right;
  color: var(--txt);
  outline: none
}

.kpiGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0
}

.kpiGrid>div {
  background: var(--fill);
  border-radius: 12px;
  padding: 12px
}

.kpiGrid small {
  display: block;
  color: var(--mut);
  font-size: 11px
}

.kpiGrid b {
  display: block;
  font-size: 21px;
  margin-top: 2px
}

.miniTable {
  background: var(--fill);
  border-radius: 12px;
  overflow: hidden;
  margin: 10px 0
}

.miniTable>div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 11px;
  font-size: 11px;
  border-bottom: .5px solid var(--sep)
}

.miniTable>div:last-child {
  border: 0
}

.miniTable span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1
}

.miniTable b {
  white-space: nowrap
}

.perfList {
  display: flex;
  flex-direction: column;
  gap: 10px
}

.perfCard {
  background: var(--fill);
  border-radius: 12px;
  padding: 10px
}

.perfCard>b {
  font-size: 12px;
  display: block;
  margin-bottom: 8px
}

.perfInputs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px
}

.perfInputs label {
  font-size: 10px;
  color: var(--mut)
}

.perfInputs input {
  width: 100%;
  box-sizing: border-box;
  margin-top: 3px;
  background: var(--card);
  border: 0;
  border-radius: 8px;
  color: var(--txt);
  padding: 8px 6px;
  font-size: 14px;
  text-align: center
}

/* SHEETS */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .4);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fi .15s
}

.ov.c {
  align-items: center;
  padding: 24px
}

@keyframes fi {
  from {
    opacity: 0
  }

  to {
    opacity: 1
  }
}

@keyframes up {
  from {
    transform: translateY(40px)
  }

  to {
    transform: none
  }
}

.sh {
  background: var(--sheet);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 640px;
  max-height: 88vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 16px calc(16px + var(--sab));
  animation: up .2s cubic-bezier(.2, .8, .2, 1)
}

.ov.c .sh {
  border-radius: 14px;
  max-width: 300px;
  padding: 20px 16px 12px;
  text-align: center
}

.sh .grab {
  margin: 2px auto 12px
}

.sh h2 {
  font-size: 20px;
  font-weight: 700;
  margin: 4px 0 4px
}

.sh p {
  font-size: 14px;
  color: var(--mut);
  line-height: 1.45;
  margin-bottom: 12px
}

.grp {
  background: var(--fill);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 14px
}

.grp .f {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  min-height: 46px;
  position: relative
}

.grp .f+.f::before {
  content: "";
  position: absolute;
  left: 14px;
  right: 0;
  top: 0;
  border-top: .5px solid var(--sep)
}

.grp label {
  font-size: 16px;
  flex-shrink: 0;
  min-width: 104px
}

.grp input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  font-size: 16px;
  text-align: right;
  color: var(--txt);
  outline: none
}

.grp .unit {
  font-size: 14px;
  color: var(--mut)
}

.err {
  background: rgba(255, 59, 48, .12);
  color: var(--red);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  margin-bottom: 12px;
  line-height: 1.4
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  background: var(--fill);
  font-size: 17px;
  font-weight: 500;
  margin-top: 8px;
  color: var(--tint)
}

.btn:active {
  background: var(--fill2)
}

.btn.p {
  background: var(--tint);
  color: #fff;
  font-weight: 600
}

.btn.d {
  color: var(--red)
}

.btn[disabled] {
  opacity: .35;
  pointer-events: none
}

.two {
  display: flex;
  gap: 8px
}

.two .btn {
  flex: 1
}

.stp {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 8px 0 12px
}

.stp button {
  width: 56px;
  height: 44px;
  border-radius: 12px;
  background: var(--fill);
  font-size: 24px;
  font-weight: 500;
  color: var(--tint)
}

.stp button:active {
  background: var(--fill2)
}

.stp .v {
  font-size: 34px;
  font-weight: 700;
  min-width: 70px;
  text-align: center
}

.stp .v small {
  display: block;
  font-size: 11px;
  color: var(--mut);
  font-weight: 400
}

.qs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px
}

.qs button {
  flex: 1;
  padding: 9px;
  border-radius: 10px;
  background: var(--fill);
  font-size: 15px;
  font-weight: 500
}

.qs button.on {
  background: var(--tint);
  color: #fff
}

.hdrow {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px
}

.hdrow .ph {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  background: #fff;
  border: .5px solid var(--sep);
  overflow: hidden;
  flex-shrink: 0
}

.hdrow .ph img {
  width: 100%;
  height: 100%;
  object-fit: contain
}

.exp img {
  width: 100%;
  border-radius: 10px;
  border: .5px solid var(--sep)
}

.exp pre {
  font-size: 10px;
  background: var(--fill);
  padding: 10px;
  border-radius: 10px;
  max-height: 220px;
  overflow: auto;
  white-space: pre;
  -webkit-user-select: text;
  user-select: text
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(74px + var(--sab));
  transform: translateX(-50%) translateY(10px);
  background: var(--bubi-graphite);
  color: #fff;
  padding: 10px 16px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  font-weight: 500;
  z-index: 200;
  opacity: 0;
  transition: all .2s;
  pointer-events: none;
  max-width: 88%;
  text-align: center;
  box-shadow: var(--shadow-subtle)
}

.toast.on {

}

to { opacity: 1; }

/* ===== Bandeau Annuler ===== */
.undobar {

.body { position: relative; }

/* ===== Accessibilité : les tailles suivent les réglages du système ===== */

.btn { font-size: clamp(15px, .98rem, 17px); }

/* ===== Mouvement : chaque geste a sa conséquence visible ===== */
@media (prefers-reduced-motion: no-preference) {
  .pi, .l, .chip, .st, .btn, .row { transition: transform .14s cubic-bezier(.2,.9,.3,1.1), background .16s, box-shadow .16s; }

}

@keyframes slidein {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {

}

/* ============================================================
   BLUEPRINT → SHELF : règles transversales
   ============================================================ */
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
}

/* les chiffres techniques sont alignés et lisibles */
.st b, .stats, .lvl, .pi .r, .ol .q, .grp input[type=number], .kpi b, .dim {
  font-variant-numeric: tabular-nums;
}

/* le blanc domine : les surfaces sont plates et bordées, pas ombrées */
.nav, .dr, .sh, .presBar, .selbar, .list, .resume, .st, .pi {
  box-shadow: none;
}

.nav { border-bottom: .5px solid var(--bubi-border); }
.dr { border-top: .5px solid var(--bubi-border); }
.list, .resume, .st, .pi { border: .5px solid var(--bubi-border); }

/* action forte : Graphite, pas de vert fluorescent */
.btn.p, .pill {
  background: var(--bubi-graphite);
  color: #fff;
  box-shadow: none;
}
.btn.p:active, .pill:active { background: #1C2428; }
@media (prefers-color-scheme: dark) {
  .btn.p, .pill { background: var(--bubi-blueprint-strong); color: #111516; }
}

/* états sélectionnés : Sage, sans halo */
.l.on, .chip.on, .seg button.on, .qs button.on, .fb.on, .l.selbtn.on {
  background: var(--bubi-sage);
  color: #fff;
  box-shadow: none;
}
.seg button.on { font-weight: 600; }
.l { background: var(--bubi-surface); border: .5px solid var(--bubi-border); }
.chip { background: var(--bubi-surface-2); border: 0; }

/* barre du bas de la présentation : plate */
.presBar, .presClose { background: var(--bubi-surface); border: .5px solid var(--bubi-border); }

/* bandeau Annuler : Graphite plein */
.undobar { background: var(--bubi-graphite); color: #fff; box-shadow: var(--shadow-subtle); }
.undobar button { color: #fff; text-decoration: underline; }

/* reflet mobile retiré */
.btn.p::after { display: none; }

/* ============================================================
   PRODUCT TRAY
   ============================================================ */
.dr { background: var(--bubi-surface); }
.grab { background: var(--bubi-border); }









/* ============================================================
   MES PLANS
   ============================================================ */
.nav .t h1 { font-weight: 600; }
.nb.b { font-weight: 600; color: var(--bubi-graphite); }

.empty .bp { width: 220px; max-width: 80%; margin: 0 auto 10px; display: block; }
.empty .et { font-size: 16px; color: var(--bubi-graphite); margin: 6px 0 4px; }
.empty .pill { border-radius: var(--radius-sm); padding: 12px 22px; font-size: 16px; }

.row.plan { min-height: 92px; padding: 10px 14px; }
.row.plan .th.big { width: 112px; height: 72px; border-radius: 10px; border: .5px solid var(--bubi-border); background: var(--bubi-surface); }
.row.plan .n { font-size: 16px; font-weight: 600; }
.row.plan .s { font-size: 13px; }

.resume { border-radius: var(--radius-md); }
.resume .rl { color: var(--bubi-blueprint-strong); }

/* ============================================================
   NOUVELLE GONDOLE
   ============================================================ */
.lbl2 {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .4px;
  text-transform: uppercase;
  color: var(--bubi-text-secondary);
  margin: 4px 0 6px 4px;
}

.grp { background: var(--bubi-surface); border: .5px solid var(--bubi-border); border-radius: var(--radius-sm); }
.grp .unit { color: var(--bubi-text-secondary); font-variant-numeric: tabular-nums; }

/* ============================================================
   ÉDITEUR
   ============================================================ */
.nav .t small.dim { font-size: 12px; }

.st {
  background: var(--bubi-surface);
  border: .5px solid var(--bubi-border);
  border-radius: 10px;
  padding: 6px 10px;
  color: var(--bubi-text-secondary);
  font-size: 11px;
  line-height: 1.2;
}

.st b {
  display: block;
  font-size: 16px;
  font-weight: 700;
  color: var(--bubi-graphite);
  margin-bottom: 1px;
}

.st.fam { border-left: 3px solid var(--fam); }

.l { font-weight: 600; color: var(--bubi-graphite); }
.l small { opacity: .6; }

.cw svg { background: var(--bubi-surface); border: .5px solid var(--bubi-border); box-shadow: none; }

.warn { background: var(--bubi-warning-bg); color: var(--bubi-warning); }

.selbar { border: 1px solid var(--bubi-blueprint-strong); background: var(--bubi-blueprint-soft); }
.selbar .c { color: var(--bubi-blueprint-strong); }

/* animation blueprint → produit : 200 ms, ease-out, rien de plus */
@keyframes bpToShelf {
  from { opacity: .2; transform: translateY(4px) scale(.94); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .cw svg rect.pop { animation: bpToShelf .22s ease-out; transform-box: fill-box; transform-origin: center; }
}

/* présentation : plate, lumineuse */
.pres { background: var(--bubi-bg); }
.presWrap svg { background: var(--bubi-surface); border: .5px solid var(--bubi-border); box-shadow: none; }
.pres.withScene .presWrap svg { box-shadow: var(--shadow-subtle); }

/* ============================================================
   CIBLES TACTILES : 44 × 44 minimum, partout
   ============================================================ */
.nb, .btn, .chip, .l, .seg button, .pi .add, .sb2, .fb, .qs button, .presBar .nb, .presClose,
.row, .pi, .resume, .selbar button, .undobar button, .lvl .l {
  min-height: 44px;
}
.chip, .l { display: inline-flex; align-items: center; padding-top: 0; padding-bottom: 0; }
.seg button, .fb, .qs button, .sb2 { min-height: 44px; }
.nb { min-width: 44px; }
.stp button { min-width: 56px; min-height: 48px; }
.cart, .dimin { min-height: 44px; }

/* les listes de puces gardent leur hauteur de ligne malgré la cible agrandie */
.chips { align-items: center; }

/* ============================================================
   CARTE PRODUIT — une seule définition, plus de règles concurrentes
   ============================================================ */
.pl {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 8px;
  align-content: start;
  padding: 0 12px 10px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1;
}

.pi {
  display: grid;
  grid-template-columns: 60px minmax(0, 1fr) 44px;   /* la colonne texte ne déborde jamais */
  align-items: center;
  gap: 10px;
  min-height: 76px;
  padding: 8px;
  background: var(--bubi-surface);
  border: .5px solid var(--bubi-border);
  border-radius: 14px;
  overflow: hidden;
  touch-action: manipulation;
  transition: transform .12s, background .12s;
}

.pi:active { transform: scale(.97); background: var(--bubi-surface-2); }

.pi .ph {
  width: 60px;
  height: 60px;
  border-radius: 10px;
  background: var(--bubi-surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.pi .ph img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 3px;
  transform: none;
}

.pi .tx {
  min-width: 0;              /* indispensable : sans cela le texte pousse la grille */
  overflow: hidden;
}

.pi .b,
.pi .n,
.pi .r {
  display: block;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  overflow-wrap: anywhere;
}

.pi .b {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .3px;
  text-transform: uppercase;
  color: var(--bubi-text-secondary);
  white-space: nowrap;
  text-overflow: ellipsis;
  line-height: 1.3;
}

.pi .n {
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.25;
  max-height: 2.5em;                 /* deux lignes, puis coupure nette */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  margin: 1px 0;
}

.pi .r {
  font-size: 11.5px;
  color: var(--bubi-text-secondary);
  white-space: nowrap;
  text-overflow: ellipsis;
  line-height: 1.3;
}

.pi .add,
.pi .bd {
  justify-self: end;
  align-self: center;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
}

.pi .add { border: .5px solid var(--bubi-border); color: var(--bubi-graphite); }
.pi .bd { background: var(--bubi-sage); color: #fff; }

/* Sur téléphone, une seule colonne : le texte a toute la largeur */
@media (max-width: 620px) {
  .pl { grid-template-columns: 1fr; }
}

/* ============================================================
   ANTI-CHEVAUCHEMENT — règles générales
   Un texte long ne doit jamais sortir de sa colonne ni recouvrir
   son voisin, quelle que soit la taille de police du système.
   ============================================================ */

/* toute cellule de grille ou de flex peut rétrécir */
.pi .tx, .row .tx, .resume .rtx, .ol .n, .st, .bar .bl, .grp .f, .grp label, .lvl, .stats {
  min-width: 0;
}

/* les libellés qui doivent tenir sur une ligne la tiennent, avec des points de suite */
.row .n, .row .s, .resume .rn, .resume .rs, .ol .n, .nav .t h1, .nav .t small {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* les KPI et les puces ne se compriment pas les uns sur les autres */
.stats, .lvl, .chips { flex-wrap: nowrap; }
.st, .l, .chip, .seg button { flex: 0 0 auto; }

/* les champs des formulaires gardent leur libellé lisible */
.grp .f { flex-wrap: wrap; row-gap: 2px; }
.grp label { flex: 0 0 auto; }
.grp input { min-width: 80px; }

/* les feuilles ne débordent jamais en largeur */
.sh, .sh * { max-width: 100%; }
.sh pre { white-space: pre-wrap; overflow-wrap: anywhere; }

/* le titre de la barre de navigation cède la place aux boutons */
.nav .t { min-width: 0; overflow: hidden; }

/* ============================================================
   CORRECTIONS ISSUES DE L'INSPECTION NAVIGATEUR
   ============================================================ */

/* la carte produit ne peut pas déborder sur une seconde ligne */
.pi { grid-template-rows: minmax(0, 1fr); }
.pi > * { grid-row: 1; }
.pi .add, .pi .bd { box-sizing: border-box; }

/* cibles tactiles réellement mesurées sous 44 px */
.nav .nb.b { min-height: 44px; padding: 8px 14px; }
.nb.side, [data-act="univ2"], [data-act="univ"] { min-width: 44px; }
.seg button { padding-left: 10px; padding-right: 10px; }

/* la poignée du tiroir ne faisait que 5 px de haut : on élargit la zone d'appui */
.grab {
  height: 22px;                 /* zone d'appui confortable */
  padding: 0;
  position: relative;
  background: transparent;
  flex-shrink: 0;
}

.grab::before {                 /* le trait visible reste fin */
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 36px;
  height: 5px;
  border-radius: 3px;
  background: var(--bubi-border);
}

.grab::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 120px;
  height: 44px;
}

/* le bandeau Annuler ne doit pas masquer la première carte du catalogue */


/* le bouton de l'état vide doit lui aussi respecter la cible tactile */
.pill { min-height: 48px; padding: 13px 24px; }

/* la poignée du tiroir : zone d'appui étendue, invisible mais réelle */
.grab::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 140px; height: 44px; }

/* le bandeau Annuler vit au bas de la zone du plan, jamais sur le rayon ni sur le catalogue */
.cwWrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.cwWrap .cw { flex: 1; min-height: 0; }
.undobar { bottom: 10px; }

/* ============================================================
   CATALOGUE : TROIS HAUTEURS SUR TÉLÉPHONE
   ============================================================ */
.dr {
  /* la hauteur est une propriété de mise en page : on l'anime brièvement et on
     prévient le navigateur, plutôt que de laisser une transition longue */
  transition: height .18s cubic-bezier(.2, .8, .2, 1);
  will-change: height;
}

.dr.min { height: calc(62px + var(--sab)); }
.dr.half { height: 52%; }
.dr.full { height: 88%; }

.dr.min .chips,
.dr.min .pl,
.dr.min .seg { display: none; }

/* la poignée est le curseur de hauteur : on la rend explicite */
.dr .grab { cursor: grab; touch-action: none; }
.dr .grab:active { cursor: grabbing; }
.dr .grab::before { width: 44px; height: 5px; }

/* en plein écran, le catalogue passe devant le plan */
.dr.full { box-shadow: 0 -6px 24px rgba(40, 50, 56, .10); }

@media (min-width: 900px) {
  .dr, .dr.min, .dr.half, .dr.full { height: auto !important; }
  .dr.min .chips, .dr.min .seg { display: flex; }
  .dr.min .pl { display: grid; }
}

/* ============================================================
   BARRE DE FILTRES COMPACTE — le catalogue commence plus haut
   ============================================================ */
.dr .seg:empty { display: none; }

.dr .sb { padding: 2px 12px 6px; }
.dr .sb .in { padding: 9px 10px; }

.dr .chips { padding: 0 12px 6px; gap: 6px; }
.dr .chip { padding: 0 13px; min-height: 44px; font-size: 13.5px; }

.chip.univ { font-weight: 600; }

.sepv {
  width: 1px;
  align-self: center;
  height: 22px;
  background: var(--bubi-border);
  flex: 0 0 auto;
  margin: 0 2px;
}

@media (max-width: 620px) {
  .dr .grab { height: 18px; }
  .dr .chips { padding-bottom: 5px; }
  .pi { min-height: 72px; padding: 7px; }
  .pi .ph { width: 54px; height: 54px; }
}

/* ============================================================
   ACCUEIL — présence iOS : grand titre, recherche, filtres comptés,
   en-têtes de magasin, bouton flottant.
   ============================================================ */
.big {
  padding: 10px 16px 2px;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -.4px;
}

.hsb { padding: 8px 16px 2px; }

.hsb .in {
  background: var(--bubi-surface-2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  border: .5px solid var(--bubi-border);
}

.hchips { padding: 8px 16px 2px; }

.hchips .chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  min-height: 44px;
  background: var(--bubi-surface);
  border: .5px solid var(--bubi-border);
  font-size: 14px;
  font-weight: 500;
}

.hchips .chip i {
  font-style: normal;
  font-size: 12px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 9px;
  background: var(--bubi-surface-2);
  color: var(--bubi-text-secondary);
}

.hchips .chip.on { border-color: var(--bubi-sage); }
.hchips .chip.on i { background: rgba(255, 255, 255, .22); color: #fff; }

.storeHead {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 20px 20px 8px;
}

.storeHead span {
  font-size: 18px;
  font-weight: 650;
  letter-spacing: -.2px;
}

.storeHead small {
  font-size: 13px;
  color: var(--bubi-text-secondary);
  margin-left: auto;
}

.row.plan .badges {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 3px;
}

.row.plan .badges .s { white-space: nowrap; }

.pill2 {
  background: var(--bubi-surface-2);
  border: .5px solid var(--bubi-border);
}

/* Bouton flottant : l'action principale toujours sous le pouce */
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(20px + var(--sab));
  width: 58px;
  height: 58px;
  border-radius: 20px;
  background: var(--bubi-graphite);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 18px rgba(40, 50, 56, .22);
  z-index: 20;
  transition: transform .14s cubic-bezier(.2, .9, .3, 1.1);
}

.fab:active { transform: scale(.92); }

@media (prefers-color-scheme: dark) {
  .fab { background: var(--bubi-blueprint-strong); color: #111516; }
}

@media (min-width: 900px) {
  .fab { display: none; }
}

.empty .es {
  font-size: 14px;
  color: var(--bubi-text-secondary);
  margin: 2px 0 14px;
  line-height: 1.45;
}

/* la puce sélectionnée doit rester lisible : le texte blanc sur Sage, pas invisible */
.hchips .chip.on {
  background: var(--bubi-sage);
  color: #fff;
  border-color: var(--bubi-sage);
}

.hchips .chip.on i { background: rgba(255, 255, 255, .25); color: #fff; }

/* la rangée de filtres défile proprement, sans être coupée au bord */
.hchips {
  scroll-padding-inline: 16px;
  scroll-snap-type: x proximity;
}

.hchips .chip { scroll-snap-align: start; }
.hchips::after { content: ""; flex: 0 0 4px; }

/* ============================================================
   DESCENTES TYPES — bibliothèque de modules, sur l'accueil
   ============================================================ */
.descRow {
  display: flex;
  gap: 10px;
  padding: 2px 16px 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
}

.descRow::-webkit-scrollbar { display: none; }

.descCard {
  flex: 0 0 152px;
  scroll-snap-align: start;
  background: var(--bubi-surface);
  border: .5px solid var(--bubi-border);
  border-radius: var(--radius-md);
  padding: 10px;
  min-height: 44px;
  transition: transform .14s;
}

.descCard:active { transform: scale(.97); }

.dcTh {
  height: 92px;
  border-radius: 10px;
  background: var(--bubi-surface-2);
  overflow: hidden;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dcTh svg { width: 100%; height: 100%; }

.dcN {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.2;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.dcS {
  font-size: 12px;
  color: var(--bubi-text-secondary);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.simPrev {
  height: 190px;
  border-radius: var(--radius-sm);
  border: .5px solid var(--bubi-border);
  background: var(--bubi-surface);
  padding: 8px;
  margin: 10px 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.simPrev svg { width: 100%; height: 100%; }

/* ============================================================
   FLUIDITÉ — d'après les recommandations de performance web 2026
   Trois règles suivies partout :
   1. n'animer que transform et opacity, jamais une largeur ou une hauteur,
      qui obligent le navigateur à tout recalculer ;
   2. laisser le navigateur ignorer ce qui est hors écran ;
   3. isoler chaque carte pour qu'une modification n'en repeigne pas mille.
   ============================================================ */

/* Les cartes hors écran ne sont plus dessinées : une liste de 175 produits
   coûte alors le prix de ce qui est visible. */
.pi {
  content-visibility: auto;
  contain-intrinsic-size: 0 76px;
  contain: layout paint style;
}

.row.plan,
.descCard {
  contain: layout paint style;
}

/* Le rayon est un gros dessin : on l'isole du reste de la page. */
.cw { contain: layout paint; }

/* Les surfaces qui glissent le font sur le compositeur, sans repeindre. */
.ov { will-change: opacity; }
.sh { will-change: transform; }

/* Le défilement reste vertical et ne remonte pas à la page parente. */
.scroll, .pl, .sh, .ordl {
  touch-action: pan-y;
  overscroll-behavior: contain;
}

.chips, .stats, .lvl, .descRow, .tb {
  touch-action: pan-x;
  overscroll-behavior-x: contain;
}

/* Texte net sur écran Retina. */
html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Appui : réponse immédiate puis retour souple, comme un bouton physique. */
@media (prefers-reduced-motion: no-preference) {
  .btn, .pill, .fab, .chip, .l, .pi, .row, .descCard, .st, .nb {
    transition: transform 120ms cubic-bezier(.34, 1.4, .64, 1), background 140ms ease-out, box-shadow 140ms ease-out;
  }

  .btn:active, .nb:active { transform: scale(.96); }
}
</style>

const IMAGE_BASE = "https://bubimex.eu/wp-content/uploads/";
const IMAGE_SUFFIXES = [".jpg", "-700x700.jpg", "-600x600.jpg", ".png", ".webp", ".jpeg"];
const MERCH_DEFAULT = { minFacings: 1, maxFacings: 6, priority: 3 };

function buildProduct([universe, ref, name, brand, format, widthCm, heightCm, depthCm, defaultFacings, defaultStack]) {
  return {
    universe, ref, name, brand, format,
    widthCm, heightCm, depthCm,
    defaultFacings, defaultStack,
    imageCandidates: IMAGE_SUFFIXES.map(suffix =>IMAGE_BASE + ref + suffix),
    merch: Object.assign({}, MERCH_DEFAULT)
  };
}

const CATALOGUE_DB = CATALOGUE_RAW.map(buildProduct);

// Index de catalogue : toutes les fonctions historiques continuent d'utiliser PRODUCTS/BY_REF.
const PRODUCTS = CATALOGUE_DB.map(x => {
  const parts = x.name.split(', ');
  const line = parts[0].replace(x.brand, '').trim();
  const flav = parts[1] || '';
  const logo = LOGOS[x.brand];
  const lw = 42, lh = Math.round(lw * logo.h / logo.w);
  const ph = 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 60 60">` +
    `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">` +
    `<stop offset="0" stop-color="${BRAND_LIGHT[x.brand]}"/><stop offset="1" stop-color="${BRAND_DARK[x.brand]}"/>` +
    `</linearGradient></defs>` +
    `<rect width="60" height="60" rx="10" fill="url(#g)"/>` +
    `<image href="${logo.white}" xlink:href="${logo.white}" x="${(60-lw)/2}" y="${14-lh/2}" width="${lw}" height="${lh}" opacity=".95"/>` +
    `<text x="30" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="system-ui">${x.format}</text>` +
    `</svg>`);
  const fg = {
    '395g': '400g',
    '375g': '400g',
    '190g': '200g'
  } [x.format] || x.format;
  return {
    univ: x.universe,
    ref: x.ref,
    name: x.name,
    cat: x.brand,
    line,
    flav,
    fmt: x.format,
    fg,
    w: x.widthCm,
    h: x.heightCm,
    d: x.depthCm,
    df: x.defaultFacings,
    st: x.defaultStack,
    ph,
    imageCandidates: x.imageCandidates,
    merch: x.merch
  };
});
const BY_REF = Object.fromEntries(PRODUCTS.map(p => [p.ref, p]));
try {
  applyDimFixes();
} catch (e) {}
window.BUBIPLAN_DB = {

};

    save: '<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3"/><rect x="8" y="13" width="8" height="8"/>',
    cog: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
    box: '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  }[name] || '';
  return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}

/* ================= TOKENS CÔTÉ EXPORT =================
   Une image ou une page exportée vit hors de l'application : les variables CSS n'y
   existent pas. Avant tout export, on remplace chaque var(--bubi-…) par sa valeur.
*/
const TOKENS = {
  '--bubi-bg': '#F7F6F2', '--bubi-surface': '#FFFFFF', '--bubi-surface-2': '#F4F5F3',
  '--bubi-graphite': '#283238', '--bubi-text-secondary': '#56636A', '--bubi-border': '#E6E8E7',
  '--bubi-blueprint-soft': '#DCE8EE', '--bubi-blueprint': '#7895A4', '--bubi-blueprint-strong': '#527789',
  '--bubi-sage': '#758A6B', '--bubi-terracotta': '#C96F4F', '--bubi-ochre': '#DDAA4D',
  '--bubi-cream': '#E8D8BD', '--bubi-shelf': '#D8B991', '--bubi-warning': '#B8862B',
  '--bubi-warning-bg': '#FBF3DF', '--bubi-danger': '#B5473A'
};

function resolveTokens(str) {
  return String(str).replace(/var\((--bubi-[a-z0-9-]+)\)/g, (m, k) => TOKENS[k] || '#888');
}

const TOKEN_STYLE = `<style>:root{${Object.entries(TOKENS).map(([k, v]) => k + ':' + v).join(';')}}</style>`;

/* ================= STOCKAGE SÛR =================
   Safari refuse localStorage dans certains cas (fichier ouvert en local, navigation
   privée, quota atteint) et lève une exception. Sans cette couche, la moindre lecture
   non protégée arrête tout le script et l'application reste sur un écran blanc.
   Ici, en cas de refus, on bascule sur une mémoire de secours : l'application
   fonctionne normalement, seules les données ne survivent pas à la fermeture.
*/
const memoryStore = {};
let storageWarned = false;

function lsGet(key) {
  try {
    const v = window.localStorage.getItem(key);
    return v === null ? (key in memoryStore ? memoryStore[key] : null) : v;
  } catch (e) {
    return key in memoryStore ? memoryStore[key] : null;
  }
}

function lsSet(key, value) {
  memoryStore[key] = value;
  try {
    window.localStorage.setItem(key, value);
    return true;
  } catch (e) {
    if (!storageWarned) {
      storageWarned = true;
      setTimeout(() => toast("Stockage plein : les derniers changements ne sont pas gardés"), 800);
    }
    return false;
  }
}

const PERFKEY = 'bubiplan_perf_v10';
let PERF = {};
try {
  PERF = JSON.parse(lsGet(PERFKEY) || '{}');
} catch (e) {}

function savePerf() {
  try {
    lsSet(PERFKEY, JSON.stringify(PERF));
  } catch (e) {}
}

function perf(ref) {
  return Object.assign({
    unitsWeek: 0,
    price: 0,
    margin: 0,
    stock: 0,
    minF: 1,
    maxF: 6,
    priority: 3
  }, PERF[ref] || {});
}

function setPerf(ref, data) {
  PERF[ref] = Object.assign(perf(ref), data);
  savePerf();
}

function depthCapacity(p) {
  return Math.max(1, Math.floor((S.cur?.D || 40) / Math.max(.1, p.d || 1)));
}

function itemCapacity(it) {
  const p = BY_REF[it.ref];
  if (!p) return 0;                     // espace de calage : aucune contenance
  return it.f * (it.s || 1) * depthCapacity(p);
}

function itemDOS(it) {
  if (!BY_REF[it.ref]) return null;     // espace de calage
  const d = perf(it.ref),
    u = +d.unitsWeek || 0;
  return u > 0 ? itemCapacity(it) / (u / 7) : null;
}

const FMTS = (u, c) => [...new Set(PRODUCTS.filter(p => p.univ === u && (!c || p.cat === c)).map(p => p.fg))].sort((a, b) => parseInt(a) - parseInt(b));

/* ================= PHOTOS (chargées depuis bubimex.eu, cache statut) ================= */

/* Les visuels déposés dans le dossier photos/ du dépôt sont servis par la même adresse
   que l'application : aucun refus de copie, détourage possible, présence dans les
   exports et disponibilité hors ligne. On les cherche donc avant tout le reste, le
   site Bubimex ne servant que de secours. */
function localPhotos(ref) {
  return ['./photos/' + ref + '.jpg', './photos/' + ref + '.png', './photos/' + ref + '.webp'];
}

function photoCandidates(ref) {
  const p = BY_REF[ref];
  const explicit = [...localPhotos(ref), ...((p && p.imageCandidates) || [])];
  // Fallbacks historiques conservés pour les références dont WordPress a renommé le fichier.
  const root = 'https://bubimex.eu/wp-content/uploads/';
  const generic = [`${root}${ref}.jpg`, `${root}${ref}-1.jpg`, `${root}${ref}-2.jpg`, `${root}${ref}-700x700.jpg`, `${root}${ref}-600x600.jpg`, `${root}${ref}.png`, `${root}${ref}.webp`, `${root}${ref}.jpeg`];
  return [...new Set([...explicit, ...generic])];
}
/* ================= CORRECTIONS PUBLIÉES =================
   Un fichier catalogue.json déposé à côté de l'application corrige des cotes ou ajoute
   des références sans republier l'application entière. Format attendu :
     { "corrections": [ { "ref": "9099", "w": 23, "h": 8, "d": 16, "df": 1, "st": 2 } ],
       "ajouts":      [ ["chat","9200","Nom du produit","Bubi Nature","70g",7.5,3.8,7.5,2,4] ] }
   Absent ou illisible, l'application tourne sur son catalogue interne.
*/
function loadCatalogueOverlay() {
  if (typeof fetch !== 'function') return;              // navigateur sans fetch
  if (!/^https?:$/.test(location.protocol)) return;     // fichier local : rien à charger
  try {
    fetch('./catalogue.json', { cache: 'no-cache' })
      .then(r => (r.ok ? r.json() : null))
      .then(data => {
      if (!data) return;
      let n = 0;
      (data.corrections || []).forEach(c => {
        const p = BY_REF[c.ref];
        if (!p) return;
        ['w', 'h', 'd', 'df', 'st'].forEach(k => { if (c[k] != null) p[k] = +c[k]; });
        if (c.name) p.name = c.name;
        n++;
      });
      if (!n) return;
      applyDimFixes();
      renderListIfEditor();
      if (S.cur) update();
    })
      .catch(() => {});
  } catch (e) {}
}

/* ================= CORRECTIONS DE DIMENSIONS =================

/* ================= BOÎTE UTILE D'UNE PHOTO =================
   Effacer le fond blanc ne suffit pas : il reste une marge, variable d'un packshot à
   l'autre, et le produit flotte dans son cadre. On mesure donc une fois pour toutes
   l'endroit exact qu'occupe le produit dans l'image, en proportions, puis on fait
   coïncider cette zone avec le cadre. La marge tombe hors du cadre et disparaît, sans
   rogner le produit et sans réglage à la main.
*/
const BOXKEY = 'bubiplan_photobox';
let PBOX = {};
try { PBOX = JSON.parse(lsGet(BOXKEY) || '{}'); } catch (e) {}

function savePBox() {
  try { lsSet(BOXKEY, JSON.stringify(PBOX)); } catch (e) {}
}

/* Renvoie { bx, by, bw, bh, ar } en proportions de l'image, ou null si illisible. */
function measurePhoto(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
        if (!W || !H) return resolve(null);
        const max = 220, sc = Math.min(1, max / Math.max(W, H));
        const cw = Math.max(1, Math.round(W * sc)), ch = Math.max(1, Math.round(H * sc));
        const c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        const px = ctx.getImageData(0, 0, cw, ch).data;
        let minX = cw, minY = ch, maxX = -1, maxY = -1;
        for (let y = 0; y < ch; y++) {
          for (let x = 0; x < cw; x++) {
            const i = (y * cw + x) * 4;
            const a = px[i + 3];
            if (a < 16) continue;                                   // transparent
            if (px[i] > 242 && px[i + 1] > 242 && px[i + 2] > 242) continue;  // blanc
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
        if (maxX < 0) return resolve(null);
        resolve({
          bx: minX / cw,
          by: minY / ch,
          bw: (maxX - minX + 1) / cw,
          bh: (maxY - minY + 1) / ch,
          ar: W / H
        });
      } catch (e) {
        resolve(null);   // image d'une autre origine : pixels illisibles
      }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function ensureBox(ref) {
  if (PBOX[ref] !== undefined) return;
  const src = photoURL(ref);
  if (!src) return;
  PBOX[ref] = null;                                   // évite de relancer en boucle
  measurePhoto(src).then(box => {
    PBOX[ref] = box;
    savePBox();
    if (box) { refreshPhoto(ref); }
  });
}

/* Place l'image de façon que sa zone utile remplisse exactement le cadre. */
function photoPlacement(ref, fx, fy, fw, fh) {
  const b = PBOX[ref];
  if (!b || !b.bw || !b.bh) {
    // zone utile inconnue : on retombe sur le cadrage réglable
    const z = FIT.zoom || 1;
    return { x: fx - fw * (z - 1) / 2, y: fy - fh * (z - 1) / 2, w: fw * z, h: fh * z,
             par: FIT.mode === 'fill' ? 'xMidYMid slice' : 'xMidYMid meet' };
  }
  // Règle simple : le produit tient entier dans la hauteur du gabarit, et s'il n'en
  // remplit pas la largeur, on l'étire horizontalement jusqu'à la remplir. Jamais de
  // rognage, jamais de bande sur les côtés.
  const Dh = Math.min(fh / b.bh, (fw / b.bw) / b.ar);   // hauteur : le produit rentre
  const Dw = fw / b.bw;                                 // largeur : toujours remplie
  const cx = (b.bx + b.bw / 2) * Dw;                  // centre du produit dans l'image
  const cy = (b.by + b.bh / 2) * Dh;
  return { x: fx + fw / 2 - cx, y: fy + fh / 2 - cy, w: Dw, h: Dh, par: 'none', cover: true };
}

/* ================= AJUSTEMENT DES VISUELS =================
   Les photos du site comportent une large marge blanche : le produit paraît minuscule
   dans sa boîte. Deux leviers, cumulables :
   - le détourage, qui supprime réellement la marge (nécessite de pouvoir lire les
     pixels, donc une photo importée ou récupérée par l'app) ;
   - le zoom, qui agrandit la photo et rogne ce qui dépasse. Il fonctionne toujours,
     y compris sur une photo distante qu'on ne peut pas analyser.
*/
const FITKEY = 'bubiplan_fit';
let FIT = { zoom: 1, mode: 'fill' };
try {
  Object.assign(FIT, JSON.parse(lsGet(FITKEY) || '{}'));
} catch (e) {}

function saveFit() {
  lsSet(FITKEY, JSON.stringify(FIT));
  renderListIfEditor();
  if (S.cur) update();
}

/* ================= DÉTOURAGE AUTOMATIQUE =================
   Les visuels Bubimex sont sur fond blanc. On retire ce fond par remplissage depuis
   les bords (le blanc à l'intérieur de l'étiquette est donc conservé), puis on recadre
   au plus juste sur le produit. Le résultat est un PNG transparent, prêt à être posé
   sur le rayon. Tout se passe sur l'appareil, aucun envoi de données.
*/
const DETOUR_TOLERANCE = 26;   // écart au blanc considéré comme fond
const DETOUR_MAX_SIZE = 260;   // côté maximal du PNG stocké, en pixels

function detourImage(source) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        resolve(detourCanvas(img));
      } catch (e) {
        resolve(source); // canvas indisponible ou image d'une autre origine : on garde l'original
      }
    };
    img.onerror = () => resolve(source);
    img.src = source;
  });
}

function detourCanvas(img) {
  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;
  if (!w || !h) throw new Error('image vide');

  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, w, h);
  const px = data.data;

  // 1. remplissage depuis les bords : tout ce qui est blanc et relié au bord devient transparent
  const seen = new Uint8Array(w * h);
  const queue = [];
  const isBackground = i => px[i] > 255 - DETOUR_TOLERANCE &&
                            px[i + 1] > 255 - DETOUR_TOLERANCE &&
                            px[i + 2] > 255 - DETOUR_TOLERANCE;
  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const p = y * w + x;
    if (seen[p]) return;
    seen[p] = 1;
    if (isBackground(p * 4)) queue.push(p);
  };
  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
  for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
  while (queue.length) {
    const p = queue.pop();
    px[p * 4 + 3] = 0;
    const x = p % w, y = (p / w) | 0;
    push(x - 1, y); push(x + 1, y); push(x, y - 1); push(x, y + 1);
  }

  // 2. filet de sécurité : si le remplissage n'a presque rien retiré (marge non reliée
  //    au bord, fond légèrement dégradé), on retire aussi tout le blanc restant.
  let cleared = 0;
  for (let p = 0; p < w * h; p++)
    if (px[p * 4 + 3] === 0) cleared++;
  if (cleared < w * h * 0.04) {
    for (let p = 0; p < w * h; p++) {
      const i = p * 4;
      if (px[i + 3] && isBackground(i)) px[i + 3] = 0;
    }
  }

  // 3. recadrage sur ce qui reste visible
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (px[(y * w + x) * 4 + 3] > 12) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) throw new Error('image entièrement effacée');
  ctx.putImageData(data, 0, 0);

  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const scale = Math.min(1, DETOUR_MAX_SIZE / Math.max(cw, ch));
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(cw * scale));
  out.height = Math.max(1, Math.round(ch * scale));
  out.getContext('2d').drawImage(c, minX, minY, cw, ch, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

/* Récupère les visuels depuis bubimex.eu, les détoure et les stocke sur l'appareil.
   Nécessite du réseau. Si le site refuse la lecture des pixels (CORS), l'image est
   conservée telle quelle et comptée comme non détourée. */
/* bubimex.eu accepte d'afficher ses visuels mais refuse qu'on les recopie : sans
   autorisation explicite du serveur, le navigateur interdit la lecture des pixels,
   donc pas de detourage, pas d'enregistrement et pas d'export. Le relais d'images
   ci-dessous recupere la photo a notre place et la renvoie avec l'autorisation
   manquante. Il ne sert qu'une fois : ensuite la photo vit dans l'appareil. */
const PROXY = 'https://images.weserv.nl/?n=-1&w=420&url=';

function proxyURL(url) {
  return PROXY + encodeURIComponent(url.replace(/^https?:\/\//, ''));
}

let useProxy = lsGet('bubiplan_proxy') !== '0';

function setProxy(on) {
  useProxy = on;
  lsSet('bubiplan_proxy', on ? '1' : '0');
}

async function fetchAndDetour(refs, onProgress) {
  let done = 0, ok = 0, cut = 0;
  for (const ref of refs) {
    const direct = photoCandidates(ref);
    const known = PHOTO[ref] && PHOTO[ref] !== 'none' ? [PHOTO[ref]] : [];
    // si l'adresse exacte est déjà connue on n'essaie qu'elle, sinon les trois
    // variantes les plus probables : inutile de multiplier les tentatives
    const base = known.length ? [...localPhotos(ref), ...known] : direct.slice(0, 4);
    const urls = useProxy ? [...base, ...base.map(proxyURL)] : base;
    for (const url of urls) {
      try {
        const res = await fetch(url, { mode: 'cors', referrerPolicy: 'no-referrer' });
        if (!res.ok) continue;
        const blob = await res.blob();
        if (!blob.type.startsWith('image/')) continue;
        const raw = await new Promise((resolve, reject) => {
          const rd = new FileReader();
          rd.onload = () => resolve(rd.result);
          rd.onerror = reject;
          rd.readAsDataURL(blob);
        });
        const clean = await detourImage(raw);
        UPHOTO[ref] = clean;
        dropShortURL(ref);
        delete PBOX[ref];     // la photo a changé : sa zone utile est à remesurer
        ok++;
        if (clean !== raw) cut++;
        break;
      } catch (e) { /* url suivante */ }
    }
    done++;
    if (onProgress) onProgress(done, refs.length, ok);
  }
  saveUPhotos();
  renderListIfEditor();
  if (S.cur) drawGondola();
  return { ok, cut, total: refs.length };
}

/* Re-détoure les photos déjà présentes sur l'appareil. */
async function detourStored(refs) {
  let n = 0;
  for (const ref of refs) {
    if (!UPHOTO[ref]) continue;
    const clean = await detourImage(UPHOTO[ref]);
    if (clean !== UPHOTO[ref]) { UPHOTO[ref] = clean; n++; }
  }
  saveUPhotos();
  renderListIfEditor();
  if (S.cur) drawGondola();
  return n;
}

/* ================= STOCKAGE DES VISUELS =================
   Les photos détourées pèsent bien plus que la limite de quelques mégaoctets accordée
   au stockage simple : au bout d'une trentaine d'images, Safari refuse tout et
   l'application annonce que la sauvegarde est indisponible. On range donc les visuels
   dans la base de données du navigateur, qui accepte plusieurs centaines de mégaoctets,
   et on ne garde dans le stockage simple que les données légères.
*/
const PHOTO_DB = 'bubiplan_photos_db';
let photoDb = null;

function openPhotoDb() {
  return new Promise(resolve => {
    if (photoDb) return resolve(photoDb);
    if (!window.indexedDB) return resolve(null);
    try {
      const rq = indexedDB.open(PHOTO_DB, 1);
      rq.onupgradeneeded = () => {
        if (!rq.result.objectStoreNames.contains('img')) rq.result.createObjectStore('img');
      };
      rq.onsuccess = () => { photoDb = rq.result; resolve(photoDb); };
      rq.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

function dbPut(ref, data) {
  return openPhotoDb().then(db => {
    if (!db) return false;
    return new Promise(resolve => {
      try {
        const tx = db.transaction('img', 'readwrite');
        tx.objectStore('img').put(data, ref);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      } catch (e) { resolve(false); }
    });
  });
}

function dbDelete(ref) {
  return openPhotoDb().then(db => {
    if (!db) return;
    try { db.transaction('img', 'readwrite').objectStore('img').delete(ref); } catch (e) {}
  });
}

/* Au démarrage, on charge les visuels en mémoire et on rapatrie ceux qui traînaient
   encore dans l'ancien stockage, devenu trop étroit. */
function loadPhotoStore() {
  return openPhotoDb().then(db => {
    if (!db) return;
    return new Promise(resolve => {
      try {
        const tx = db.transaction('img', 'readonly');
        const st = tx.objectStore('img');
        const keys = st.getAllKeys(), vals = st.getAll();
        tx.oncomplete = () => {
          (keys.result || []).forEach((k, i) => { UPHOTO[k] = vals.result[i]; });
          resolve();
        };
        tx.onerror = () => resolve();
      } catch (e) { resolve(); }
    });
  }).then(() => {
    // migration de l'ancien stockage, puis libération de la place
    const old = Object.keys(UPHOTO).filter(k => UPHOTO[k] && UPHOTO[k].startsWith('data:'));
    if (!old.length) return;
    return Promise.all(old.map(k => dbPut(k, UPHOTO[k]))).then(() => {
      try { lsSet(UK, '{}'); } catch (e) {}
    });
  }).then(() => {
    if (S.cur) { renderListIfEditor(); drawGondola(); }
  });
}

/* ================= RÉFÉRENCES LÉGÈRES AUX VISUELS =================
   Une photo détourée, comme un logo de marque, pèse plusieurs dizaines de milliers de
   caractères. Insérée telle quelle dans le dessin, elle y est recopiée une fois par
   boîte : un rayon garni produisait un dessin de plus d'un mégaoctet, reconstruit à
   chaque geste. D'où la lenteur. On enregistre donc chaque image une seule fois dans
   le navigateur et on n'en manipule plus qu'une adresse courte. Les exports, eux, ont
   besoin de l'image complète : on la remet au moment de l'export.
*/
const UURL = {};        // clé → adresse courte
const URL2REF = {};     // adresse courte → clé, pour retrouver l'image aux exports

function shortData(key, data) {
  if (UURL[key]) return UURL[key];
  if (!data || !data.startsWith('data:')) return null;
  try {
    const comma = data.indexOf(',');
    const mime = data.slice(5, data.indexOf(';'));
    const bin = atob(data.slice(comma + 1));
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const u = URL.createObjectURL(new Blob([buf], { type: mime }));
    UURL[key] = u;
    URL2REF[u] = key;
    return u;
  } catch (e) {
    return data;   // navigateur récalcitrant : on garde l'image intégrée
  }
}

function shortURL(ref) {
  return shortData(ref, UPHOTO[ref]);
}

function dropShortURL(ref) {
  const u = UURL[ref];
  if (!u) return;
  try { URL.revokeObjectURL(u); } catch (e) {}
  delete URL2REF[u];
  delete UURL[ref];
}

const LOGO_URL = {};

function logoURL(cat) {
  if (LOGO_URL[cat] === undefined) {
    LOGO_URL[cat] = shortData('logo:' + cat, LOGOS[cat] && LOGOS[cat].white) || (LOGOS[cat] && LOGOS[cat].white);
  }
  return LOGO_URL[cat];
}

/* Avant un export, on remet les images complètes à la place des adresses courtes. */
function inlinePhotoURLs(str) {
  let out = String(str);
  Object.keys(URL2REF).forEach(u => {
    const k = URL2REF[u];
    const full = k.indexOf('logo:') === 0 ? (LOGOS[k.slice(5)] || {}).white : UPHOTO[k];
    if (full && out.includes(u)) out = out.split(u).join(full);
  });
  return out;
}

const UK = 'bubiplan_userphotos';

function saveUPhotos(refs) {

  const list = refs || Object.keys(UPHOTO);
  list.forEach(r => { if (UPHOTO[r]) dbPut(r, UPHOTO[r]); });
  return true;
}


function photoURL(ref) {
  if (UPHOTO[ref]) return shortURL(ref) || UPHOTO[ref];
  const u = PHOTO[ref];
  return u && u !== 'none' ? u : null;
}

function photoSrc(ref) {
  return photoURL(ref) || BY_REF[ref].ph;
}

function importPhotos(files, forceRef) {
  const arr = [...files];
  if (!arr.length) return;
  let done = 0,
    ok = 0;
  const refsSet = new Set(PRODUCTS.map(p => p.ref));
  arr.forEach(file => {
    let ref = forceRef;
    if (!ref) {
      const base = file.name.replace(/\.[^.]+$/, '');
      const m = base.match(/G\d{3}|\d{2,4}/gi);
      if (m) {
        for (const c of m) {
          const cc = c.toUpperCase();
          if (refsSet.has(cc)) {
            ref = cc;
            break;
          }
        }
      }
    }
    const fin = () => {
      if (++done === arr.length) {
        saveUPhotos();
        renderListIfEditor();
        if (S.cur) drawGondola();
        toast(ok ? `${ok} photo${ok>1?'s':''} importée${ok>1?'s':''}` : 'Aucune réf. reconnue dans les noms de fichiers');
      }
    };
    if (!ref) {
      fin();
      return;
    }
    const rd = new FileReader();
    rd.onload = () => {
      // détourage sur fond transparent + recadrage, puis stockage
      detourImage(rd.result).then(clean => {
        UPHOTO[ref] = clean;
        dropShortURL(ref);
        delete PBOX[ref];
        ok++;
        fin();
      }).catch(fin);
    };
    rd.onerror = fin;
    rd.readAsDataURL(file);
  });
}

function renderListIfEditor() {

function pickPhotos(forceRef) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  if (!forceRef) inp.multiple = true;
  inp.onchange = () => {
    closeSheet();

  };
  inp.click();
}

function resolvePhoto(ref, cb) {
  if (PHOTO[ref] !== undefined) {
    cb && cb();
    return;
  }
  const cands = photoCandidates(ref);
  let i = 0;
  const tryNext = () => {
    if (i >= cands.length) {
      PHOTO[ref] = 'none';
      savePhotoMap();
      cb && cb();
      return;
    }
    const im = new Image();
    const u = cands[i++];
    im.onload = () => {
      PHOTO[ref] = u;
      savePhotoMap();
      cb && cb();
    };
    im.onerror = tryNext;
    im.src = u;
  };
  tryNext();
}
let photoQueue = [],
  photoBusy = 0;

function queuePhotos(refs) {
  refs.forEach(r => {
    if (PHOTO[r] === undefined && !photoQueue.includes(r)) photoQueue.push(r);
  });
  pumpPhotos();
}

function pumpPhotos() {
  while (photoBusy < 4 && photoQueue.length) {
    const r = photoQueue.shift();
    photoBusy++;
    resolvePhoto(r, () => {
      photoBusy--;
      refreshPhoto(r);
      queueDetour(r);
      pumpPhotos();
    });
  }
}

/* Une fois la photo trouvée sur le site, on la rapatrie et on efface son fond blanc,
   sans rien demander. C'est ce qui la rend nette dans le rayon, disponible hors ligne
   et incorporable aux exports. Deux à la fois pour ne pas saturer la connexion. */
let detourQueue = [], detourBusy = 0;

function queueDetour(ref) {
  if (UPHOTO[ref] || !PHOTO[ref] || PHOTO[ref] === 'none') return;
  if (!detourQueue.includes(ref)) detourQueue.push(ref);
  pumpDetour();
}

function pumpDetour() {
  while (detourBusy < 2 && detourQueue.length) {
    const r = detourQueue.shift();
    detourBusy++;
    fetchAndDetour([r]).then(() => {
      detourBusy--;
      refreshPhoto(r);
      pumpDetour();
    }).catch(() => {
      detourBusy--;
      pumpDetour();
    });
  }
}

function refreshPhoto(ref) {
  ensureBox(ref);
  document.querySelectorAll(`img[data-ph="${ref}"]`).forEach(im => {
    im.src = photoSrc(ref);
  });
  if (S.cur && S.cur.shelves.some(s => s.items.some(i => i.ref === ref))) drawGondola();
}

function resetPhotos() {
  PHOTO = {};
  savePhotoMap();
  photoQueue = [];
  queuePhotos(PRODUCTS.filter(p => p.univ === S.univ).map(p => p.ref));
  toast('Chargement des photos depuis bubimex.eu…');
}

function undo() {
  if (S.hi > 0) {

    S.cur = JSON.parse(S.hist[S.hi]);

    update();

function redo() {

/* Couleur de famille pour les miniatures : merchandising, pas blueprint. */
function familyColor(p) {
  if (!p) return 'var(--bubi-cream)';
  if (p.cat === 'Gustav') return 'var(--bubi-sage)';
  if (p.cat === "William's") return 'var(--bubi-terracotta)';
  return parseInt(p.fmt) <= 85 ? 'var(--bubi-ochre)' : 'var(--bubi-cream)';
}

function thumb(p) {
  const W = p.W, H = p.H, sh = H / p.shelves.length;
  let s = `<svg viewBox="-3 0 ${W + 6} ${H + 3}" preserveAspectRatio="xMidYMid meet"><rect x="0" width="${W}" height="${H}" fill="var(--bubi-surface)"/>`;
  s += `<rect x="-3" y="0" width="3" height="${H + 3}" fill="var(--bubi-blueprint)"/><rect x="${W}" y="0" width="3" height="${H + 3}" fill="var(--bubi-blueprint)"/>`;
  p.shelves.forEach((shelf, i) => {
    const y = (i + 1) * sh;
    let x = 0;
    shelf.items.forEach(it => {
      if (it.gap) { x += it.gap; return; }
      const pr = BY_REF[it.ref];
      if (!pr) return;
      const w = pr.w * it.f, h = Math.min(pr.h * (it.s || 1), sh * .88);
      s += `<rect x="${x}" y="${y - h}" width="${w - .4}" height="${h}" rx=".8" fill="${familyColor(pr)}"/>`;
      x += w;
    });
    s += `<rect x="0" y="${y - 1.2}" width="${W}" height="2.4" fill="var(--bubi-shelf)"/>`;
  });
  return s + '</svg>';
}

function submitProject(edit) {
  const v = id => $(id).value.trim();
  const st = v('f_store'),
    name = v('f_name'),
    univ = v('f_univ') || 'chien',
    W = +v('f_W'),
    H = +v('f_H'),
    D = +v('f_D'),
    N = +v('f_N');
  const errs = [];
  if (!st) errs.push('Nom du magasin obligatoire');
  if (!name) errs.push('Nom du projet obligatoire');
  if (!(W >= 30 && W <= 400)) errs.push('Largeur entre 30 et 400 cm');
  if (!(H >= 30 && H <= 300)) errs.push('Hauteur entre 30 et 300 cm');
  if (!(D >= 10 && D <= 100)) errs.push('Profondeur entre 10 et 100 cm');
  if (!(Number.isInteger(N) && N >= 1 && N <= 15)) errs.push('Niveaux : entier entre 1 et 15');
  if (errs.length) {
    $('ferr').innerHTML = `<div class="err">${errs.map(esc).join('<br>')}</div>`;
    return;
  }
  if (edit) {
    Object.assign(S.cur, {
      store: st,
      name,
      univ,
      W,
      H,
      D
    });
    while (S.cur.shelves.length < N) S.cur.shelves.push({
      items: []
    });
    S.cur.shelves.length = N;
    S.shelf = Math.min(S.shelf, N - 1);
    S.univ = univ;
    S.fmt = '';
    closeSheet();
    renderEditor();
    commit('Gondole modifiée');
  } else {
    const p = {
      id: uid(),
      store: st,
      name,
      univ,
      W,
      H,
      D,
      shelves: Array.from({
        length: N
      }, () => ({
        items: []
      })),
      created: Date.now(),
      updated: Date.now()
    };
    S.projects.push(p);
    store.save(S.projects);
    closeSheet();
    openProject(p.id);
  }
}

function addProduct(ref) {
  const p = BY_REF[ref];
  if (!p || !S.cur) return;
  if (shelfW(S.cur.shelves[S.shelf]) + p.w >S.cur.W) {
    let next = -1;
    for (let i = S.shelf + 1; i < S.cur.shelves.length; i++) {
      if (shelfW(S.cur.shelves[i]) + p.w <= S.cur.W) {
        next = i;
        break;
      }
    }
    if (next < 0) {
      toast(`Niveau ${S.shelf+1} plein, aucun niveau libre en dessous`);
      return;
    }
    S.shelf = next;
  }
  const items = S.cur.shelves[S.shelf].items;
  // le produit se pose du côté choisi dans la barre du tiroir
  const last = S.side === 'left' ? items[0] : items[items.length - 1];
  const df = Math.max(1, Math.min(p.df, Math.floor((S.cur.W - shelfW(S.cur.shelves[S.shelf])) / p.w)));
  const nouveau = { id: uid(), ref, f: df, s: p.st };
  if (S.insertAt != null) {
    // on pose à l'endroit exact tapé sur le rayon
    let acc = 0, at = items.length;
    for (let k = 0; k < items.length; k++) {
      const wIt = items[k].gap || BY_REF[items[k].ref].w * items[k].f;
      if (S.insertAt < acc + wIt / 2) { at = k; break; }
      acc += wIt;
    }
    items.splice(at, 0, nouveau);
    S.insertAt = null;
  } else if (last && last.ref === ref) last.f += df;
  else if (S.side === 'left') items.unshift(nouveau);
  else items.push(nouveau);
  let msg = `${p.ref} → niveau ${S.shelf+1}`;
  if (S.cur.W - shelfW(S.cur.shelves[S.shelf]) < 6.5 && S.shelf < S.cur.shelves.length - 1) {
    S.shelf++;
    msg += ` · plein, suite niveau ${S.shelf+1}`;
  }
  fresh = nouveau.id;
  snap();
  persist();
  update();
  refreshCounts();
  offerUndo(msg);
  haptic();
  setTimeout(() => { fresh = null; }, 400);
}

/* ================= BUBIPLAN PRO : SPACE PLANNING ================= */

function scopeRefs(scope = 'current') {
  if (scope === 'current') return [...new Set(S.cur.shelves.flatMap(s => s.items.map(i => i.ref)))];
  let a = PRODUCTS.filter(p => p.univ === S.univ);
  if (scope === 'filtered') {
    if (S.cat) a = a.filter(p => p.cat === S.cat);
    if (S.fmt) a = a.filter(p => p.fg === S.fmt);
    const q = S.q.toLowerCase().trim();
    if (q) a = a.filter(p => p.name.toLowerCase().includes(q) || p.ref.toLowerCase().includes(q));
  }
  return a.map(p => p.ref);
}

function spaceCalc(refs, targetDays = 14, minF = 1, maxF = 6, occupancy = .92) {
  const rows = refs.map(ref => {
    const p = BY_REF[ref],
      f = targetFacings(ref, targetDays, minF, maxF),
      lin = p.w * f,
      dep = depthCapacity(p),
      cap = f * (p.st || 1) * dep,
      d = perf(ref),
      dos = (+d.unitsWeek || 0) > 0 ? cap / (+d.unitsWeek / 7) : null;
    return {
      ref,
      p,
      f,
      lin,
      dep,
      cap,
      dos
    };
  });
  const linear = rows.reduce((a, r) => a + r.lin, 0),
    usable = S.cur.W * Math.max(.5, Math.min(.99, occupancy)),
    levels = Math.max(1, Math.ceil(linear / usable));
  const totalFront = S.cur.W * levels,
    neededWidth = Math.ceil(linear / levels),
    heightNeeded = Math.max(...rows.map(r => r.p.h * (r.p.st || 1)), 0) * levels;
  const bays = [66, 100, 133, 200, 266, 300, 400, 500];
  let rec = bays.find(x => x * levels >= linear / occupancy) || Math.ceil(linear / (levels * 10)) * 10;
  return {
    rows,
    linear,
    levels,
    totalFront,
    neededWidth,
    heightNeeded,
    rec,
    occupancy
  };
}

        S.projects = d.projects;

        if (d.userPhotos && typeof d.userPhotos === 'object') {
